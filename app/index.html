<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bastion Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0B1220;
  color:#E5E7EB;
  display:flex;
}
.sidebar { width:220px; background:#111827; padding:20px; }
.main { flex:1; padding:20px; }
.card { background:#111827; padding:15px; margin-top:15px; border-radius:10px; }
</style>
</head>

<body>

<div class="sidebar">
  <h2>Bastion</h2>

  <label>Age Now</label>
  <input id="age-now" type="number" value="35">

  <label>Retirement Age</label>
  <input id="age-ret" type="number" value="65">

  <label>Status</label>
  <select id="status">
    <option value="single">Single</option>
    <option value="married">Married</option>
  </select>

  <label>Dependents</label>
  <input id="deps" type="number" value="0">
</div>

<div class="main">

  <h1>Dashboard</h1>

  <div class="card">
    <h3>Income</h3>
    <div id="income-cont"></div>
    <button onclick="addRow('income')">+ Add Income</button>
  </div>

  <div class="card">
    <h3>Assets</h3>
    <div id="asset-cont"></div>
    <button onclick="addRow('asset')">+ Add Asset</button>
  </div>

  <div class="card">
    <h3>Results</h3>
    <div>Total Wealth: <span id="res-wealth">$0</span></div>
    <div>Total Tax: <span id="res-tax">$0</span></div>
  </div>

  <div class="card">
    <h3>Projection</h3>
    <canvas id="mainChart"></canvas>
  </div>

  <div class="card">
    <h3>Audit</h3>
    <div id="logic-content"></div>
  </div>

</div>

<script src="./js/engine.js"></script>
<script src="./js/modules.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/ai-gate.js"></script>

</body>
</html>
