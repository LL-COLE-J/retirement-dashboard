<!DOCTYPE html>
<html>
<head>
  <title>Bastion</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>

<div class="sidebar">
  <h2>Bastion</h2>

  <label>Age Now</label>
  <input id="ageNow" value="35">

  <label>Retirement Age</label>
  <input id="retireAge" value="65">

  <label>Status</label>
  <select id="status">
    <option value="single">Single</option>
    <option value="married_joint">Married</option>
  </select>

  <label>Dependents</label>
  <input id="deps" value="0">
</div>

<div class="main">

  <h1>Dashboard</h1>

  <div class="card">
    <h3>Income</h3>
    <div id="incomeRows"></div>
    <button onclick="addIncome()">+ Add Income</button>
  </div>

  <div class="card">
    <h3>Assets</h3>
    <div id="assetRows"></div>
    <button onclick="addAsset()">+ Add Asset</button>
  </div>

  <div class="card">
    <h3>Results</h3>
    <div id="results"></div>
  </div>

</div>

<script src="./js/engine.js"></script>
<script src="./js/modules.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/ai-gate.js"></script>

</body>
</html>
