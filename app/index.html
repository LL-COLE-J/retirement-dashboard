<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insight Beta</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',system-ui;
  background:#0B1220;
  color:#E5E7EB;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  text-align:center;
  max-width:420px;
}

input{
  padding:12px;
  margin:6px;
  width:240px;
  border-radius:8px;
  border:none;
}

button{
  padding:12px 16px;
  margin:6px;
  border:none;
  border-radius:8px;
  background:#3B82F6;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#2563EB;
}
</style>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
   apiKey: "AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
  authDomain: "retirement-dashboard-4c0d3.firebaseapp.com",
  projectId: "retirement-dashboard-4c0d3",
  storageBucket: "retirement-dashboard-4c0d3.firebasestorage.app",
  messagingSenderId: "842171307258",
  appId: "1:842171307258:web:d84a33e6509b3847996543"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signup = () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, pass)
    .then(() => alert("Account created"))
    .catch(e => alert(e.message));
};

window.login = () => {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, pass)
    .then(() => alert("Logged in"))
    .catch(e => alert(e.message));
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user").innerText = user.email;
  }
});
</script>

</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="auth">
    <h2>Beta Access</h2>

    <input id="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>

    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>

  <!-- APP (after login) -->
  <div id="app" style="display:none;">
    <h2>You're in</h2>
    <p id="user"></p>

    <button onclick="logout()">Logout</button>

    <p style="opacity:.6; margin-top:20px;">
      Next step: hook your Bastion dashboard here
    </p>
  </div>

</div>

</body>
</html>
