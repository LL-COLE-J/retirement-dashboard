name: Bastion Check

on:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "app/**"
      - "APP_SHELL_NORMALIZATION.md"
      - "AGENTS.md"
      - "SAVE_STATE.md"
      - "ROADMAP.md"
      - "REGRESSION_CHECKLIST.md"
      - ".github/workflows/bastion-check.yml"

concurrency:
  group: retirement-dashboard-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify structure
        run: |
          test -f index.html || exit 1
          test -f app/index.html || exit 1
          test -f APP_SHELL_NORMALIZATION.md || exit 1
          test -f AGENTS.md || exit 1
          test -f SAVE_STATE.md || exit 1
          test -f ROADMAP.md || exit 1
          test -f REGRESSION_CHECKLIST.md || exit 1
          grep -q 'Canonical app shell path: `index.html` at the repository root.' APP_SHELL_NORMALIZATION.md
          grep -q "url=../index.html" app/index.html

      - name: Success
        run: echo "Bastion check passed"
