<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#0B0F1A;color:white;font-family:Inter,Arial;display:flex}
.sidebar{width:220px;background:#0F172A;padding:20px}
.nav-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:6px}
.nav-item:hover{background:#1E293B}
.main{flex:1;padding:20px}
.card{background:#111827;padding:16px;margin-bottom:14px;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
input,select{width:100%;margin-top:5px;padding:8px;background:#1F2937;color:white;border:none;border-radius:6px}
button{margin-top:10px;padding:8px;background:#3B82F6;color:white;border:none;border-radius:6px}
.row{display:flex;gap:6px;margin-top:6px}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
</div>

<div class="main">

<div id="dashboard">

<div class="grid">
<div class="card">Net Worth<div id="nw"></div></div>
<div class="card">Income<div id="inc"></div></div>
<div class="card">Expenses<div id="expOut"></div></div>
<div class="card">Success %<div id="succ"></div></div>
</div>

<div class="card"><canvas id="chart"></canvas></div>

<div class="card">
<h4>Milestones</h4>
<div id="milestonesOut"></div>
</div>

<div class="card">
<h4>Top Spending</h4>
<div id="categoryOut"></div>
</div>

<div class="card" id="taxExplain"></div>

</div>

<div id="financials" style="display:none">

<div class="card">
<h3>Income</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Add</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Add</button>
</div>

<div class="card">
<h3>Events</h3>
<div id="eventList"></div>
<button onclick="addEvent()">+ Add Event</button>
</div>

<div class="card">
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

<div class="card">
<select id="filing">
<option value="single">Single</option>
<option value="married_joint">Married Joint</option>
<option value="head">Head</option>
</select>
</div>

</div>

</div>

<script src="modules.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>

</body>
</html>
