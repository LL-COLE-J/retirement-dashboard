<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{width:240px;background:#fff;border-right:1px solid var(--border);padding:20px;}
.logo img{width:100%;margin-bottom:20px;}

.nav-item{padding:10px;border-radius:8px;cursor:pointer;color:var(--sub);margin-bottom:6px;}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}
.wrapper{width:1200px;display:flex;gap:20px;padding:20px;}
.content{flex:2;}
.side{flex:1;}

.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.row{margin-bottom:12px;}
.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo-full.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
<div class="nav-item" onclick="showView('markets',this)">Markets</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax Profile</h4>
<select id="stateSelect"></select>
<select onchange="state.filing=this.value">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Accounts</h4>
<div id="accountList"></div>
<button onclick="addAccount()">Add Account</button>
</div>

<div class="card">
<h4>Assets</h4>
<div id="assetList"></div>
<button onclick="addAsset()">Add Asset</button>
</div>

<div class="card">
<h4>Liabilities</h4>
<div id="liabilityList"></div>
<button onclick="addLiability()">Add Liability</button>
</div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="grid">
<div class="card">
<h4>Age & Retirement</h4>
<input id="currentAge" value="40">
<input id="retirementAge" value="65">
<input id="lifeExpectancy" value="90">
</div>
</div>
</div>

<!-- MARKETS -->
<div id="markets" style="display:none">
<div class="grid">

<div class="card">
<h4>Your Tickers</h4>
<div id="tickerList"></div>
<input id="newTicker" placeholder="AAPL">
<button onclick="addTicker()">Add</button>
</div>

</div>
</div>

</div>

<div class="side">

<div class="card"><h4>Status</h4><div id="status"></div></div>
<div class="card"><h4>Failure</h4><div id="failure"></div></div>
<div class="card"><h4>Action</h4><div id="action"></div></div>

<div class="card">
<h4>Market</h4>
<div id="marketOverview"></div>
</div>

<div class="card"><h4>AI</h4><div id="aiOutput"></div></div>

</div>

</div>
</div>

<script>

/* =========================
   SAFE NUMBER
========================= */
function cleanNumber(val){
  if(!val) return 0;
  return parseFloat(val.toString().replace(/[^0-9.-]/g,'')) || 0;
}

function money(n){
  return "$" + Number(n || 0).toLocaleString();
}

/* =========================
   STATE (LOCKED STRUCTURE)
========================= */

let state = {
  incomes: [],
  expenses: [],
  accounts: [
    {type:"checking", balance:0},
    {type:"401k", balance:0, contrib:0, match:0},
    {type:"roth", balance:0, contrib:0},
    {type:"brokerage", balance:0},
    {type:"hsa", balance:0}
  ],
  dependents: [],
  assets: {
    cash: 0,
    invest: 0,
    debt: 0
  },
  filing: "single"
};

/* =========================
   ENGINE (UNCHANGED LOGIC)
========================= */

function norm(a,f){
  return cleanNumber(a)*(f==="monthly"?12:f==="biweekly"?26:1);
}

function calculate(){

  let income = state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
  let expenses = state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);

  let depCost = state.dependents.reduce((s,d)=>s+d.cost,0);
  expenses += depCost;

  let contrib = state.accounts.reduce((s,a)=>s + (a.contrib || 0),0);

  let match = state.accounts.reduce((s,a)=>{
    if(a.match) return s + (a.contrib * a.match / 100);
    return s;
  },0);

  let totalSavings = contrib + match;

  let net = income - expenses - contrib;

  let accountValue = state.accounts.reduce((s,a)=>s + (a.balance || 0),0);

  let netWorth =
    accountValue +
    (state.assets.cash||0) +
    (state.assets.invest||0) -
    (state.assets.debt||0);

  let savingsRate = income > 0 ? ((income - expenses) / income) * 100 : 0;

  return {
    income,expenses,net,netWorth,savingsRate,contrib,match,totalSavings
  };
}

/* =========================
   ADVISOR (NEW)
========================= */

function runAdvisor(d){

  let insights = [];
  let actions = [];

  if(d.savingsRate < 10){
    insights.push("Savings rate is critically low");
    actions.push("Increase savings to 15%+");
  }

  if(d.net <= 0){
    insights.push("You are running a deficit");
    actions.push("Reduce expenses or increase income");
  }

  let housing = state.expenses
    .filter(e=>e.cat==="housing")
    .reduce((s,e)=>s+norm(e.amount,e.freq),0);

  if(housing > d.income * 0.35){
    insights.push("Housing exceeds 35% of income");
    actions.push("Reduce housing cost");
  }

  return {insights,actions};
}

/* =========================
   NAVIGATION (UNCHANGED)
========================= */

function showView(v,e){
  ["dashboard","financials","scenarios","markets"].forEach(id=>{
    let el = document.getElementById(id);
    if(el) el.style.display="none";
  });

  document.getElementById(v).style.display="block";

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  if(e) e.classList.add("active");
}

/* =========================
   RENDER ALL (LOCKED)
========================= */

function renderAll(){
  renderDashboard();
  renderFinancials();
}

/* =========================
   COMMIT (LOCKED)
========================= */

function commit(){
  renderAll();
}

/* =========================
   DASHBOARD
========================= */

function renderDashboard(){

  let d = calculate();
  let adv = runAdvisor(d);

  netWorth.innerText = money(d.netWorth);
  income.innerText = money(d.income);
  expensesOut.innerText = money(d.expenses);
  savingsRate.innerText = d.savingsRate.toFixed(1)+"%";

  status.innerText = d.net > 0 ? "Surplus" : "Deficit";
  failure.innerText = "";
  action.innerText = "";

  aiOutput.innerText =
    adv.insights.concat(adv.actions).join("\n");
}

/* =========================
   FINANCIALS (PATCHED ONLY)
========================= */

function renderFinancials(){

  document.getElementById("incomeList").innerHTML =
    state.incomes.map((i,idx)=>`
      <div class="row">
        <select onchange="state.incomes[${idx}].type=this.value;commit()">
          <option>salary</option>
          <option>bonus</option>
          <option>side</option>
          <option>passive</option>
        </select>

        <input value="${i.amount||""}"
          onblur="state.incomes[${idx}].amount=+this.value||0;commit()">

        <select onchange="state.incomes[${idx}].freq=this.value;commit()">
          <option>yearly</option>
          <option>monthly</option>
          <option>biweekly</option>
        </select>
      </div>
    `).join("");

  document.getElementById("expenseList").innerHTML =
    state.expenses.map((e,idx)=>`
      <div class="row">
        <input value="${e.amount||""}"
          onblur="state.expenses[${idx}].amount=+this.value||0;commit()">

        <select onchange="state.expenses[${idx}].freq=this.value;commit()">
          <option>yearly</option>
          <option>monthly</option>
        </select>

        <select onchange="state.expenses[${idx}].cat=this.value;commit()">
          <option>housing</option>
          <option>food</option>
          <option>transport</option>
          <option>insurance</option>
          <option>utilities</option>
          <option>healthcare</option>
          <option>debt</option>
          <option>entertainment</option>
          <option>other</option>
        </select>
      </div>
    `).join("");
}

/* =========================
   ADDERS
========================= */

function addIncome(){state.incomes.push({amount:0,freq:"yearly"});renderAll();}
function addExpense(){state.expenses.push({amount:0,freq:"monthly",cat:"housing"});renderAll();}

/* =========================
   INIT
========================= */
/* =========================
   FIX: ADD FUNCTIONS (MISSING)
========================= */

function addAccount(){
  state.accounts.push({type:"401k",balance:0,contrib:0,match:0});
  render();
}

function addAsset(){
  state.assets.cash += 0; // keeps structure intact
  render();
}

function addLiability(){
  state.assets.debt += 0;
  render();
}

/* =========================
   FIX: TAX STATE DROPDOWN
========================= */

const states = [
  "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA",
  "HI","ID","IL","IN","IA","KS","KY","LA","ME","MD",
  "MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ",
  "NM","NY","NC","ND","OH","OK","OR","PA","RI","SC",
  "SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"
];

function initStateSelect(){
  const el = document.getElementById("stateSelect");
  if(!el) return;

  el.innerHTML = states.map(s=>`<option>${s}</option>`).join("");

  el.onchange = function(){
    state.taxState = this.value;
  };
}

/* =========================
   FIX: CAPITALIZE DROPDOWNS
========================= */

function cap(str){
  return str.charAt(0).toUpperCase() + str.slice(1);
}
window.onload = renderAll;

</script>
</body>
</html>
