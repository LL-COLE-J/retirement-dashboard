<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg:#0B0F1A;
--sidebar:#0F172A;
--card:#111827;
--text:#E5E7EB;
--sub:#9CA3AF;
}

.light{
--bg:#F9FAFB;
--sidebar:#FFFFFF;
--card:#FFFFFF;
--text:#111827;
--sub:#6B7280;
}

body{
margin:0;
font-family:Inter;
background:var(--bg);
color:var(--text);
display:flex;
height:100vh;
}

/* layout */
.sidebar{
width:220px;
background:var(--sidebar);
padding:20px;
}
.logo{
font-weight:600;
margin-bottom:20px;
}
.nav-item{
margin:10px 0;
color:var(--sub);
cursor:pointer;
}
.nav-item.active{color:var(--text);}

.main{
flex:1;
padding:20px;
overflow:auto;
}

.ai{
width:260px;
background:var(--sidebar);
padding:15px;
border-left:1px solid #222;
}

/* cards */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.chartGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.card{
background:var(--card);
padding:12px;
border-radius:10px;
}

/* inputs */
input{
width:100%;
margin-top:8px;
padding:8px;
background:#1F2937;
border:none;
color:white;
border-radius:6px;
}

.light input{
background:#E5E7EB;
color:black;
}

h4{margin-top:12px;}

canvas{max-height:200px;}
button{
margin-top:10px;
padding:8px;
background:#3B82F6;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">AVORA</div>

<div class="nav-item active" onclick="showView('dashboard', this)">Dashboard</div>
<div class="nav-item" onclick="showView('inputs', this)">Financials</div>

<button onclick="toggleTheme()">Toggle Theme</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboardView">

<div class="grid">
<div class="card">Net Worth<div id="netWorth">$0</div></div>
<div class="card">Annual Income<div id="incomeTotal">$0</div></div>
<div class="card">Annual Expenses<div id="expenseTotal">$0</div></div>
<div class="card">Years Covered<div id="years">--</div></div>
</div>

<div class="chartGrid">
<div class="card"><canvas id="projectionChart"></canvas></div>
<div class="card"><canvas id="cashflowChart"></canvas></div>
<div class="card"><canvas id="netFlowChart"></canvas></div>
<div class="card"><canvas id="riskChart"></canvas></div>
</div>

</div>

<!-- FINANCIALS -->
<div id="inputView" style="display:none">

<div class="card">

<h4>Person A</h4>
<input id="incomeA" placeholder="Annual Income (A)">
<input id="ageA" placeholder="Age (A)">

<h4>Person B</h4>
<input id="incomeB" placeholder="Annual Income (B)">
<input id="ageB" placeholder="Age (B)">

<h4>Household</h4>
<input id="cash" placeholder="Cash">
<input id="investments" placeholder="Investments">
<input id="expenses" placeholder="Annual Expenses">

<h4>Planning</h4>
<input id="retAge" placeholder="Retirement Age">
<input id="lifeExp" placeholder="Life Expectancy">

</div>

</div>

</div>

<!-- AI PANEL -->
<div class="ai">
<h4>AI Advisor</h4>
<div id="aiOutput"></div>
</div>

<script>

let charts={};

/* NAV FIXED */
function showView(view, el){

const dash=document.getElementById("dashboardView");
const input=document.getElementById("inputView");

if(dash) dash.style.display="none";
if(input) input.style.display="none";

if(view==="dashboard") dash.style.display="block";
if(view==="inputs") input.style.display="block";

document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
if(el) el.classList.add("active");
}

/* MODEL */
function buildModel(total,income,exp,age,ret,life){

let bal=total;
let t=[];
let years=Math.max(life-age,1);

for(let y=0;y<years;y++){

let cur=age+y;
let inc=cur<ret?income:0;
let ex=exp*Math.pow(1.025,y);

bal+=bal*0.05+inc-ex;

t.push({age:cur,bal,inc,ex});

if(bal<=0) break;
}

return t;
}

/* UPDATE (NO OVERWRITES) */
function updateAll(){

let income=(+incomeA.value||0)+(+incomeB.value||0);
let total=(+cash.value||0)+(+investments.value||0);
let exp=+expenses.value||0;

let age=Math.min(+ageA.value||65,+ageB.value||65);
let ret=+retAge.value||65;
let life=+lifeExp.value||90;

let m=buildModel(total,income,exp,age,ret,life);

/* KPIs */
document.getElementById("netWorth").innerText="$"+total.toLocaleString();
document.getElementById("incomeTotal").innerText="$"+income.toLocaleString();
document.getElementById("expenseTotal").innerText="$"+exp.toLocaleString();
document.getElementById("years").innerText=m.length;

/* charts */
renderCharts(m);

/* AI */
let ai=[];
if(m.length<25) ai.push("⚠️ Risk of running out early");
else ai.push("✅ Plan sustainable");

if(income<exp) ai.push("⚠️ Annual expenses exceed income");

document.getElementById("aiOutput").innerHTML=ai.join("<br><br>");
}

/* CHARTS */
function renderCharts(m){

const ctx1=document.getElementById("projectionChart").getContext("2d");
const ctx2=document.getElementById("cashflowChart").getContext("2d");
const ctx3=document.getElementById("netFlowChart").getContext("2d");
const ctx4=document.getElementById("riskChart").getContext("2d");

let labels=m.map(x=>x.age);
let bal=m.map(x=>x.bal);
let inc=m.map(x=>x.inc);
let exp=m.map(x=>x.ex);
let net=m.map(x=>x.inc-x.ex);

Object.values(charts).forEach(c=>c.destroy());

charts.p=new Chart(ctx1,{type:"line",data:{labels,datasets:[{label:"Net Worth",data:bal}]}});
charts.c=new Chart(ctx2,{type:"line",data:{labels,datasets:[
{label:"Income",data:inc},
{label:"Expenses",data:exp}
]}});
charts.n=new Chart(ctx3,{type:"line",data:{labels,datasets:[{label:"Net Flow",data:net}]}});
charts.r=new Chart(ctx4,{type:"bar",data:{labels:["Years"],datasets:[{data:[m.length]}]}});
}

/* THEME */
function toggleTheme(){
document.body.classList.toggle("light");
localStorage.setItem("theme",document.body.classList.contains("light"));
}

if(localStorage.getItem("theme")==="true"){
document.body.classList.add("light");
}

/* AUTO UPDATE */
document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",updateAll);
});

/* INIT */
window.onload=updateAll;

</script>

</body>
</html>
