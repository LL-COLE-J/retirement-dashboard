<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Bastion | Planning Lab Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo">BASTION <small>PRO</small></div>
        <div class="nav-item active" onclick="switchTab('dashboard')">Dashboard</div>
        <div class="nav-item" onclick="switchTab('financials')">Financials</div>
        <div class="nav-item" onclick="switchTab('markets')">Markets</div>
    </div>

    <main class="main-content">
        <div id="financials-tab" class="tab-content" style="display:none;">
            <div class="grid-2">
                <div class="col">
                    <div class="card">
                        <h3>Tax Accountant</h3>
                        <label>Filing Status</label>
                        <select id="filing" onchange="updateTaxProfile('filing', this.value)">
                            <option value="single">Single</option>
                            <option value="married">Married Filing Jointly</option>
                        </select>
                        <label>State of Residence</label>
                        <select id="residence" onchange="updateTaxProfile('residence', this.value)">
                            <option value="TN">Tennessee (0%)</option>
                            <option value="TX">Texas (0%)</option>
                            <option value="CA">California (Graduated)</option>
                            <option value="NY">New York (Graduated)</option>
                        </select>
                    </div>
                    <div class="card">
                        <h3>Income Streams</h3>
                        <div id="income-list"></div>
                        <button onclick="addIncomeLine()">+ Add Income</button>
                    </div>
                </div>
                <div class="col">
                    <div class="card planning-report">
                        <h3>Financial Planner Report</h3>
                        <div id="tax-report-ui"></div>
                    </div>
                    <div class="card">
                        <h3>Banker (Assets & Liabilities)</h3>
                        <div id="account-list"></div>
                        <button onclick="addAccountLine()">+ Add Account</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="markets-tab" class="tab-content" style="display:none;">
            <div class="card ticker-card">
                <h3>Live Market Pulse</h3>
                <div class="input-group">
                    <input type="text" id="ticker-input" placeholder="Symbol (e.g. AAPL)">
                    <button onclick="refreshTicker()">Update Price</button>
                </div>
                <div id="ticker-output" class="big-price">--</div>
            </div>
        </div>
    </main>

    <script src="engine.js"></script>
    <script src="ui.js"></script>
</body>
</html>
