<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

/* ===== RESET ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }

/* ===== COLORS ===== */
:root {
  --bg:#0B0F1A;
  --sidebar:#0F172A;
  --card:#111827;
  --card-light:#1F2937;
  --text-primary:#E5E7EB;
  --text-secondary:#9CA3AF;
  --border:rgba(255,255,255,0.05);
  --gradient:linear-gradient(135deg,#3B82F6,#6366F1);
}

/* ===== LAYOUT ===== */
body { background:var(--bg); color:var(--text-primary); display:flex; height:100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width:240px; background:var(--sidebar);
  display:flex; flex-direction:column;
  padding:20px; border-right:1px solid var(--border);
}

.logo { font-size:20px; font-weight:600; margin-bottom:30px; }

.nav-item {
  padding:12px 14px; border-radius:10px;
  color:var(--text-secondary); margin-bottom:8px;
  cursor:pointer; transition:0.2s;
}

.nav-item:hover { background:var(--card); color:white; }
.nav-item.active { background:var(--gradient); color:white; }

/* ===== MAIN ===== */
.main { flex:1; display:flex; flex-direction:column; }

/* ===== TOPBAR ===== */
.topbar {
  height:70px; display:flex; align-items:center;
  justify-content:space-between; padding:0 30px;
  border-bottom:1px solid var(--border);
}

.topbar-title { font-size:18px; }

/* ===== CONTENT ===== */
.content { padding:30px; overflow-y:auto; }

/* ===== GRID ===== */
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }

/* ===== CARDS ===== */
.card {
  background:var(--card);
  border-radius:14px;
  padding:20px;
  border:1px solid var(--border);
}

/* ===== KPI ===== */
.kpi-title { font-size:13px; color:var(--text-secondary); }
.kpi-value { font-size:26px; margin-top:8px; font-weight:600; }
.kpi-sub { font-size:12px; margin-top:6px; }

/* ===== FORM ===== */
input {
  width:100%;
  padding:10px;
  margin-top:8px;
  background:var(--card-light);
  border:none;
  border-radius:8px;
  color:white;
}

button {
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--gradient);
  color:white;
  cursor:pointer;
}

.section { margin-top:30px; }

/* ===== RESPONSIVE ===== */
@media (max-width:1100px){
  .grid { grid-template-columns:repeat(2,1fr); }
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">AVORA</div>
  <div class="nav-item active">Dashboard</div>
  <div class="nav-item">Scenarios</div>
  <div class="nav-item">Advisor</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-title">Retirement Overview</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- KPI GRID -->
    <div class="grid">

      <div class="card">
        <div class="kpi-title">Net Worth</div>
        <div id="netWorth" class="kpi-value">$0</div>
      </div>

      <div class="card">
        <div class="kpi-title">Monthly Surplus</div>
        <div id="surplus" class="kpi-value">$0</div>
      </div>

      <div class="card">
        <div class="kpi-title">Years Covered</div>
        <div id="years" class="kpi-value">--</div>
      </div>

      <div class="card">
        <div class="kpi-title">Retirement Score</div>
        <div id="score" class="kpi-value">--</div>
        <div id="scoreHint" class="kpi-sub"></div>
      </div>

    </div>

    <!-- INPUT SECTION -->
    <div class="section card">
      <h3>Financial Snapshot</h3>

      <input id="savings" placeholder="Total Savings">
      <input id="income" placeholder="Monthly Income">
      <input id="expenses" placeholder="Monthly Expenses">

      <button onclick="saveData()">Update Dashboard</button>
    </div>

    <!-- SCENARIO -->
    <div class="section card">
      <h3>Scenario</h3>

      <input id="scSavings" placeholder="Savings">
      <input id="scSpend" placeholder="Monthly Spend">

      <button onclick="runScenario()">Run Scenario</button>

      <div id="scenarioResult" style="margin-top:10px;"></div>
    </div>

    <!-- ADVISOR -->
    <div class="section card">
      <h3>Advisor Review</h3>

      <input id="advisorInput" placeholder="Paste recommendation...">

      <button onclick="analyzeAdvisor()">Analyze</button>

      <div id="advisorOutput"></div>
    </div>

  </div>
</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
  authDomain: "retirement-dashboard-4c0d3.firebaseapp.com",
  projectId: "retirement-dashboard-4c0d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ENGINE */
function buildFinancialModelV2(inputs) {

  let { liquidAssets, income, expenses, assumptions } = inputs;

  let balance = liquidAssets;

  for (let year = 0; year < assumptions.years; year++) {

    const yearlyIncome = income * 12;
    const yearlyExpenses = expenses * 12 * Math.pow(1 + assumptions.inflation, year);
    const growth = balance * assumptions.returnRate;

    balance = balance + growth + yearlyIncome - yearlyExpenses;

    if (balance <= 0) {
      return { success:false, yearsCovered:year, endingBalance:balance };
    }
  }

  return { success:true, yearsCovered:assumptions.years, endingBalance:balance };
}

/* SAVE */
function saveData(){

  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let model = buildFinancialModelV2({
    liquidAssets:s,
    income:i,
    expenses:e,
    assumptions:{ years:40, returnRate:0.05, inflation:0.025 }
  });

  document.getElementById("netWorth").innerText = `$${s.toLocaleString()}`;
  document.getElementById("surplus").innerText = `$${(i-e)}`;
  document.getElementById("years").innerText = `${model.yearsCovered} yrs`;
  document.getElementById("score").innerText = model.success ? "80" : "40";
  document.getElementById("scoreHint").innerText = model.success ? "Sustainable" : "Risk";

  db.collection("profiles").doc("main").set({ savings:s, income:i, expenses:e });
}

/* LOAD */
window.onload = async () => {
  let doc = await db.collection("profiles").doc("main").get();
  if(doc.exists){
    let d = doc.data();
    savings.value = d.savings;
    income.value = d.income;
    expenses.value = d.expenses;
    saveData();
  }
};

/* SCENARIO */
function runScenario(){
  let s = +scSavings.value;
  let e = +scSpend.value;

  let model = buildFinancialModelV2({
    liquidAssets:s,
    income:0,
    expenses:e,
    assumptions:{ years:40, returnRate:0.05, inflation:0.025 }
  });

  scenarioResult.innerHTML = `Lasts ${model.yearsCovered} yrs`;
}

/* ADVISOR */
function analyzeAdvisor(){
  let t = advisorInput.value.toLowerCase();
  let flags=[];
  if(t.includes("annuity")) flags.push("⚠️ Annuity");
  if(t.includes("fee")) flags.push("⚠️ Fees");
  advisorOutput.innerHTML = flags.join("<br>");
}

</script>

</body>
</html>
