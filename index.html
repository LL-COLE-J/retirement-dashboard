<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#0B0F1A;color:white;font-family:Inter,Arial;display:flex}
.sidebar{width:220px;background:#0F172A;padding:20px}
.logo{font-size:20px;font-weight:600;margin-bottom:20px}
.nav-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:6px}
.nav-item:hover{background:#1E293B}
.main{flex:1;padding:25px}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.metric{background:#111827;padding:16px;border-radius:14px}
.metric-label{font-size:12px;color:#9CA3AF}
.metric-value{font-size:20px;margin-top:6px}

/* CHART */
.chart-card{background:#111827;padding:20px;border-radius:16px;margin-bottom:20px}

/* MODULES */
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.module{background:#111827;padding:18px;border-radius:16px;cursor:pointer}
.module:hover{background:#1F2937}

/* CARDS */
.card{background:#111827;padding:16px;border-radius:14px;margin-bottom:14px}

/* FORM GRID */
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

input,select{
width:100%;
padding:10px;
background:#1F2937;
color:white;
border:none;
border-radius:8px;
}

button{
margin-top:10px;
padding:10px;
background:#3B82F6;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
</div>

<div class="main">

<!-- DASHBOARD -->
  <div id="moduleView" style="display:none">
  <div class="card">
    <h2 id="moduleTitle"></h2>
    <div id="moduleContent"></div>
    <button onclick="show('dashboard')">← Back</button>
  </div>
</div>
<div id="dashboard">

<div class="metrics">
<div class="metric"><div class="metric-label">Net Worth</div><div id="nw"></div></div>
<div class="metric"><div class="metric-label">Income</div><div id="inc"></div></div>
<div class="metric"><div class="metric-label">Expenses</div><div id="expOut"></div></div>
<div class="metric"><div class="metric-label">Savings Rate</div><div id="saveRate"></div></div>
<div class="metric"><div class="metric-label">Success</div><div id="succ"></div></div>
</div>

<div class="chart-card">
<canvas id="chart"></canvas>
</div>

<div class="modules">
<div class="module" onclick="openModule('Chance of Success')">Chance of Success</div>
<div class="module" onclick="openModule('Cash Flow')">Cash Flow</div>
<div class="module" onclick="openModule('Spending Breakdown')">Spending Breakdown</div>
<div class="module" onclick="openModule('Milestones')">Milestones</div>
<div class="module" onclick="openModule('Tax Analytics')">Tax Analytics</div>
<div class="module" onclick="openModule('Scenario Compare')">Scenario Compare</div>
</div>

<div class="card"><h4>AI Insights</h4><div id="milestonesOut"></div></div>
<div class="card"><h4>Top Spending</h4><div id="categoryOut"></div></div>
<div class="card" id="taxExplain"></div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h3>Income</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Income</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Expense</button>
</div>

<div class="card">
<h3>Events</h3>
<div id="eventList"></div>
<button onclick="addEvent()">+ Event</button>
</div>

<div class="card form-grid">
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

<div class="card">
<select id="filing">
<option value="single">Single</option>
<option value="married_joint">Married Joint</option>
<option value="head">Head</option>
</select>
</div>

</div>

</div>

<script src="modules.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>

</body>
</html>
