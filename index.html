<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<div id="financials" style="display:none">

<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Dependents</h4>
<div class="label">Number of Dependents</div>
<input id="dependents" type="number" onblur="state.dependents=+this.value||0;updateAll()">
</div>

<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance" onblur="state.accounts=+this.value||0;updateAll()">
</div>

<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash" onblur="updateAll()">
<input id="invest" placeholder="Investments" onblur="updateAll()">
<input id="debt" placeholder="Debt" onblur="updateAll()">
</div>

<div class="card">
<button onclick="saveProfile()">Save Profile</button>
<button onclick="loadProfile()">Load Profile</button>
</div>

</div>

</div>

</div>

<div class="side">

<div class="card">
<h4>Status</h4>
<div id="status"></div>
</div>

<div class="card">
<h4>Failure Point</h4>
<div id="failure"></div>
</div>

<div class="card">
<h4>Action</h4>
<div id="action"></div>
</div>

<div class="card">
<h4>AI Advisor</h4>
<div id="aiOutput">Waiting for analysis...</div>
</div>

</div>

</div>
</div>

<script>

let state={
  incomes:[],
  expenses:[],
  filing:"single",
  dependents:0,
  accounts:0
};

function norm(a,f){return a*(f==="monthly"?12:f==="biweekly"?26:1);}
function money(n){return "$"+Number(n||0).toLocaleString();}

function calcTax(income, filing, dependents){

  const standard = {
    single: 13850,
    married_joint: 27700,
    head: 20800
  };

  const brackets = {
    single:[[11000,0.1],[44725,0.12],[95375,0.22]],
    married_joint:[[22000,0.1],[89450,0.12],[190750,0.22]],
    head:[[15700,0.1],[59850,0.12],[95350,0.22]]
  };

  let taxable = Math.max(0, income - standard[filing]);

  let tax=0,prev=0;

  for(let [limit,rate] of brackets[filing]){
    if(taxable>limit){
      tax+=(limit-prev)*rate;
      prev=limit;
    }else{
      tax+=(taxable-prev)*rate;
      break;
    }
  }

  tax -= dependents * 2000;

  return Math.max(0,tax);
}

function calculate(){

let income=state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
let expenses=state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);

let tax=calcTax(income,state.filing,state.dependents);
let net=income-expenses-tax;

let netWorth=
(+cash.value||0)+
(+invest.value||0)-
(+debt.value||0)+
(state.accounts||0);

let savingsRate=income>0?((income-expenses)/income)*100:0;

return{income,expenses,net,netWorth,savingsRate};
}

let aiTimer;
let lastPayload=null;

function shouldCallAI(p){
  let s=JSON.stringify(p);
  if(s===lastPayload)return false;
  lastPayload=s;
  return true;
}

function triggerAI(data){

if(!shouldCallAI(data)) return;

clearTimeout(aiTimer);

aiTimer=setTimeout(async()=>{

try{
let res=await fetch("https://summer-boat-369f.llcolej8.workers.dev/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});
let json=await res.json();
aiOutput.innerText=json.result;
}catch{
aiOutput.innerText="AI unavailable";
}

},2000);
}

function updateAll(){

let d=calculate();

netWorth.innerText=money(d.netWorth);
income.innerText=money(d.income);
expensesOut.innerText=money(d.expenses);
savingsRate.innerText=d.savingsRate.toFixed(1)+"%";

let yearsSafe=d.net>0?(d.netWorth/(d.expenses||1)):0;

status.innerText=yearsSafe>25?"Stable":yearsSafe>15?"Moderate":"At Risk";
failure.innerText=yearsSafe>0?"Runs out in "+yearsSafe.toFixed(1)+" yrs":"Already negative";
action.innerText=d.net<0?"Reduce expenses":d.savingsRate<15?"Increase savings":"Maintain course";

triggerAI({
netWorth:d.netWorth,
income:d.income,
expenses:d.expenses,
savingsRate:d.savingsRate,
yearsSafe:yearsSafe
});
}

function addIncome(){state.incomes.push({amount:0,freq:"yearly"});renderStreams();}
function addExpense(){state.expenses.push({amount:0,freq:"yearly"});renderStreams();}

function renderStreams(){

incomeList.innerHTML=state.incomes.map((i,idx)=>`
<div class="label">Income</div>
<input value="${i.amount||""}"
onblur="state.incomes[${idx}].amount=+this.value||0;updateAll()">
`).join("");

expenseList.innerHTML=state.expenses.map((e,idx)=>`
<div class="label">Expense</div>
<input value="${e.amount||""}"
onblur="state.expenses[${idx}].amount=+this.value||0;updateAll()">
`).join("");
}

function saveProfile(){
let name=prompt("Profile name?");
if(!name)return;
localStorage.setItem("profile_"+name,JSON.stringify(state));
alert("Saved");
}

function loadProfile(){
let name=prompt("Load which profile?");
let data=localStorage.getItem("profile_"+name);
if(!data)return alert("Not found");
state=JSON.parse(data);
renderStreams();
updateAll();
}

function showView(id,el){
["dashboard","financials"].forEach(v=>document.getElementById(v).style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

window.onload=()=>{
state.incomes.push({amount:80000,freq:"yearly"});
state.expenses.push({amount:40000,freq:"yearly"});
renderStreams();
updateAll();
};

  <script>

// =========================
// PROJECTION ENGINE (ADDITIVE)
// =========================

function runProjection(){

  let base = calculate();

  let years = 40;
  let growth = 0.07;
  let inflation = 0.03;

  let balance = base.netWorth;
  let yearlyData = [];

  for(let i = 0; i < years; i++){

    let expenses = base.expenses * Math.pow(1 + inflation, i);
    let contributions = base.contrib;

    balance = (balance + contributions - expenses) * (1 + growth);

    yearlyData.push({
      year: i,
      balance: balance,
      expenses: expenses
    });

    if(balance <= 0){
      return {
        success: false,
        failureYear: i,
        data: yearlyData
      };
    }
  }

  return {
    success: true,
    data: yearlyData
  };
}


// =========================
// MONTE CARLO ENGINE (ADDITIVE)
// =========================

function runMonteCarlo(){

  let sims = 100;
  let success = 0;

  let base = calculate();

  for(let i = 0; i < sims; i++){

    let balance = base.netWorth;

    for(let y = 0; y < 40; y++){

      let randomReturn = (Math.random() * 0.15) - 0.05; // -5% to +10%

      let expenses = base.expenses * Math.pow(1 + 0.03, y);
      let contrib = base.contrib;

      balance = (balance + contrib - expenses) * (1 + randomReturn);

      if(balance <= 0) break;
    }

    if(balance > 0) success++;
  }

  return (success / sims) * 100;
}


// =========================
// SAFE INJECTION INTO updateAll()
// (DOES NOT BREAK EXISTING)
// =========================

(function(){

  // Wait until updateAll exists
  const waitForUpdate = setInterval(() => {

    if(typeof updateAll === "function"){

      clearInterval(waitForUpdate);

      const originalUpdate = updateAll;

      window.updateAll = function(){

        // run your original logic FIRST
        originalUpdate();

        try {

          let proj = runProjection();
          let mc = runMonteCarlo();

          // Safe DOM writes (only if elements exist)
          let statusEl = document.getElementById("status");
          let failureEl = document.getElementById("failure");
          let actionEl = document.getElementById("action");

          if(statusEl){
            statusEl.innerText =
              proj.success
                ? "On Track"
                : "Fails at year " + proj.failureYear;
          }

          if(failureEl){
            failureEl.innerText =
              "Monte Carlo Success: " + mc.toFixed(1) + "%";
          }

          if(actionEl){
            actionEl.innerText =
              mc > 80 ? "Strong plan" :
              mc > 60 ? "Moderate risk" :
              "High risk — adjust savings or expenses";
          }

        } catch(e){
          console.log("Projection engine error:", e);
        }

      };

    }

  }, 100);

})();

</script>

</script>

</body>
</html>
