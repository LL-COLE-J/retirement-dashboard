<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Dependents</h4>
<input id="dependents" type="number">
</div>

<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance">
</div>

<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="grid">

<div class="card">
<h4>Age & Retirement</h4>
<input id="currentAge" placeholder="Current Age" value="40">
<input id="retirementAge" placeholder="Retirement Age" value="65">
<input id="lifeExpectancy" placeholder="Life Expectancy" value="90">
</div>

<div class="card">
<h4>Adjustments</h4>
<input id="incomeAdjust" placeholder="Income Change (%)">
<input id="expenseAdjust" placeholder="Expense Change (%)">
<input id="returnAdjust" placeholder="Return Change (%)">
</div>

</div>
</div>

</div>

<div class="side">

<div class="card"><h4>Status</h4><div id="status"></div></div>
<div class="card"><h4>Failure</h4><div id="failure"></div></div>
<div class="card"><h4>Action</h4><div id="action"></div></div>
<div class="card"><h4>AI</h4><div id="aiOutput"></div></div>

</div>

</div>
</div>

<script>

/* =========================
SAFE EXTENSION SETTINGS
========================= */
if(!state?.settings){
  state.settings = {
    inflation:0.03,
    marketReturn:0.06
  };
}

/* =========================
EXTEND ADDERS (NO BREAK)
========================= */
const originalAddIncome = addIncome;
addIncome = function(){
  originalAddIncome();
  let i = state.incomes[state.incomes.length-1];
  i.type = "salary";
  i.growth = 0.03;
};

const originalAddExpense = addExpense;
addExpense = function(){
  originalAddExpense();
  let e = state.expenses[state.expenses.length-1];
  e.essential = true;
  e.inflation = 0.03;
};

/* =========================
ENHANCED CALC WRAPPER
========================= */
const originalCalculate = calculate;
calculate = function(){

  let d = originalCalculate();

  // adjust income realism
  let adjustedIncome = (state.incomes||[]).reduce((s,i)=>{
    let base = norm(i.amount,i.freq);
    if(i.type==="bonus") base *= 0.7;
    if(i.type==="passive") base *= 0.95;
    return s + base;
  },0);

  // adjust expenses realism
  let adjustedExpenses = (state.expenses||[]).reduce((s,e)=>{
    let val = norm(e.amount,e.freq);
    if(e.essential === false) val *= 1.1;
    return s + val;
  },0);

  d.income = adjustedIncome;
  d.expenses = adjustedExpenses;

  return d;
};

/* =========================
TIMELINE ENHANCEMENT
========================= */
const originalTimeline = runTimeline;
runTimeline = function(d){

  let result = originalTimeline(d);

  // re-run with improved returns (no break)
  let age = state.timeline.currentAge;
  let end = state.timeline.lifeExpectancy;

  let nw = d.netWorth;
  let fail = null;

  let avgReturn =
    (state.accounts||[]).reduce((s,a)=>s+(a.return||0.06),0) /
    (state.accounts.length||1);

  for(let a=age;a<=end;a++){

    let income = a<state.timeline.retirementAge ? d.income : 0;
    let expenses = d.expenses * Math.pow(1+state.settings.inflation,a-age);

    nw = nw*(1+avgReturn) + (income-expenses);

    if(nw<=0 && fail===null) fail = a;
  }

  return {success:fail===null,failureAge:fail};
};

/* =========================
ADVISOR ENGINE
========================= */
function generateAdvice(d){

  let out = [];

  if(d.monteCarlo < 70)
    out.push("Failure risk driven by low savings.");

  if(d.savingsRate < 15)
    out.push("Savings rate below 15% target.");

  if(d.net < 0)
    out.push("Cash flow negative.");

  if(!d.success)
    out.push("Delay retirement or reduce expenses.");

  if(out.length === 0)
    return "Plan looks strong.";

  return out.join(" ");
}

/* =========================
UPDATE EXTENSION
========================= */
const originalUpdate = updateAll;
updateAll = function(){
  originalUpdate();

  let d = runEngine();
  aiOutput.innerText = generateAdvice(d);
};

</script>

</body>
</html>
