<!DOCTYPE html>
<html>
<head>
  <title>Avora - Retirement Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
      margin:0;
    }

    .container {
      padding:20px;
      max-width:900px;
      margin:auto;
    }

    .card {
      background:#1e293b;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }

    input, textarea {
      width:100%;
      padding:8px;
      margin-top:5px;
      border-radius:6px;
      border:none;
    }

    button {
      padding:10px;
      margin-top:10px;
      background:#3b82f6;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .row {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .col {
      flex:1;
      min-width:150px;
    }

    .stat {
      font-size:22px;
      margin-top:5px;
    }

    .success { color:#22c55e; }
    .warn { color:#eab308; }
    .danger { color:#ef4444; }

    /* 🚀 UX EXPANSION AREA */
    .placeholder {
      opacity:.5;
      font-size:12px;
      margin-top:10px;
    }

  </style>
</head>

<body>

<div class="container">

  <h2>Avora — Retirement Control Panel</h2>

  <!-- KPI ROW -->
  <div class="row">

    <div class="card col">
      Net Worth
      <div id="netWorth" class="stat">$0</div>
    </div>

    <div class="card col">
      Monthly Surplus
      <div id="surplus" class="stat">$0</div>
    </div>

    <div class="card col">
      Years Covered
      <div id="years" class="stat">--</div>
    </div>

    <div class="card col">
      Retirement Score
      <div id="score" class="stat">--</div>
      <div id="scoreHint" style="font-size:12px;"></div>

      <div style="margin-top:10px; height:8px; background:#111;">
        <div id="scoreBar" style="height:6px; width:0%;"></div>
      </div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="card">
    <h3>Financial Snapshot</h3>

    <input id="savings" placeholder="Total Savings">
    <input id="income" placeholder="Monthly Income">
    <input id="expenses" placeholder="Monthly Expenses">

    <button onclick="saveData()">Save</button>
  </div>

  <!-- SCENARIO -->
  <div class="card">
    <h3>Scenario</h3>

    <input id="scSavings" placeholder="Savings">
    <input id="scSpend" placeholder="Monthly Spend">

    <button onclick="runScenario()">Run</button>

    <div id="scenarioResult"></div>
  </div>

  <!-- ADVISOR -->
  <div class="card">
    <h3>Advisor Review</h3>

    <textarea id="advisorInput"></textarea>

    <button onclick="analyzeAdvisor()">Analyze</button>

    <div id="advisorOutput"></div>
  </div>

  <!-- 🚀 FUTURE UX AREA -->
  <div class="card">
    <h3>AI Insight Panel (Coming Next)</h3>
    <div class="placeholder">
      This will show AI-driven insights, risk explanations, and scenario advice.
    </div>
  </div>

</div>

<script>

/* =========================
   🔧 FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
  authDomain: "retirement-dashboard-4c0d3.firebaseapp.com",
  projectId: "retirement-dashboard-4c0d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   🧠 CORE ENGINE
========================= */

function buildFinancialModelV2(inputs) {

  const {
    liquidAssets,
    expenses,
    income,
    assumptions
  } = inputs;

  let balance = liquidAssets;
  let timeline = [];

  for (let year = 0; year < assumptions.years; year++) {

    const yearlyIncome = income * 12;
    const yearlyExpenses = expenses * 12 * Math.pow(1 + assumptions.inflation, year);
    const growth = balance * assumptions.returnRate;

    balance = balance + growth + yearlyIncome - yearlyExpenses;

    timeline.push({ year, balance });

    if (balance <= 0) break;
  }

  return {
    success: balance > 0,
    yearsCovered: timeline.length,
    endingBalance: balance
  };
}

/* =========================
   💾 SAVE + CALCULATE
========================= */

function saveData(){

  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let model = buildFinancialModelV2({
    liquidAssets: s,
    income: i,
    expenses: e,
    assumptions: {
      years: 40,
      returnRate: 0.05,
      inflation: 0.025
    }
  });

  let surplus = i - e;

  let score = model.success
    ? Math.min(100, 70 + model.yearsCovered)
    : 40;

  let hint = model.success
    ? "Sustainable plan"
    : "Risk of running out";

  let color = model.success ? "#22c55e" : "#ef4444";

  document.getElementById("netWorth").innerText = `$${s.toLocaleString()}`;
  document.getElementById("surplus").innerText = `$${surplus}`;
  document.getElementById("years").innerText = `${model.yearsCovered} yrs`;
  document.getElementById("score").innerText = `${score}/100`;
  document.getElementById("scoreHint").innerText = hint;

  let bar = document.getElementById("scoreBar");
  bar.style.width = `${score}%`;
  bar.style.background = color;

  db.collection("profiles").doc("main").set({
    savings: s,
    income: i,
    expenses: e
  });
}

/* =========================
   📊 LOAD
========================= */

window.onload = async () => {

  let doc = await db.collection("profiles").doc("main").get();

  if(doc.exists){
    let d = doc.data();

    document.getElementById("savings").value = d.savings || "";
    document.getElementById("income").value = d.income || "";
    document.getElementById("expenses").value = d.expenses || "";

    saveData();
  }
};

/* =========================
   🧪 SCENARIO
========================= */

function runScenario(){

  let savings = +document.getElementById("scSavings").value;
  let spend = +document.getElementById("scSpend").value;

  let model = buildFinancialModelV2({
    liquidAssets: savings,
    income: 0,
    expenses: spend,
    assumptions: {
      years: 40,
      returnRate: 0.05,
      inflation: 0.025
    }
  });

  document.getElementById("scenarioResult").innerHTML =
    `Lasts ${model.yearsCovered} years<br>
     Ending Balance: $${Math.round(model.endingBalance).toLocaleString()}`;
}

/* =========================
   🧠 ADVISOR CHECK
========================= */

function analyzeAdvisor(){

  let text = document.getElementById("advisorInput").value.toLowerCase();

  let flags = [];

  if (text.includes("annuity")) flags.push("Annuity detected");
  if (text.includes("guaranteed")) flags.push("Verify guarantees");
  if (text.includes("fee")) flags.push("Check total fees");

  document.getElementById("advisorOutput").innerHTML =
    flags.length ? flags.join("<br>") : "No major flags";
}

</script>

</body>
</html>
