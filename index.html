<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Inter;background:#0B0F1A;color:white;display:flex;height:100vh;}
.sidebar{width:220px;background:#0F172A;padding:20px;}
.logo{font-weight:600;margin-bottom:20px;}
.nav-item{margin:10px 0;color:#9CA3AF;cursor:pointer;}
.nav-item.active{color:white;}
.main{flex:1;padding:20px;}
.ai{width:260px;background:#0F172A;padding:15px;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.card{background:#111827;padding:12px;border-radius:10px;}

input{width:100%;margin-top:8px;padding:8px;background:#1F2937;border:none;color:white;}
canvas{max-height:200px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>

<div class="nav-item active" onclick="showView('dashboardView',this)">Dashboard</div>
<div class="nav-item" onclick="showView('inputView',this)">Financials</div>
<div class="nav-item" onclick="showView('scenariosView',this)">Scenarios</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboardView">
<div class="grid">
<div class="card">Net Worth<div id="netWorth"></div></div>
<div class="card">Income<div id="incomeTotal"></div></div>
<div class="card">Expenses<div id="expenseTotal"></div></div>
<div class="card">Years<div id="years"></div></div>
</div>

<div class="chartGrid">
<div class="card"><canvas id="projectionChart"></canvas></div>
<div class="card"><canvas id="cashflowChart"></canvas></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="inputView" style="display:none">
<div class="card">

<h4>Person A</h4>
<input id="incomeA" placeholder="Income A">
<input id="ageA" placeholder="Age A">
<input id="retAgeA" placeholder="Retirement Age A">
<input id="ssiAgeA" placeholder="SSI Start A">
<input id="ssiA" placeholder="SSI Monthly A">

<h4>Person B</h4>
<input id="incomeB" placeholder="Income B">
<input id="ageB" placeholder="Age B">
<input id="retAgeB" placeholder="Retirement Age B">
<input id="ssiAgeB" placeholder="SSI Start B">
<input id="ssiB" placeholder="SSI Monthly B">

<h4>Household</h4>
<input id="cash" placeholder="Cash">
<input id="investments" placeholder="Investments">
<input id="expenses" placeholder="Expenses">

</div>
</div>

<!-- SCENARIOS -->
<div id="scenariosView" style="display:none">
<div class="card">

<h4>Longevity</h4>
<input id="lifeExpA" placeholder="Life A">
<input id="lifeExpB" placeholder="Life B">

<h4>Market</h4>
<input id="returnRateInput" placeholder="Return %">
<input id="marketDrop" placeholder="Drop %">

<h4>Spending</h4>
<input id="inflationInput" placeholder="Inflation %">
<input id="expenseShock" placeholder="Extra Expense">

</div>
</div>

</div>

<div class="ai">
<h4>AI Advisor</h4>
<div id="aiOutput"></div>
</div>

<script>

let charts={};

function showView(id,el){
document.getElementById("dashboardView").style.display="none";
document.getElementById("inputView").style.display="none";
document.getElementById("scenariosView").style.display="none";

document.getElementById(id).style.display="block";

document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

function buildModel(total,exp){

let bal=total;
let t=[];

let r=((+document.getElementById("returnRateInput").value||5)/100);
let inf=((+document.getElementById("inflationInput").value||2.5)/100);
let shock=(+document.getElementById("expenseShock").value||0);
let drop=((+document.getElementById("marketDrop").value||0)/100);

let lifeA=(+document.getElementById("lifeExpA").value||90);
let lifeB=(+document.getElementById("lifeExpB").value||90);

let ageA0=(+ageA.value||65);
let ageB0=(+ageB.value||65);

for(let y=0;y<60;y++){

let aA=ageA0+y;
let aB=ageB0+y;

let aliveA=aA<lifeA;
let aliveB=aB<lifeB;

let inc=0;

if(aliveA){
if(aA<(+retAgeA.value||65)) inc+=+incomeA.value||0;
if(aA>=(+ssiAgeA.value||67)) inc+=(+ssiA.value||0)*12;
}

if(aliveB){
if(aB<(+retAgeB.value||65)) inc+=+incomeB.value||0;
if(aB>=(+ssiAgeB.value||67)) inc+=(+ssiB.value||0)*12;
}

let baseExp=exp;
if(!aliveA||!aliveB) baseExp*=0.7;

let ex=(baseExp+shock)*Math.pow(1+inf,y);

if(y===0) bal*=1-drop;

bal+=bal*r+inc-ex;

t.push({age:Math.min(aA,aB),bal,inc,ex});

if(bal<=0) break;
}

return t;
}

function updateAll(){

let income=(+incomeA.value||0)+(+incomeB.value||0);
let total=(+cash.value||0)+(+investments.value||0);
let exp=(+expenses.value||0);

let m=buildModel(total,exp);

netWorth.innerText="$"+total.toLocaleString();
incomeTotal.innerText="$"+income.toLocaleString();
expenseTotal.innerText="$"+exp.toLocaleString();
years.innerText=m.length;

renderCharts(m);

aiOutput.innerHTML=
(m.length<25?"⚠️ Risk early":"✅ Stable")+"<br>"+
(income<exp?"⚠️ Expenses exceed income":"");
}

function renderCharts(m){

let labels=m.map(x=>x.age);
let bal=m.map(x=>x.bal);

if(charts.p) charts.p.destroy();

charts.p=new Chart(projectionChart.getContext("2d"),{
type:"line",
data:{labels,datasets:[{label:"Net Worth",data:bal}]}
});
}

document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",updateAll);
});

window.onload=updateAll;

</script>

</body>
</html>
