<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link rel="icon" href="data:,"> <!-- fixes favicon error -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#0B0F1A;color:#E5E7EB;display:flex;height:100vh;}
.sidebar{width:200px;background:#0F172A;padding:20px;}
.nav-item{margin:10px 0;color:#9CA3AF;cursor:pointer;}
.nav-item.active{color:white;}
.main{flex:1;padding:20px;overflow:auto;}
.ai{width:260px;background:#0F172A;padding:15px;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.card{background:#111827;padding:10px;border-radius:8px;}
input{width:100%;margin-top:8px;padding:8px;background:#1F2937;border:none;color:white;}
button{margin-top:10px;padding:8px;background:#3B82F6;color:white;border:none;border-radius:6px;}
canvas{max-height:200px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item active" onclick="showView('dashboard',event)">Dashboard</div>
<div class="nav-item" onclick="showView('inputs',event)">Financials</div>
</div>

<div class="main">

<div id="dashboardView">
<div class="grid">
<div class="card">Net Worth<div id="netWorth">$0</div></div>
<div class="card">Surplus<div id="surplus">$0</div></div>
<div class="card">Years<div id="years">--</div></div>
<div class="card">Score<div id="score">--</div></div>
</div>

<div class="chartGrid">
<div class="card"><canvas id="projectionChart"></canvas></div>
<div class="card"><canvas id="cashflowChart"></canvas></div>
<div class="card"><canvas id="netFlowChart"></canvas></div>
<div class="card"><canvas id="riskChart"></canvas></div>
</div>
</div>

<div id="inputView" style="display:none">
<div class="card">
<input id="incomeA" placeholder="Income A">
<input id="incomeB" placeholder="Income B">
<input id="cash" placeholder="Cash">
<input id="investments" placeholder="Investments">
<input id="expenses" placeholder="Expenses">
<input id="ageA" placeholder="Age A">
<input id="ageB" placeholder="Age B">
<input id="retAge" placeholder="Retirement Age">
<input id="lifeExp" placeholder="Life Expectancy">
</div>
</div>

</div>

<div class="ai">
<h4>AI Advisor</h4>
<div id="aiOutput"></div>
</div>

<script>

let charts={};

/* SAFE NAV */
function showView(v,e){

const dashboard = document.getElementById("dashboardView");
const input = document.getElementById("inputView");

if(dashboard) dashboard.style.display="none";
if(input) input.style.display="none";

const target = document.getElementById(v+"View");
if(target) target.style.display="block";

document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
if(e && e.target) e.target.classList.add("active");
}

/* MODEL */
function buildModel(total,income,exp,age,ret,life){

let bal=total;
let t=[];
let years=Math.max(life-age,1);

for(let y=0;y<years;y++){
let cur=age+y;
let inc=cur<ret?income*12:0;
let ex=exp*12*Math.pow(1.025,y);
bal+=bal*0.05+inc-ex;
t.push({age:cur,bal,inc,ex});
if(bal<=0) break;
}

return t;
}

/* UPDATE */
function updateAll(){

let income=(+incomeA.value||0)+(+incomeB.value||0);
let total=(+cash.value||0)+(+investments.value||0);
let exp=+expenses.value||0;

let age=Math.min(+ageA.value||65,+ageB.value||65);
let ret=+retAge.value||65;
let life=+lifeExp.value||90;

if(total===0 && income===0){
total=100000; income=5000; exp=4000;
}

let m=buildModel(total,income,exp,age,ret,life);

/* KPI */
netWorth.innerText="$"+total.toLocaleString();
surplus.innerText="$"+(income-exp);
years.innerText=m.length;
score.innerText=m.length>30?"85":"45";

/* CHARTS */
renderCharts(m);

/* AI */
aiOutput.innerHTML =
(m.length<25?"⚠️ Risk early":"✅ Stable")+"<br>"+
(income<exp?"⚠️ Negative cashflow":"");
}

/* FIXED CHARTS */
function renderCharts(m){

const ctx1=document.getElementById("projectionChart")?.getContext("2d");
const ctx2=document.getElementById("cashflowChart")?.getContext("2d");
const ctx3=document.getElementById("netFlowChart")?.getContext("2d");
const ctx4=document.getElementById("riskChart")?.getContext("2d");

if(!ctx1) return;

let labels=m.map(x=>x.age);
let bal=m.map(x=>x.bal);
let inc=m.map(x=>x.inc);
let exp=m.map(x=>x.ex);
let net=m.map(x=>x.inc-x.ex);

Object.values(charts).forEach(c=>c.destroy());

charts.projection=new Chart(ctx1,{type:"line",data:{labels,datasets:[{label:"Net Worth",data:bal}]}});
charts.cashflow=new Chart(ctx2,{type:"line",data:{labels,datasets:[{label:"Income",data:inc},{label:"Expenses",data:exp}]}});
charts.net=new Chart(ctx3,{type:"line",data:{labels,datasets:[{label:"Net Flow",data:net}]}});
charts.risk=new Chart(ctx4,{type:"bar",data:{labels:["Years"],datasets:[{data:[m.length]}]}});
}

/* AUTO UPDATE */
document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",updateAll);
});

/* INIT AFTER DOM */
window.onload=updateAll;

</script>

</body>
</html>
