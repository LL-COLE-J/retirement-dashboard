<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Avora</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Inter;background:#0B0F1A;color:white;display:flex;height:100vh;}
.sidebar{width:200px;padding:20px;background:#0F172A;}
.nav-item{margin:10px 0;color:#9CA3AF;cursor:pointer;}
.nav-item.active{color:white;}
.main{flex:1;padding:20px;overflow:auto;}
.ai{width:250px;background:#0F172A;padding:15px;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.card{background:#111827;padding:10px;border-radius:8px;}

input{width:100%;margin-top:6px;padding:8px;background:#1F2937;border:none;color:white;}
canvas{max-height:200px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item active" onclick="showView('dashboard')">Dashboard</div>
<div class="nav-item" onclick="showView('inputs')">Financials</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboardView">
<div class="grid">
<div class="card">Net Worth<div id="netWorth">$0</div></div>
<div class="card">Monthly Income<div id="incomeTotal">$0</div></div>
<div class="card">Expenses<div id="expenseTotal">$0</div></div>
<div class="card">Years<div id="years">--</div></div>
</div>

<div class="chartGrid">
<div class="card"><canvas id="projectionChart"></canvas></div>
<div class="card"><canvas id="cashflowChart"></canvas></div>
<div class="card"><canvas id="netFlowChart"></canvas></div>
<div class="card"><canvas id="riskChart"></canvas></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="inputView" style="display:none">

<div class="card">
<h3>Income</h3>
<input id="incomeA" placeholder="Person A Income">
<input id="incomeB" placeholder="Person B Income">

<h3>Assets</h3>
<input id="cash" placeholder="Cash">
<input id="investments" placeholder="Investments">

<h3>Expenses</h3>
<input id="expenses" placeholder="Monthly Expenses">

<h3>Ages</h3>
<input id="ageA" placeholder="Age A">
<input id="ageB" placeholder="Age B">
<input id="retAge" placeholder="Retirement Age">
<input id="lifeExp" placeholder="Life Expectancy">

<h3>Live Calculation</h3>
<div id="liveCalc"></div>

</div>

</div>

</div>

<div class="ai">
<h4>AI Advisor</h4>
<div id="aiOutput"></div>
</div>

<script>

let charts={};

/* SAFE NAV */
function showView(view){

const dash=document.getElementById("dashboardView");
const input=document.getElementById("inputView");

if(dash) dash.style.display="none";
if(input) input.style.display="none";

if(view==="dashboard") dash.style.display="block";
if(view==="inputs") input.style.display="block";

document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
event.target.classList.add("active");
}

/* MODEL */
function buildModel(total,income,exp,age,ret,life){

let bal=total;
let t=[];
let years=Math.max(life-age,1);

for(let y=0;y<years;y++){

let cur=age+y;
let inc=cur<ret?income*12:0;
let ex=exp*12*Math.pow(1.025,y);

bal+=bal*0.05+inc-ex;

t.push({age:cur,bal,inc,ex});

if(bal<=0) break;
}

return t;
}

/* UPDATE EVERYTHING */
function updateAll(){

let incomeAVal=+incomeA.value||0;
let incomeBVal=+incomeB.value||0;
let income=incomeAVal+incomeBVal;

let total=(+cash.value||0)+(+investments.value||0);
let exp=+expenses.value||0;

let age=Math.min(+ageA.value||65,+ageB.value||65);
let ret=+retAge.value||65;
let life=+lifeExp.value||90;

/* fallback */
if(total===0 && income===0){
total=100000; income=5000; exp=4000;
}

let m=buildModel(total,income,exp,age,ret,life);

/* KPIs */
netWorth.innerText="$"+total.toLocaleString();
incomeTotal.innerText="$"+income.toLocaleString();
expenseTotal.innerText="$"+exp.toLocaleString();
years.innerText=m.length;

/* LIVE PANEL */
liveCalc.innerHTML=
"Income: $"+income.toLocaleString()+"<br>"+
"Expenses: $"+exp.toLocaleString()+"<br>"+
"Surplus: $"+(income-exp).toLocaleString();

/* CHARTS */
renderCharts(m);

/* AI */
aiOutput.innerHTML =
(m.length<25?"⚠️ Risk early":"✅ Stable")+"<br>"+
(income<exp?"⚠️ Negative cashflow":"");
}

/* CHARTS FIXED */
function renderCharts(m){

const ctx1=document.getElementById("projectionChart").getContext("2d");
const ctx2=document.getElementById("cashflowChart").getContext("2d");
const ctx3=document.getElementById("netFlowChart").getContext("2d");
const ctx4=document.getElementById("riskChart").getContext("2d");

let labels=m.map(x=>x.age);
let bal=m.map(x=>x.bal);
let inc=m.map(x=>x.inc);
let exp=m.map(x=>x.ex);
let net=m.map(x=>x.inc-x.ex);

Object.values(charts).forEach(c=>c.destroy());

charts.p=new Chart(ctx1,{type:"line",data:{labels,datasets:[{label:"Net Worth",data:bal}]}});
charts.c=new Chart(ctx2,{type:"line",data:{labels,datasets:[{label:"Income",data:inc},{label:"Expenses",data:exp}]}});
charts.n=new Chart(ctx3,{type:"line",data:{labels,datasets:[{label:"Net Flow",data:net}]}});
charts.r=new Chart(ctx4,{type:"bar",data:{labels:["Years"],datasets:[{data:[m.length]}]}});
}

/* AUTO UPDATE */
document.querySelectorAll("input").forEach(i=>{
i.addEventListener("input",updateAll);
});

/* INIT */
window.onload=updateAll;

</script>

</body>
</html>
