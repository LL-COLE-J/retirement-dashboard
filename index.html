<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastion | Universal Life-Cycle Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f8fafc; --sidebar: #0f172a; --card: #ffffff; --text: #0f172a; --sub: #64748b; --accent: #0ea5e9; --border: #e2e8f0; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--sidebar); padding: 32px 20px; color: white; display: flex; flex-direction: column; }
        .logo { font-weight: 800; font-size: 18px; letter-spacing: 2px; margin-bottom: 30px; color: var(--accent); }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: #94a3b8; margin-bottom: 8px; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 3px solid var(--accent); }
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 380px; gap: 32px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--sub); margin-bottom: 16px; letter-spacing: 1px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 15px; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
        .entry-row { display: grid; grid-template-columns: 1.2fr 1fr 40px; gap: 12px; margin-bottom: 10px; align-items: end; }
        .add-btn { padding: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px dashed var(--border); cursor: pointer; text-align: center; border-radius: 6px; color: var(--sub); }
        .del-btn { color: var(--red); cursor: pointer; font-weight: 800; text-align: center; font-size: 18px; }
        .metric-val { font-size: 28px; font-weight: 800; color: var(--text); }
        .logic-panel { background: #1e293b; border-radius: 8px; padding: 20px; font-family: 'Courier New', monospace; font-size: 11px; color: #cbd5e1; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="logo">BASTION</div>
    <div class="nav-item active" onclick="switchTab('lab')">Planning Lab</div>
    <div class="nav-item" onclick="switchTab('analytics')">Dashboard</div>
</nav>

<main class="main">
    <div class="container">
        <div class="left-content">
            <section id="lab-tab">
                <div class="card">
                    <h3>Universal Life Cycle</h3>
                    <div class="grid-3">
                        <div><label>Filing Status</label>
                            <select id="filing-status" onchange="recalc()">
                                <option value="single">Single</option>
                                <option value="married">Married Filing Jointly</option>
                            </select>
                        </div>
                        <div><label>Current Age</label><input type="number" id="age-now" value="35" oninput="recalc()"></div>
                        <div><label>Retire Age</label><input type="number" id="age-retire" value="65" oninput="recalc()"></div>
                    </div>
                    <div class="grid-3" style="border-top:1px solid var(--border); padding-top:15px;">
                        <div><label>RMD Start Age</label><input type="number" id="rmd-age" value="75" oninput="recalc()"></div>
                        <div><label>SS Start Age</label><input type="number" id="ss-age" value="67" oninput="recalc()"></div>
                        <div><label>Monthly SS ($)</label><input type="number" id="ss-benefit" value="2800" oninput="recalc()"></div>
                    </div>
                </div>

                <div class="card">
                    <h3>Asset Inventory (Tax Buckets)</h3>
                    <div id="asset-container">
                        <div class="entry-row">
                            <select class="asset-type">
                                <option value="deferred">Deferred (401k/IRA)</option>
                                <option value="taxable">Taxable (Brokerage)</option>
                                <option value="taxfree">Tax-Free (Roth)</option>
                            </select>
                            <input type="number" value="150000" class="asset-input" oninput="recalc()">
                            <div class="del-btn" onclick="this.parentElement.remove(); recalc()">×</div>
                        </div>
                    </div>
                    <div class="add-btn" onclick="addAssetRow()">+ Add Asset</div>
                </div>

                <div class="card">
                    <h3>Expenses & Inflation</h3>
                    <div id="expense-container">
                        <div class="entry-row" style="grid-template-columns: 1.2fr 1fr 60px 40px;">
                            <select><option>General</option><option>Medical</option></select>
                            <input type="number" value="3000" class="exp-input" oninput="recalc()">
                            <input type="number" value="3" class="exp-inf" title="Inflation %" oninput="recalc()">
                            <div class="del-btn" onclick="this.parentElement.remove(); recalc()">×</div>
                        </div>
                    </div>
                    <div class="add-btn" onclick="addExpenseRow()">+ Add Expense Category</div>
                </div>
            </section>

            <section id="analytics-tab" style="display:none">
                <div class="card">
                    <h3>Combined Wealth Projection</h3>
                    <div style="height:400px;"><canvas id="wealthChart"></canvas></div>
                </div>
            </section>
        </div>

        <aside class="right-content">
            <h3>Advisor Intelligence</h3>
            <div class="card">
                <label>Terminal Wealth (Age 90)</label>
                <div class="metric-val" id="val-terminal">$0</div>
                <label style="margin-top:15px">Success Probability</label>
                <div id="success-indicator" style="font-size:12px; font-weight:700;">STABLE</div>
            </div>
            <div class="card">
                <h3>Compliance & Tax Engine</h3>
                <div id="logic-content" class="logic-panel">Awaiting calculation...</div>
            </div>
        </aside>
    </div>
</main>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
