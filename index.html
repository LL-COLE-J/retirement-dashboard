<!-- ONLY SHOWING UPDATED SCRIPT + RENDER PARTS -->
<script>

let state = {
  incomes: [],
  expenses: [],
  accounts: [],
  assets: [],
  liabilities: [],
  filing:"single",
  taxState:"TN",
  timeline:{currentAge:40,retirementAge:65,lifeExpectancy:90},
  settings:{inflation:0.03}
};

const accountTypes = ["401k","Roth IRA","Traditional IRA","Brokerage","HSA","529","Cash","Pension"];

const expenseTypes = [
  "Housing","Utilities","Food","Transportation",
  "Insurance","Healthcare","Debt Payments",
  "Entertainment","Subscriptions","Other"
];

const assetTypes = ["Cash","Investments","Real Estate","Business","Other"];

const liabilityTypes = ["Mortgage","Credit Card","Student Loan","Auto Loan","Other"];

const states = ["TN","CA","NY","TX","FL"];

function norm(a,f){ return (+a||0)*(f==="monthly"?12:1); }

/* ===== ENGINE (UNCHANGED) ===== */
function calculate(){
  let income = state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
  let expenses = state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);

  let net = income - expenses;

  let netWorth =
    state.accounts.reduce((s,a)=>s+(a.balance||0),0) +
    state.assets.reduce((s,a)=>s+(a.value||0),0) -
    state.liabilities.reduce((s,l)=>s+(l.balance||0),0);

  let savingsRate = income>0 ? ((income-expenses)/income)*100 : 0;

  return {income,expenses,net,netWorth,savingsRate};
}

/* ===== SAME ENGINE BELOW ===== */

function runTimeline(d){
  let nw=d.netWorth, fail=null;
  for(let a=state.timeline.currentAge;a<=state.timeline.lifeExpectancy;a++){
    let income=a<state.timeline.retirementAge?d.income:0;
    let expenses=d.expenses*Math.pow(1.03,a-state.timeline.currentAge);
    nw=nw*1.06+(income-expenses);
    if(nw<=0 && fail===null) fail=a;
  }
  return {success:fail===null,failureAge:fail};
}

function runMonteCarlo(d){
  let success=0;
  for(let i=0;i<100;i++){
    let nw=d.netWorth;
    for(let a=state.timeline.currentAge;a<=state.timeline.lifeExpectancy;a++){
      let r=(Math.random()*0.12)-0.02;
      let income=a<state.timeline.retirementAge?d.income:0;
      let expenses=d.expenses*Math.pow(1.03,a-state.timeline.currentAge);
      nw=nw*(1+r)+(income-expenses);
      if(nw<=0) break;
    }
    if(nw>0) success++;
  }
  return success;
}

function runEngine(){
  let d=calculate();
  let t=runTimeline(d);
  let mc=runMonteCarlo(d);
  return {...d,...t,mc};
}

function updateAll(){
  let d=runEngine();
  netWorth.innerText="$"+Math.round(d.netWorth);
  income.innerText="$"+Math.round(d.income);
  expensesOut.innerText="$"+Math.round(d.expenses);
  savingsRate.innerText=d.savingsRate.toFixed(1)+"%";
  status.innerText=d.success?"On Track":"Fails at "+d.failureAge;
  failure.innerText="MC Success: "+d.mc+"%";
  action.innerText=d.mc>70?"Good":"Risk";
  aiOutput.innerText="Advisor layer next";
}

/* ===== ADDERS ===== */

function addIncome(){ state.incomes.push({amount:0,freq:"yearly"}); render(); }

function addExpense(){
  state.expenses.push({amount:0,freq:"yearly",type:"Housing",essential:true});
  render();
}

function addAccount(){
  state.accounts.push({type:"401k",balance:0,contrib:0,return:0.07});
  render();
}

function addAsset(){
  state.assets.push({type:"Cash",value:0});
  render();
}

function addLiability(){
  state.liabilities.push({type:"Mortgage",balance:0});
  render();
}

/* ===== RENDER ===== */

function render(){

  stateSelect.innerHTML = states.map(s=>`
    <option ${state.taxState===s?"selected":""}>${s}</option>
  `).join("");

  incomeList.innerHTML = state.incomes.map((i,idx)=>`
    <input value="${i.amount||""}" onblur="state.incomes[${idx}].amount=this.value;updateAll()">
  `).join("");

  expenseList.innerHTML = state.expenses.map((e,idx)=>`
    <div class="row">
      <select onchange="state.expenses[${idx}].type=this.value">
        ${expenseTypes.map(t=>`<option ${e.type===t?"selected":""}>${t}</option>`)}
      </select>
      <input placeholder="Amount" value="${e.amount||""}" 
        onblur="state.expenses[${idx}].amount=this.value;updateAll()">
      <select onchange="state.expenses[${idx}].essential=this.value==='true'">
        <option value="true" ${e.essential?"selected":""}>Essential</option>
        <option value="false" ${!e.essential?"selected":""}>Discretionary</option>
      </select>
    </div>
  `).join("");

  accountList.innerHTML = state.accounts.map((a,idx)=>`
    <div class="row">
      <select onchange="state.accounts[${idx}].type=this.value">
        ${accountTypes.map(t=>`<option ${a.type===t?"selected":""}>${t}</option>`)}
      </select>
      <input placeholder="Balance" value="${a.balance||""}" 
        onblur="state.accounts[${idx}].balance=this.value;updateAll()">
      <input placeholder="Contribution" value="${a.contrib||""}" 
        onblur="state.accounts[${idx}].contrib=this.value;updateAll()">
    </div>
  `).join("");

  assetList.innerHTML = state.assets.map((a,idx)=>`
    <div class="row">
      <select onchange="state.assets[${idx}].type=this.value">
        ${assetTypes.map(t=>`<option ${a.type===t?"selected":""}>${t}</option>`)}
      </select>
      <input placeholder="Value" value="${a.value||""}" 
        onblur="state.assets[${idx}].value=this.value;updateAll()">
    </div>
  `).join("");

  liabilityList.innerHTML = state.liabilities.map((l,idx)=>`
    <div class="row">
      <select onchange="state.liabilities[${idx}].type=this.value">
        ${liabilityTypes.map(t=>`<option ${l.type===t?"selected":""}>${t}</option>`)}
      </select>
      <input placeholder="Balance" value="${l.balance||""}" 
        onblur="state.liabilities[${idx}].balance=this.value;updateAll()">
    </div>
  `).join("");

  updateAll();
}

function showView(v,e){
  ["dashboard","financials","scenarios"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(v).style.display="block";

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  e.classList.add("active");
}

window.onload=render;

</script>
