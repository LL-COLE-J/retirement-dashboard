<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastion | Multi-State Financial Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* LOCKED LIGHT THEME - NO BLUE TINTS */
        :root { --bg: #f8fafc; --sidebar: #0f172a; --card: #ffffff; --text: #0f172a; --sub: #64748b; --accent: #0ea5e9; --border: #e2e8f0; --red: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); padding: 32px 20px; color: white; display: flex; flex-direction: column; }
        .logo { font-weight: 800; font-size: 18px; letter-spacing: 2px; margin-bottom: 30px; color: var(--accent); }
        .save-btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: #94a3b8; margin-bottom: 8px; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .nav-item.active { background: rgba(255,255,255,0.1); color: white; border-left: 3px solid var(--accent); }

        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 380px; gap: 32px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        
        h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--sub); margin-bottom: 16px; letter-spacing: 1px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 15px; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; background: #fff; color: var(--text); }

        .entry-row { display: grid; grid-template-columns: 1.2fr 1fr 40px; gap: 12px; margin-bottom: 10px; align-items: end; }
        .add-btn { padding: 10px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px dashed var(--border); cursor: pointer; text-align: center; border-radius: 6px; color: var(--sub); margin-top: 5px; }
        .del-btn { color: var(--red); cursor: pointer; font-weight: 800; text-align: center; font-size: 18px; }

        .logic-panel { background: #1e293b; border-radius: 8px; padding: 20px; font-family: 'Courier New', monospace; font-size: 12px; color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; }
        .metric-val { font-size: 28px; font-weight: 800; color: var(--text); }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="logo">BASTION</div>
    <button class="save-btn" onclick="saveModel()">Save Current Model</button>
    <div class="nav-item active" onclick="switchTab('lab')">Planning Lab</div>
    <div class="nav-item" onclick="switchTab('analytics')">Dashboard</div>
    <div id="scenario-list" style="margin-top:20px"></div>
</nav>

<main class="main">
    <div class="container">
        <div class="content-left">
            <section id="lab-tab">
                <div class="card">
                    <h3>Jurisdiction & Life Cycle</h3>
                    <div class="grid-3">
                        <div class="input-group">
                            <label>Jurisdiction</label>
                            <select id="state-select" onchange="recalc()">
                                <option value="TN">Tennessee (0%)</option>
                                <option value="AL">Alabama</option><option value="AK">Alaska</option><option value="AZ">Arizona</option>
                                <option value="AR">Arkansas</option><option value="CA">California</option><option value="CO">Colorado</option>
                                <option value="CT">Connecticut</option><option value="DE">Delaware</option><option value="FL">Florida (0%)</option>
                                <option value="GA">Georgia</option><option value="HI">Hawaii</option><option value="ID">Idaho</option>
                                <option value="IL">Illinois</option><option value="IN">Indiana</option><option value="IA">Iowa</option>
                                <option value="KS">Kansas</option><option value="KY">Kentucky</option><option value="LA">Louisiana</option>
                                <option value="ME">Maine</option><option value="MD">Maryland</option><option value="MA">Massachusetts</option>
                                <option value="MI">Michigan</option><option value="MN">Minnesota</option><option value="MS">Mississippi</option>
                                <option value="MO">Missouri</option><option value="MT">Montana</option><option value="NE">Nebraska</option>
                                <option value="NV">Nevada (0%)</option><option value="NH">New Hampshire</option><option value="NJ">New Jersey</option>
                                <option value="NM">New Mexico</option><option value="NY">New York</option><option value="NC">North Carolina</option>
                                <option value="ND">North Dakota</option><option value="OH">Ohio</option><option value="OK">Oklahoma</option>
                                <option value="OR">Oregon</option><option value="PA">Pennsylvania</option><option value="RI">Rhode Island</option>
                                <option value="SC">South Carolina</option><option value="SD">South Dakota (0%)</option><option value="TX">Texas (0%)</option>
                                <option value="UT">Utah</option><option value="VT">Vermont</option><option value="VA">Virginia</option>
                                <option value="WA">Washington (0%)</option><option value="WV">West Virginia</option><option value="WI">Wisconsin</option>
                                <option value="WY">Wyoming (0%)</option>
                            </select>
                        </div>
                        <div class="input-group"><label>Age Now</label><input type="number" id="age-now" value="35" oninput="recalc()"></div>
                        <div class="input-group"><label>Expectancy</label><input type="number" id="age-end" value="90" oninput="recalc()"></div>
                    </div>
                </div>

                <div class="card">
                    <h3>Asset Inventory</h3>
                    <div id="asset-container">
                        <div class="entry-row">
                            <select><option>Brokerage (Stocks/Bonds)</option><option>Qualified (401k/IRA)</option><option>CDs/High Yield</option><option>Real Estate</option><option>Crypto</option></select>
                            <input type="number" value="150000" class="asset-input" oninput="recalc()">
                            <div class="del-btn" onclick="this.parentElement.remove(); recalc()">×</div>
                        </div>
                    </div>
                    <div class="add-btn" onclick="addRow('asset-container', 'asset-input')">+ Add Asset Type</div>
                </div>

                <div class="card">
                    <h3>Monthly Expenses</h3>
                    <div id="expense-container">
                        <div class="entry-row">
                            <select><option>Housing/Rent</option><option>Utilities</option><option>Insurance</option><option>Discretionary</option><option>Debt Service</option></select>
                            <input type="number" value="2500" class="exp-input" oninput="recalc()">
                            <div class="del-btn" onclick="this.parentElement.remove(); recalc()">×</div>
                        </div>
                    </div>
                    <div class="add-btn" onclick="addRow('expense-container', 'exp-input')">+ Add Expense</div>
                </div>

                <div class="card">
                    <h3>Logic Explorer (Show Your Work)</h3>
                    <div id="logic-content" class="logic-panel"></div>
                </div>
            </section>
        </div>

        <aside class="sidebar-right">
            <h3>Advisor Intelligence</h3>
            <div class="card">
                <label>Terminal Wealth (Age 90)</label>
                <div class="metric-val" id="val-terminal">$0</div>
                <label>Effective Tax Rate</label>
                <div class="metric-val" id="val-eff-rate">0%</div>
            </div>
        </aside>
    </div>
</main>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
