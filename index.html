<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Dependents</h4>
<input id="dependents" type="number">
</div>

<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance">
</div>

<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="grid">

<div class="card">
<h4>Age & Retirement</h4>
<input id="currentAge" placeholder="Current Age" value="40">
<input id="retirementAge" placeholder="Retirement Age" value="65">
<input id="lifeExpectancy" placeholder="Life Expectancy" value="90">
</div>

<div class="card">
<h4>Adjustments</h4>
<input id="incomeAdjust" placeholder="Income Change (%)">
<input id="expenseAdjust" placeholder="Expense Change (%)">
<input id="returnAdjust" placeholder="Return Change (%)">
</div>

</div>
</div>

</div>

<div class="side">

<div class="card"><h4>Status</h4><div id="status"></div></div>
<div class="card"><h4>Failure</h4><div id="failure"></div></div>
<div class="card"><h4>Action</h4><div id="action"></div></div>
<div class="card"><h4>AI</h4><div id="aiOutput"></div></div>

</div>

</div>
</div>

<script>

// STATE
let state = {
  incomes: [],
  expenses: [],
  accounts: [],
  dependents: 0,
  assets: { cash:0, invest:0, debt:0 },
  filing: "single",
  timeline:{currentAge:40,retirementAge:65,lifeExpectancy:90}
};

function norm(a,f){return a*(f==="monthly"?12:f==="biweekly"?26:1);}

// TAX
function calcTax(income, filing, dependents){
  let brackets = {
    single:[[11000,0.1],[44725,0.12],[95375,0.22]],
    married_joint:[[22000,0.1],[89450,0.12],[190750,0.22]],
    head:[[15700,0.1],[59850,0.12],[95350,0.22]]
  };
  let tax=0,prev=0;
  for(let [limit,rate] of brackets[filing]){
    if(income>limit){tax+=(limit-prev)*rate;prev=limit;}
    else{tax+=(income-prev)*rate;break;}
  }
  tax -= dependents*2000;
  return Math.max(tax,0);
}

// CORE
function calculate(){
  let income = state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
  let expenses = state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);
  let tax = calcTax(income,state.filing,state.dependents);
  let net = income-expenses-tax;
  let accountValue = state.accounts.reduce((s,a)=>s+(a.balance||0),0);

  let netWorth = accountValue + state.assets.cash + state.assets.invest - state.assets.debt;

  let savingsRate = income>0?((income-expenses)/income)*100:0;

  return {income,expenses,net,netWorth,savingsRate};
}

// AGE ENGINE
function projection(d){

  let age=+currentAge.value||40;
  let retire=+retirementAge.value||65;
  let end=+lifeExpectancy.value||90;

  let incomeAdj=(+incomeAdjust.value||0)/100;
  let expenseAdj=(+expenseAdjust.value||0)/100;
  let returnAdj=(+returnAdjust.value||0)/100;

  let nw=d.netWorth;

  for(let a=age;a<=end;a++){

    let r=0.06+returnAdj;

    let inc=d.income*(1+incomeAdj);
    let exp=d.expenses*(1+expenseAdj);

    let flow=a>=retire?-exp:(inc-exp);

    nw=nw*(1+r)+flow;

    if(nw<=0) return {success:false,failAge:a};
  }

  return {success:true};
}

// UPDATE
function updateAll(){

  let d=calculate();
  let p=projection(d);

  netWorth.innerText="$"+Math.round(d.netWorth);
  income.innerText="$"+Math.round(d.income);
  expensesOut.innerText="$"+Math.round(d.expenses);
  savingsRate.innerText=d.savingsRate.toFixed(1)+"%";

  status.innerText=p.success?"On Track":"Fails at "+p.failAge;
  failure.innerText=p.success?"Stable":"Plan failure";
  action.innerText=d.savingsRate<10?"Increase savings":"Maintain";

  aiOutput.innerText=p.success?"Strong plan":"Adjust plan";
}

// INPUTS
dependents.oninput=()=>{state.dependents=+dependents.value||0;updateAll();}
accBalance.oninput=()=>{
  if(state.accounts.length===0)state.accounts.push({balance:0});
  state.accounts[0].balance=+accBalance.value||0;
  updateAll();
};
["cash","invest","debt"].forEach(id=>{
  document.getElementById(id).oninput=()=>{
    state.assets[id]=+document.getElementById(id).value||0;
    updateAll();
  };
});
["currentAge","retirementAge","lifeExpectancy","incomeAdjust","expenseAdjust","returnAdjust"]
.forEach(id=>{
  document.getElementById(id).oninput=updateAll;
});

// NAV
function showView(v,e){
  ["dashboard","financials","scenarios"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(v).style.display="block";
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  e.classList.add("active");
}

// INIT
window.onload=()=>{
  state.incomes.push({amount:80000,freq:"yearly"});
  state.expenses.push({amount:40000,freq:"yearly"});
  updateAll();
};

// =========================
// REAL MONTE CARLO + WITHDRAWAL ENGINE (ADD ONLY)
// =========================

// timeline-safe Monte carlo
function monteCarloReal(d){

  let sims = 200;
  let success = 0;

  let age = +currentAge.value || 40;
  let retire = +retirementAge.value || 65;
  let end = +lifeExpectancy.value || 90;

  for(let i=0;i<sims;i++){

    let nw = d.netWorth;

    for(let a=age; a<=end; a++){

      let r = (Math.random()*0.15) - 0.05; // -5% to +10%

      let isRetired = a >= retire;

      let expenses = d.expenses * Math.pow(1.03, a-age);

      let flow = isRetired
        ? -expenses
        : (d.income - d.expenses);

      nw = nw*(1+r) + flow;

      if(nw <= 0) break;
    }

    if(nw > 0) success++;
  }

  return (success / sims) * 100;
}


// enhanced projection (withdrawal aware)
function projectionReal(d){

  let age = +currentAge.value || 40;
  let retire = +retirementAge.value || 65;
  let end = +lifeExpectancy.value || 90;

  let nw = d.netWorth;

  for(let a=age; a<=end; a++){

    let isRetired = a >= retire;

    let r = 0.06;
    let expenses = d.expenses * Math.pow(1.03, a-age);

    let flow = isRetired
      ? -expenses
      : (d.income - d.expenses);

    nw = nw*(1+r) + flow;

    if(nw <= 0){
      return {
        success:false,
        failAge:a
      };
    }
  }

  return {success:true};
}


// =========================
// EXTEND EXISTING updateAll (SAFE HOOK)
// =========================

const __originalUpdateAll = updateAll;

updateAll = function(){

  // run your existing logic FIRST
  __originalUpdateAll();

  try {

    let d = calculate();

    // NEW ENGINES
    let mc = monteCarloReal(d);
    let proj = projectionReal(d);

    // overwrite outputs ONLY (no UI changes)
    status.innerText =
      proj.success ? "On Track" : "Fails at age " + proj.failAge;

    failure.innerText =
      "Success Rate: " + mc.toFixed(1) + "%";

    action.innerText =
      mc > 80 ? "Strong plan" :
      mc > 60 ? "Moderate risk" :
      "High risk — adjust plan";

  } catch(e){
    console.log("Monte Carlo error:", e);
  }

};

  // =========================
// INPUT SANITIZATION (NO MORE GHOST VALUES)
// =========================

function getSafeIncome(){
  if(state.incomes.length === 0) return 0;
  return state.incomes.reduce((s,i)=>s+(i.amount||0),0);
}

function getSafeExpenses(){
  // if user typed anything, ignore defaults
  let manual = document.querySelectorAll("#expenseList input");
  let hasManual = [...manual].some(i => i.value && +i.value > 0);

  if(hasManual){
    let total = 0;
    manual.forEach(i=>{
      total += (+i.value || 0);
    });
    return total;
  }

  return state.expenses.reduce((s,e)=>s+(e.amount||0),0);
}


// =========================
// OVERRIDE CALC SAFELY
// =========================

const __oldCalculate = calculate;

calculate = function(){

  let d = __oldCalculate();

  let safeIncome = getSafeIncome();
  let safeExpenses = getSafeExpenses();

  d.income = safeIncome;
  d.expenses = safeExpenses;

  return d;
};


// =========================
// INTERACTIVE RIGHT PANEL (CLICKABLE CARDS)
// =========================

function explain(type){

  let text = "";

  if(type==="status"){
    text = "Status shows whether your plan survives from your current age to life expectancy.";
  }

  if(type==="failure"){
    text = "Success Rate = probability your money lasts through retirement using simulations.";
  }

  if(type==="action"){
    text = "Action is based on savings rate and Monte Carlo success probability.";
  }

  if(type==="ai"){
    text = "AI summarizes your biggest financial risks and next best move.";
  }

  aiOutput.innerText = text;
}

// make cards clickable
setTimeout(()=>{
  status.parentElement.onclick = ()=>explain("status");
  failure.parentElement.onclick = ()=>explain("failure");
  action.parentElement.onclick = ()=>explain("action");
  aiOutput.parentElement.onclick = ()=>explain("ai");
},500);


// =========================
// SCENARIO EXPLANATION (VISIBLE CONTEXT)
// =========================

function updateScenarioExplanation(){

  let age = +currentAge.value || 0;
  let retire = +retirementAge.value || 0;

  let text = `
  You are modeling a plan from age ${age} to ${retire}.
  Income stops at retirement.
  Expenses continue and grow with inflation.
  Your investments fund retirement.
  `;

  aiOutput.innerText = text;
}

// attach
["currentAge","retirementAge","lifeExpectancy"].forEach(id=>{
  document.getElementById(id).addEventListener("input",updateScenarioExplanation);
});


// =========================
// DASHBOARD INFOGRAPHICS (LIGHTWEIGHT)
// =========================

function renderDashboardCharts(d){

  // simple bar visualization (no library)
  let container = document.getElementById("dashboard");

  let existing = document.getElementById("miniChart");
  if(existing) existing.remove();

  let chart = document.createElement("div");
  chart.id = "miniChart";
  chart.style.marginTop = "20px";

  let incomeBar = (d.income/1000);
  let expenseBar = (d.expenses/1000);

  chart.innerHTML = `
    <div style="margin-top:10px">
      <div>Income</div>
      <div style="background:#0f172a;height:10px;width:${incomeBar}px"></div>
    </div>
    <div style="margin-top:10px">
      <div>Expenses</div>
      <div style="background:#dc2626;height:10px;width:${expenseBar}px"></div>
    </div>
  `;

  container.appendChild(chart);
}


// =========================
// EXTEND UPDATE AGAIN (FINAL LAYER)
// =========================

const __finalUpdate = updateAll;

updateAll = function(){

  __finalUpdate();

  try{
    let d = calculate();

    renderDashboardCharts(d);
    updateScenarioExplanation();

  }catch(e){
    console.log("Final layer error:", e);
  }
};
  
</script>

</body>
</html>
