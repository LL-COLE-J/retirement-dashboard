<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#0B0F1A;color:#E5E7EB;display:flex;height:100vh;}
.sidebar{width:220px;background:#0F172A;padding:20px;}
.nav-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;}
.nav-item.active{background:linear-gradient(135deg,#3B82F6,#6366F1);}
.main{flex:1;display:flex;}
.content{flex:1;padding:20px;overflow:auto;}
.card{background:#111827;padding:15px;border-radius:12px;margin-bottom:12px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
input, select{width:100%;padding:8px;margin-top:4px;background:#1F2937;border:none;color:white;border-radius:6px;}
button{margin-top:10px;padding:6px 10px;border:none;border-radius:6px;background:#3B82F6;color:white;cursor:pointer;}
.ai{width:260px;background:#0F172A;padding:15px;}
label{display:block;font-size:12px;margin-top:10px;color:#9CA3AF;}
canvas{height:220px!important;}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
<div class="nav-item" onclick="showView('tools',this)">Tools</div>
</div>

<div class="main">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="grid">
<div class="card">Net Worth<div id="netWorth"></div></div>
<div class="card">Income<div id="income"></div></div>
<div class="card">Expenses<div id="expensesOut"></div></div>
<div class="card">Success %<div id="successRate"></div></div>
</div>

<div class="grid">
<div class="card">FI Ratio<div id="fiRatio"></div></div>
<div class="card">Savings Rate<div id="savingsRate"></div></div>
<div class="card">Burn Multiple<div id="burnMultiple"></div></div>
<div class="card">Decision<div id="decision"></div></div>
</div>

<div class="card" id="summary"></div>

<canvas id="chart"></canvas>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h4>Household</h4>

<label>Current Age</label>
<input id="age" placeholder="e.g. 40">

<label>Retirement Age</label>
<input id="retAge" placeholder="e.g. 65">

<label>Total Income</label>
<input id="incomeInput" placeholder="e.g. 90000">

<label>Income Frequency</label>
<select id="incomeFreq">
<option value="yearly">Yearly</option>
<option value="monthly">Monthly</option>
<option value="biweekly">Biweekly</option>
<option value="weekly">Weekly</option>
</select>

</div>

<div class="card">
<h4>Dependents</h4>

<label>Annual Cost per Dependent</label>
<input id="depCost" placeholder="e.g. 12000">

<label>Years Remaining</label>
<input id="depYears" placeholder="e.g. 18">

</div>

<div class="card">
<h4>Assets</h4>

<label>Cash</label>
<input id="cash" placeholder="e.g. 20000">

<label>Investments</label>
<input id="invest" placeholder="e.g. 100000">

</div>

<div class="card">
<h4>Liabilities</h4>

<label>Total Debt</label>
<input id="debt" placeholder="e.g. 25000">

</div>

<div class="card">
<h4>Expenses</h4>

<label>Amount</label>
<input id="exp" placeholder="e.g. 50000">

<label>Frequency</label>
<select id="expFreq">
<option value="yearly">Yearly</option>
<option value="monthly">Monthly</option>
<option value="biweekly">Biweekly</option>
</select>

</div>

<div class="card">
<h4>Contributions</h4>

<label>Annual Contribution</label>
<input id="contrib" placeholder="e.g. 15000">

</div>

<div class="card">
<h4>Tax</h4>

<label>Effective Tax Rate</label>
<input id="taxRate" placeholder="e.g. 0.22">

</div>

</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="card">

<button onclick="applyScenario('crash')">Market Crash</button>
<button onclick="applyScenario('inflation')">High Inflation</button>
<button onclick="applyScenario('jobloss')">Job Loss</button>

<label>Return %</label>
<input id="returnRate" placeholder="default 6">

<label>Inflation %</label>
<input id="inflation" placeholder="default 2.5">

</div>
</div>

<!-- TOOLS -->
<div id="tools" style="display:none">

<div class="card">
<h4>Compound Interest</h4>

<label>Principal</label>
<input id="p">

<label>Rate</label>
<input id="r">

<label>Years</label>
<input id="t">

<button onclick="calcCompound()">Calculate</button>
<div id="compoundOut"></div>
</div>

<div class="card">
<h4>Loan Payment</h4>

<label>Loan Amount</label>
<input id="lp">

<label>Rate</label>
<input id="lr">

<label>Months</label>
<input id="lm">

<button onclick="calcLoan()">Calculate</button>
<div id="loanOut"></div>
</div>

</div>

</div>

<div class="ai">
<h4>Advisor</h4>
<div id="ai"></div>
</div>

</div>

<script>

let chart;

/* NAV */
function showView(id,el){
["dashboard","financials","scenarios","tools"].forEach(v=>document.getElementById(v).style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

/* FREQUENCY */
function normalize(amount,freq){
const map={weekly:52,biweekly:26,monthly:12,yearly:1};
return amount*(map[freq]||1);
}

/* RANDOM RETURN */
function rand(mean,std){
let u=Math.random(),v=Math.random();
let z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
return mean+z*std;
}

/* SIMULATION */
function simulate(){

let runs=100,results=[],path=[];

for(let i=0;i<runs;i++){

let bal=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);

let income=normalize(+incomeInput.value||0,incomeFreq.value);
let expenses=normalize(+exp.value||0,expFreq.value);

let contrib=(+contrib.value||0);
let tax=(+taxRate.value||0.22);
let inf=(+inflation.value||2.5)/100;
let ret=(+returnRate.value||6)/100;

let depCost=(+depCost.value||0);
let depYears=(+depYears.value||0);

let arr=[];

for(let y=0;y<50;y++){

let ror=rand(ret,0.12);

let inc = (y < (+retAge.value - +age.value)) ? income*(1-tax) : 0;

let dep = y < depYears ? depCost : 0;

let expAdj = expenses*Math.pow(1+inf,y);

bal += bal*ror + inc - expAdj - dep + contrib;

arr.push(bal);

if(bal<=0) break;
}

results.push(arr.length);
if(i===0) path=arr;
}

let success = results.filter(x=>x>=30).length/runs;
let median = results.sort()[Math.floor(results.length/2)];

return {success,median,path};
}

/* UPDATE */
function update(){

let sim=simulate();

let total=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);
let income=normalize(+incomeInput.value||0,incomeFreq.value);
let expenses=normalize(+exp.value||0,expFreq.value);

netWorth.innerText="$"+total.toLocaleString();
income.innerText="$"+income.toLocaleString();
expensesOut.innerText="$"+expenses.toLocaleString();

successRate.innerText=(sim.success*100).toFixed(0)+"%";

fiRatio.innerText=(total/(expenses*25)).toFixed(2);
savingsRate.innerText=((income-expenses)/income*100).toFixed(1)+"%";
burnMultiple.innerText=(total/expenses).toFixed(1);

let decision="SAFE";
if(sim.success<0.8) decision="RISK";
if(sim.success<0.6) decision="FAIL";

decision.innerText=decision;

summary.innerHTML=`Success ${(sim.success*100).toFixed(1)}% | Median ${sim.median} yrs`;

let aiText=[];
aiText.push(`Success probability: ${(sim.success*100).toFixed(1)}%`);
aiText.push("Adjust savings or retirement age to improve outcomes.");
ai.innerHTML=aiText.join("<br><br>");

if(chart) chart.destroy();
chart=new Chart(chart,{
type:'line',
data:{labels:sim.path.map((_,i)=>i),datasets:[{data:sim.path}]}
});
}

/* SCENARIOS */
function applyScenario(t){
if(t==="crash") returnRate.value=2;
if(t==="inflation") inflation.value=5;
if(t==="jobloss") incomeInput.value=0;
update();
}

/* TOOLS */
function calcCompound(){
let P=+p.value,r=+r.value/100,tv=+t.value;
compoundOut.innerText=(P*Math.pow(1+r,tv)).toFixed(0);
}

function calcLoan(){
let P=+lp.value,r=+lr.value/100/12,n=+lm.value;
loanOut.innerText=(P*r/(1-Math.pow(1+r,-n))).toFixed(0);
}

/* INIT */
document.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",update));
window.onload=update;

</script>

</body>
</html>
