<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

:root {
  --bg:#0B0F1A;
  --sidebar:#0F172A;
  --card:#111827;
  --card-light:#1F2937;
  --text-primary:#E5E7EB;
  --text-secondary:#9CA3AF;
  --border:rgba(255,255,255,0.05);
  --gradient:linear-gradient(135deg,#3B82F6,#6366F1);
}

body { background:var(--bg); color:var(--text-primary); display:flex; height:100vh; }

.sidebar {
  width:220px;
  background:var(--sidebar);
  padding:20px;
  border-right:1px solid var(--border);
}

.logo { font-size:18px; margin-bottom:20px; }

.nav-item {
  padding:10px;
  border-radius:8px;
  color:var(--text-secondary);
  cursor:pointer;
  margin-bottom:6px;
}
.nav-item.active { background:var(--gradient); color:white; }

.main { flex:1; display:flex; }

.content { flex:1; padding:20px; overflow:auto; }

.ai {
  width:260px;
  background:var(--sidebar);
  border-left:1px solid var(--border);
  padding:15px;
}

.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.chartGrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }

.card {
  background:var(--card);
  padding:15px;
  border-radius:12px;
  border:1px solid var(--border);
}

input {
  width:100%;
  padding:10px;
  margin-top:8px;
  background:var(--card-light);
  border:none;
  border-radius:8px;
  color:white;
}

button {
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--gradient);
  color:white;
  cursor:pointer;
}

canvas { width:100% !important; height:200px !important; }

@media (max-width:900px){
  body { flex-direction:column; }

  .sidebar {
    width:100%;
    display:flex;
    justify-content:space-around;
    border-bottom:1px solid var(--border);
  }

  .main { flex-direction:column; }

  .ai {
    position:fixed;
    bottom:0;
    width:100%;
    height:140px;
  }

  .content { padding-bottom:160px; }

  .grid { grid-template-columns:1fr; }
  .chartGrid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">AVORA</div>
  <div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
  <div class="nav-item" onclick="showView('financials',this)">Financials</div>
  <div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
  <div class="card">Net Worth<div id="netWorth">$0</div></div>
  <div class="card">Income<div id="income">$0</div></div>
  <div class="card">Expenses<div id="expensesOut">$0</div></div>
  <div class="card">Years<div id="years">0</div></div>
</div>

<div class="chartGrid">
  <div class="card"><canvas id="c1"></canvas></div>
  <div class="card"><canvas id="c2"></canvas></div>
  <div class="card"><canvas id="c3"></canvas></div>
  <div class="card"><canvas id="c4"></canvas></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="card">

<h4>Person A</h4>
<input id="incomeA" placeholder="Income A (Yearly)">
<input id="ageA" placeholder="Age A">
<input id="retA" placeholder="Retire Age A">

<h4>Person B</h4>
<input id="incomeB" placeholder="Income B (Yearly)">
<input id="ageB" placeholder="Age B">
<input id="retB" placeholder="Retire Age B">

<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">

<h4>Expenses</h4>
<input id="exp" placeholder="Annual Expenses">

<hr style="margin:15px 0;border-color:rgba(255,255,255,0.05);">

<h4>Stock Portfolio</h4>
<input id="ticker" placeholder="Ticker (AAPL)">
<input id="shares" placeholder="Shares">
<button onclick="addStock()">Add Stock</button>

<div id="stockList"></div>

<hr style="margin:15px 0;border-color:rgba(255,255,255,0.05);">

<button onclick="saveProfile()">Save Profile</button>
<button onclick="loadProfile()">Load Profile</button>
  <div id="profileList" style="margin-top:10px;"></div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="card">
<h4>Assumptions</h4>
<input id="returnRate" placeholder="Return % (default 5)">
<input id="inflation" placeholder="Inflation % (default 2.5)">
</div>
</div>

</div>

<!-- AI PANEL -->
<div class="ai" id="aiPanel">
  <div style="display:flex;justify-content:space-between;">
    <h4>AI Advisor</h4>
    <button onclick="toggleAI()">▼</button>
  </div>
  <div id="aiOutput">Ready...</div>
</div>

</div>

<script>

const AI_URL = "https://summer-boat-369f.llcolej8.workers.dev";

let charts={}, portfolio=[], aiOpen=true;

/* FIXED UPDATE */
function updateAll(){

let stockValue = portfolio.reduce((s,p)=>s+(p.price*p.shares),0);

let total=(+cash.value||0)+(+invest.value||0)+stockValue;
let incomeVal=(+incomeA.value||0)+(+incomeB.value||0);
let expVal=(+exp.value||0);

/* RATIOS */
let savingsRate = incomeVal ? ((incomeVal-expVal)/incomeVal) : 0;
let burnRate = expVal/12;
let yearsSafe = total / (expVal || 1);

let m=buildModel(total,expVal);

/* DASHBOARD */
netWorth.innerText="$"+total.toLocaleString();
document.getElementById("income").innerText="$"+incomeVal.toLocaleString();
expensesOut.innerText="$"+expVal.toLocaleString();
years.innerText=m.length;

/* ADD NEW METRICS (create divs later if needed) */
console.log({
  savingsRate,
  burnRate,
  yearsSafe
});

renderCharts(m);

/* REAL AI CALL */
callAI({
  netWorth: total,
  income: incomeVal,
  expenses: expVal,
  years: m.length,
  savingsRate,
  burnRate,
  yearsSafe,
  portfolio
});
}

/* AI */
async function callAI(model){
  try{
    aiOutput.innerHTML="Analyzing...";

    const res=await fetch(AI_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(model)
    });

    const data=await res.json();

    aiOutput.innerHTML=data.result || "No response";

  }catch(e){
    console.error(e);
    aiOutput.innerHTML="AI error";
  }
}

/* STOCKS */
async function addStock(){
const t=ticker.value.toUpperCase();
const s=+shares.value||0;
if(!t||!s)return;

const res=await fetch(`https://api.twelvedata.com/price?symbol=${t}&apikey=demo`);
const data=await res.json();

portfolio.push({ticker:t,shares:s,price:+data.price||0});
renderPortfolio(); updateAll();
}

function renderPortfolio(){
stockList.innerHTML=portfolio.map(p=>
`${p.ticker} - ${p.shares} ($${(p.price*p.shares).toFixed(0)})`
).join("<br>");
}

/* ===== PROFILES (REAL SYSTEM) ===== */

function saveProfile(){

let name = prompt("Name this profile:");
if(!name) return;

let profiles = JSON.parse(localStorage.getItem("avoraProfiles")||"{}");

profiles[name] = {
incomeA:incomeA.value,
incomeB:incomeB.value,
ageA:ageA.value,
ageB:ageB.value,
retA:retA.value,
retB:retB.value,
cash:cash.value,
invest:invest.value,
exp:exp.value,
portfolio
};

localStorage.setItem("avoraProfiles", JSON.stringify(profiles));

renderProfiles();
}

function loadProfile(name){

let profiles = JSON.parse(localStorage.getItem("avoraProfiles")||"{}");
let d = profiles[name];
if(!d) return;

incomeA.value=d.incomeA;
incomeB.value=d.incomeB;
ageA.value=d.ageA;
ageB.value=d.ageB;
retA.value=d.retA;
retB.value=d.retB;
cash.value=d.cash;
invest.value=d.invest;
exp.value=d.exp;

portfolio=d.portfolio||[];

renderPortfolio();
updateAll();
}

function renderProfiles(){

let profiles = JSON.parse(localStorage.getItem("avoraProfiles")||"{}");

profileList.innerHTML = Object.keys(profiles).map(name=>
`<div style="margin-top:6px;cursor:pointer" onclick="loadProfile('${name}')">
📁 ${name}
</div>`
).join("");
}

/* INIT */
window.onload=()=>{
  renderProfiles();
  updateAll();
};

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("input",updateAll);
});

</script>
</body>
</html>
