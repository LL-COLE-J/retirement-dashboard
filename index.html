<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax Profile</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
<input id="stateTax" placeholder="State Tax %" oninput="state.tax.state=+this.value||0;updateAll()">
<input id="fedAdj" placeholder="Federal Adj %" oninput="state.tax.fedAdj=+this.value||0;updateAll()">
</div>

<div class="card">
<h4>Accounts (Advisor Level)</h4>
<div id="accountList"></div>
<button onclick="addAccount()">Add Account</button>
</div>

<div class="card">
<h4>Assets / Liabilities</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="grid">

<div class="card">
<h4>Age & Retirement</h4>
<input id="currentAge" value="40">
<input id="retirementAge" value="65">
<input id="lifeExpectancy" value="90">
</div>

</div>
</div>

</div>

<div class="side">
<div class="card"><h4>Status</h4><div id="status"></div></div>
<div class="card"><h4>Failure</h4><div id="failure"></div></div>
<div class="card"><h4>Action</h4><div id="action"></div></div>
<div class="card"><h4>AI</h4><div id="aiOutput"></div></div>
</div>

</div>
</div>

<script>

/* =========================
STATE (EXTENDED ONLY)
========================= */
let state = {
  incomes: [],
  expenses: [],
  accounts: [],
  dependents: [],
  assets:{cash:0,invest:0,debt:0},
  filing:"single",
  tax:{state:0,fedAdj:0},
  timeline:{currentAge:40,retirementAge:65,lifeExpectancy:90},
  settings:{inflation:0.03}
};

/* =========================
HELPERS
========================= */
function norm(a,f){
  return (+a||0)*(f==="monthly"?12:1);
}

/* =========================
CALC (EXTENDED, NOT REPLACED)
========================= */
function calculate(){

  let income = state.incomes.reduce((s,i)=>{
    let val = norm(i.amount,i.freq);
    if(i.type==="bonus") val*=0.7;
    if(i.type==="passive") val*=0.95;
    return s+val;
  },0);

  let expenses = state.expenses.reduce((s,e)=>{
    let val = norm(e.amount,e.freq);
    if(e.essential===false) val*=1.1;
    return s+val;
  },0);

  let taxDrag = income * ((state.tax.state||0)/100 + (state.tax.fedAdj||0)/100);

  let net = income - expenses - taxDrag;

  let netWorth =
    state.accounts.reduce((s,a)=>s+(a.balance||0),0) +
    state.assets.cash + state.assets.invest - state.assets.debt;

  let savingsRate = income>0 ? ((income-expenses)/income)*100 : 0;

  return {income,expenses,net,netWorth,savingsRate};
}

/* =========================
TIMELINE
========================= */
function runTimeline(d){

  let nw=d.netWorth;
  let fail=null;

  let avgReturn =
    state.accounts.reduce((s,a)=>s+(a.return||0.06),0) /
    (state.accounts.length||1);

  for(let a=state.timeline.currentAge;a<=state.timeline.lifeExpectancy;a++){

    let income=a<state.timeline.retirementAge?d.income:0;
    let expenses=d.expenses*Math.pow(1+state.settings.inflation,a-state.timeline.currentAge);

    nw=nw*(1+avgReturn)+(income-expenses);

    if(nw<=0 && fail===null) fail=a;
  }

  return {success:fail===null,failureAge:fail};
}

/* =========================
MC
========================= */
function runMonteCarlo(d){
  let success=0;

  for(let i=0;i<100;i++){
    let nw=d.netWorth;

    for(let a=state.timeline.currentAge;a<=state.timeline.lifeExpectancy;a++){
      let r=(Math.random()*0.12)-0.02;
      let income=a<state.timeline.retirementAge?d.income:0;
      let expenses=d.expenses*Math.pow(1.03,a-state.timeline.currentAge);

      nw=nw*(1+r)+(income-expenses);
      if(nw<=0) break;
    }

    if(nw>0) success++;
  }

  return success;
}

/* =========================
ENGINE
========================= */
function runEngine(){
  let d=calculate();
  let t=runTimeline(d);
  let mc=runMonteCarlo(d);
  return {...d,...t,mc};
}

/* =========================
ADVISOR
========================= */
function advice(d){
  if(d.savingsRate<15) return "Increase savings rate.";
  if(!d.success) return "Delay retirement or reduce expenses.";
  return "Plan stable.";
}

/* =========================
UI
========================= */
function updateAll(){

  let d=runEngine();

  netWorth.innerText="$"+Math.round(d.netWorth);
  income.innerText="$"+Math.round(d.income);
  expensesOut.innerText="$"+Math.round(d.expenses);
  savingsRate.innerText=d.savingsRate.toFixed(1)+"%";

  status.innerText=d.success?"On Track":"Fails at "+d.failureAge;
  failure.innerText="MC Success: "+d.mc+"%";
  action.innerText=d.mc>70?"Good":"Risk";
  aiOutput.innerText=advice(d);
}

/* =========================
ADDERS
========================= */
function addIncome(){
  state.incomes.push({amount:0,freq:"yearly",type:"salary"});
  render();
}

function addExpense(){
  state.expenses.push({amount:0,freq:"yearly",essential:true});
  render();
}

function addAccount(){
  state.accounts.push({type:"401k",balance:0,return:0.07});
  render();
}

/* =========================
RENDER
========================= */
function render(){

  incomeList.innerHTML=state.incomes.map((i,idx)=>`
    <input placeholder="Amount" value="${i.amount||""}" onblur="state.incomes[${idx}].amount=this.value;updateAll()">
  `).join("");

  expenseList.innerHTML=state.expenses.map((e,idx)=>`
    <input placeholder="Amount" value="${e.amount||""}" onblur="state.expenses[${idx}].amount=this.value;updateAll()">
  `).join("");

  accountList.innerHTML=state.accounts.map((a,idx)=>`
    <input placeholder="Balance" value="${a.balance||""}" onblur="state.accounts[${idx}].balance=this.value;updateAll()">
  `).join("");

  ["cash","invest","debt"].forEach(id=>{
    document.getElementById(id).oninput = ()=>{
      state.assets[id] = +document.getElementById(id).value||0;
      updateAll();
    };
  });

  updateAll();
}

/* =========================
NAV
========================= */
function showView(v,e){
  ["dashboard","financials","scenarios"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(v).style.display="block";

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  e.classList.add("active");
}

/* =========================
INIT
========================= */
window.onload=render;

</script>

</body>
</html>
