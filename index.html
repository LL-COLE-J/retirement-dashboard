<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{
--bg:#0B0F1A;--sidebar:#0F172A;--card:#111827;
--card-light:#1F2937;--text:#E5E7EB;--sub:#9CA3AF;
--grad:linear-gradient(135deg,#3B82F6,#6366F1);
}
body{background:var(--bg);color:var(--text);display:flex;height:100vh;}
.sidebar{width:220px;background:var(--sidebar);padding:20px;}
.logo{margin-bottom:20px;font-weight:600;}
.nav-item{margin:8px 0;cursor:pointer;color:var(--sub);}
.nav-item.active{color:white;}
.main{flex:1;display:flex;flex-direction:column;}
.topbar{padding:20px;border-bottom:1px solid #111;}
.content{padding:20px;overflow:auto;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px;}

.card{background:var(--card);padding:15px;border-radius:12px;}
.kpi{font-size:20px;margin-top:5px;}

.field{position:relative;margin-top:12px;}
.field input{
width:100%;padding:16px 10px 6px;
background:var(--card-light);border:none;border-radius:8px;color:white;
}
.field label{
position:absolute;top:50%;left:10px;transform:translateY(-50%);
color:var(--sub);font-size:13px;transition:.2s;
}
.field input:focus+label,
.field input:not(:placeholder-shown)+label{
top:5px;font-size:11px;color:#3B82F6;
}

button{
margin-top:15px;padding:10px;border:none;
background:var(--grad);color:white;border-radius:8px;cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item active" onclick="showView('dashboard',event)">Dashboard</div>
<div class="nav-item" onclick="showView('inputs',event)">Financials</div>
</div>

<div class="main">
<div class="topbar">Retirement Dashboard</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboardView">

<div class="grid">
<div class="card">Net Worth<div id="netWorth" class="kpi">$0</div></div>
<div class="card">Surplus<div id="surplus" class="kpi">$0</div></div>
<div class="card">Years Covered<div id="years" class="kpi">--</div></div>
<div class="card">Score<div id="score" class="kpi">--</div></div>
</div>

<div class="grid">
<div class="card">Savings Rate<div id="saveRate" class="kpi">--</div></div>
<div class="card">Burn Rate<div id="burnRate" class="kpi">--</div></div>
<div class="card">Income Ratio<div id="incomeRatio" class="kpi">--</div></div>
<div class="card">Risk Buffer<div id="riskBuffer" class="kpi">--</div></div>
</div>

<div class="chartGrid">
<div class="card"><canvas id="projectionChart"></canvas></div>
<div class="card"><canvas id="cashflowChart"></canvas></div>
<div class="card"><canvas id="netFlowChart"></canvas></div>
<div class="card"><canvas id="riskChart"></canvas></div>
</div>

<div class="card" style="margin-top:20px;">
<h3>AI Insight</h3>
<button onclick="runAI()">Analyze Plan</button>
<div id="aiOutput"></div>
</div>

</div>

<!-- INPUTS -->
<div id="inputView" style="display:none">

<div class="card">

<h4>Person A</h4>
<div class="field"><input id="incomeA" placeholder=" "><label>Income</label></div>
<div class="field"><input id="retA" placeholder=" "><label>Retirement</label></div>

<h4 style="margin-top:10px;">Person B</h4>
<div class="field"><input id="incomeB" placeholder=" "><label>Income</label></div>
<div class="field"><input id="retB" placeholder=" "><label>Retirement</label></div>

<h4 style="margin-top:10px;">Shared</h4>
<div class="field"><input id="cash" placeholder=" "><label>Cash</label></div>
<div class="field"><input id="investments" placeholder=" "><label>Investments</label></div>
<div class="field"><input id="expenses" placeholder=" "><label>Expenses</label></div>

<button onclick="saveData()">Update Dashboard</button>

</div>

</div>

</div>
</div>

<script>

let projectionChart,cashflowChart,netFlowChart,riskChart;

function showView(v,e){
dashboardView.style.display="none";
inputView.style.display="none";
document.getElementById(v+"View").style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
e.target.classList.add("active");
}

function buildModel(total, income, expenses){
let balance=total;
let timeline=[];
for(let y=0;y<40;y++){
let inc=income*12;
let exp=expenses*12*Math.pow(1.025,y);
balance+=balance*0.05+inc-exp;
timeline.push({y,balance,inc,exp});
if(balance<=0) break;
}
return timeline;
}

function saveData(){

let incomeA=+incomeAEl.value||0;
let incomeB=+incomeB.value||0;

let totalIncome=incomeA+incomeB;

let cash=+cash.value||0;
let inv=+investments.value||0;
let totalAssets=cash+inv;

let exp=+expenses.value||0;

let model=buildModel(totalAssets,totalIncome,exp);

/* KPI */
netWorth.innerText="$"+totalAssets.toLocaleString();
surplus.innerText="$"+(totalIncome-exp);
years.innerText=model.length;

let scoreVal=model.length>30?85:45;
score.innerText=scoreVal;

/* NEW METRICS */
saveRate.innerText=((totalIncome-exp)/totalIncome*100||0).toFixed(1)+"%";
burnRate.innerText=(exp*12).toLocaleString();
incomeRatio.innerText=(totalIncome/exp||0).toFixed(2);
riskBuffer.innerText=model.length+" yrs";

/* CHARTS */
renderCharts(model);
}

function renderCharts(m){

let yrs=m.map(x=>x.y);
let bal=m.map(x=>x.balance);
let inc=m.map(x=>x.inc);
let exp=m.map(x=>x.exp);
let net=m.map(x=>x.inc-x.exp);

if(projectionChart)projectionChart.destroy();
projectionChart=new Chart(projectionChartCanvas,{type:"line",data:{labels:yrs,datasets:[{data:bal}]}});

if(cashflowChart)cashflowChart.destroy();
cashflowChart=new Chart(cashflowChartCanvas,{type:"line",data:{labels:yrs,datasets:[{data:inc},{data:exp}]}});

if(netFlowChart)netFlowChart.destroy();
netFlowChart=new Chart(netFlowChartCanvas,{type:"line",data:{labels:yrs,datasets:[{data:net}]}});

if(riskChart)riskChart.destroy();
riskChart=new Chart(riskChartCanvas,{type:"bar",data:{labels:["Years"],datasets:[{data:[m.length]}]}});
}

function runAI(){

let yrs=parseInt(years.innerText)||0;
let surplusVal=parseFloat(surplus.innerText)||0;

let out=[];

if(yrs<25) out.push("⚠️ High longevity risk");
else out.push("✅ Strong sustainability");

if(surplusVal<0) out.push("⚠️ Structural deficit detected");

if(yrs<20 && surplusVal<0)
out.push("🚨 Critical: Plan fails early and burns cash");

aiOutput.innerHTML=out.join("<br><br>");
}

</script>

</body>
</html>
