<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#0B0F1A;color:#E5E7EB;display:flex;height:100vh;}
.sidebar{width:220px;background:#0F172A;padding:20px;}
.nav-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;}
.nav-item.active{background:linear-gradient(135deg,#3B82F6,#6366F1);}
.main{flex:1;display:flex;}
.content{flex:1;padding:20px;overflow:auto;}
.card{background:#111827;padding:15px;border-radius:12px;margin-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
input{width:100%;padding:8px;margin-top:5px;background:#1F2937;border:none;color:white;border-radius:6px;}
button{margin-top:8px;padding:6px 10px;border:none;border-radius:6px;background:#3B82F6;color:white;cursor:pointer;}
.ai{width:260px;background:#0F172A;padding:15px;}
canvas{height:200px!important;}
.section{margin-bottom:15px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card">Net Worth<div id="netWorth"></div></div>
<div class="card">Income<div id="income"></div></div>
<div class="card">Expenses<div id="expensesOut"></div></div>
<div class="card">Success %<div id="successRate"></div></div>
</div>

<div class="grid">
<div class="card">Savings Rate<div id="savingsRate"></div></div>
<div class="card">Years Funded<div id="years"></div></div>
<div class="card">Failure Age<div id="failAge"></div></div>
<div class="card">Decision<div id="decision"></div></div>
</div>

<div class="card" id="summary"></div>

<canvas id="chart"></canvas>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card section">
<h4>Household Members</h4>
<input id="age" placeholder="Primary Age">
<input id="retAge" placeholder="Retirement Age">
<input id="incomeInput" placeholder="Annual Income">
</div>

<div class="card section">
<h4>Dependents</h4>
<input id="depCost" placeholder="Annual Dependent Cost">
<input id="depYears" placeholder="Years Remaining">
</div>

<div class="card section">
<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
</div>

<div class="card section">
<h4>Liabilities</h4>
<input id="debt" placeholder="Total Debt">
</div>

<div class="card section">
<h4>Contributions</h4>
<input id="contrib" placeholder="Annual Contribution">
</div>

<div class="card section">
<h4>Expenses</h4>
<input id="exp" placeholder="Annual Expenses">
</div>

<div class="card section">
<h4>Tax Profile</h4>
<input id="taxRate" placeholder="Effective Tax Rate (0.22)">
</div>

</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="card">
<button onclick="applyScenario('crash')">Market Crash</button>
<button onclick="applyScenario('inflation')">High Inflation</button>
<button onclick="applyScenario('jobloss')">Job Loss</button>

<input id="returnRate" placeholder="Return % (default 6)">
<input id="inflation" placeholder="Inflation % (default 2.5)">
</div>
</div>

</div>

<div class="ai">
<h4>AI Advisor</h4>
<div id="ai"></div>
</div>

</div>

<script>

let chart;

/* NAV */
function showView(id,el){
["dashboard","financials","scenarios"].forEach(v=>document.getElementById(v).style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

/* RANDOM RETURN */
function randReturn(mean,std){
let u=Math.random(),v=Math.random();
let z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
return mean + z*std;
}

/* SIMULATION */
function simulate(){

let runs=100;
let results=[];
let lastPath=[];

for(let r=0;r<runs;r++){

let bal=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);
let ageVal=(+age.value||40);
let ret=(+retAge.value||65);
let income=(+incomeInput.value||0);
let contribVal=(+contrib.value||0);
let expVal=(+exp.value||0);
let depC=(+depCost.value||0);
let depY=(+depYears.value||0);
let tax=(+taxRate.value||0.22);
let inf=(+inflation.value||2.5)/100;
let baseReturn=(+returnRate.value||6)/100;

let path=[];

for(let y=0;y<50;y++){

let ror=randReturn(baseReturn,0.12);

// income stops at retirement
let inc = (ageVal+y < ret) ? income : 0;
inc = inc*(1-tax);

// dependents
let dep = y < depY ? depC*Math.pow(1+inf,y) : 0;

// expenses
let expenses = expVal*Math.pow(1+inf,y);

// contributions stop at retirement
let contrib = (ageVal+y < ret) ? contribVal : 0;

bal += bal*ror + inc - expenses - dep + contrib;

path.push(bal);

if(bal<=0) break;
}

results.push(path.length);
if(r===0) lastPath=path;
}

/* METRICS */
let success = results.filter(x=>x>=30).length / runs;
let median = results.sort()[Math.floor(results.length/2)];

return {success,median,lastPath};
}

/* UPDATE */
function update(){

let sim = simulate();

let total=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);
let incomeVal=(+incomeInput.value||0);
let expVal=(+exp.value||0);

netWorth.innerText="$"+total.toLocaleString();
income.innerText="$"+incomeVal.toLocaleString();
expensesOut.innerText="$"+expVal.toLocaleString();

successRate.innerText=(sim.success*100).toFixed(0)+"%";
years.innerText=sim.median;

failAge.innerText=(+age.value||40)+sim.median;

let decision="SAFE";
if(sim.success<0.8) decision="RISK";
if(sim.success<0.6) decision="FAIL";

decisionEl.innerText=decision;

/* AI */
let aiText=[];
if(decision==="FAIL") aiText.push("🚨 Plan fails in most scenarios.");
if(decision==="RISK") aiText.push("⚠️ Plan is sensitive.");
if(decision==="SAFE") aiText.push("✅ Plan is stable.");

if(sim.success<0.8) aiText.push("Increase savings or delay retirement.");
if((+contrib.value||0)<5000) aiText.push("Low contributions limiting growth.");

ai.innerHTML=aiText.join("<br><br>");

summary.innerHTML=`
<b>Success:</b> ${(sim.success*100).toFixed(1)}%<br>
<b>Median Years:</b> ${sim.median}
`;

/* CHART */
if(chart) chart.destroy();
chart=new Chart(chart,{
type:'line',
data:{
labels:sim.lastPath.map((_,i)=>i),
datasets:[{data:sim.lastPath}]
}
});
}

/* SCENARIOS */
function applyScenario(type){
if(type==="crash") returnRate.value=2;
if(type==="inflation") inflation.value=5;
if(type==="jobloss") incomeInput.value=0;
update();
}

/* INIT */
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",update));
window.onload=update;

</script>

</body>
</html>
