<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

  <div class="card">
<h4>Projection</h4>
<div id="projectionOutput"></div>
</div>

<div class="card">
<h4>Monte Carlo</h4>
<div id="monteCarloOutput"></div>
</div>

<div class="card">
<h4>Scenarios</h4>
<label><input type="checkbox" id="jobLoss"> Job Loss</label><br>
<label><input type="checkbox" id="marketCrash"> Market Crash</label><br>
<label><input type="checkbox" id="expenseSpike"> Expense Spike</label>
</div>

<div id="financials" style="display:none">

<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Dependents</h4>
<div class="label">Number of Dependents</div>
<input id="dependents" type="number" onblur="state.dependents=+this.value||0;updateAll()">
</div>

<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance" onblur="state.accounts=+this.value||0;updateAll()">
</div>

<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash" onblur="updateAll()">
<input id="invest" placeholder="Investments" onblur="updateAll()">
<input id="debt" placeholder="Debt" onblur="updateAll()">
</div>

<div class="card">
<button onclick="saveProfile()">Save Profile</button>
<button onclick="loadProfile()">Load Profile</button>
</div>

</div>

</div>

</div>

<div class="side">

<div class="card">
<h4>Status</h4>
<div id="status"></div>
</div>

<div class="card">
<h4>Failure Point</h4>
<div id="failure"></div>
</div>

<div class="card">
<h4>Action</h4>
<div id="action"></div>
</div>

<div class="card">
<h4>AI Advisor</h4>
<div id="aiOutput">Waiting for analysis...</div>
</div>

</div>

</div>
</div>

<script>

// =========================
// GLOBAL STATE
// =========================
let state = {
  incomes: [],
  expenses: [],
  accounts: [],
  dependents: 0,
  assets: {
    cash: 0,
    invest: 0,
    debt: 0
  },
  filing: "single"
};

// =========================
// HELPERS
// =========================
function norm(a,f){
  return a*(f==="monthly"?12:f==="biweekly"?26:1);
}

// =========================
// TAX ENGINE
// =========================
function calcTax(income, filing, dependents){

  let brackets = {
    single:[[11000,0.1],[44725,0.12],[95375,0.22]],
    married_joint:[[22000,0.1],[89450,0.12],[190750,0.22]],
    head:[[15700,0.1],[59850,0.12],[95350,0.22]]
  };

  let tax=0,prev=0;

  for(let [limit,rate] of brackets[filing]){
    if(income>limit){
      tax+=(limit-prev)*rate;
      prev=limit;
    } else {
      tax+=(income-prev)*rate;
      break;
    }
  }

  tax -= dependents * 2000;

  return Math.max(tax,0);
}

// =========================
// CORE CALC
// =========================
function calculate(){

  let income = state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);

  let expenses = state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);

  let tax = calcTax(income, state.filing, state.dependents);

  let net = income - expenses - tax;

  let accountValue = state.accounts.reduce((s,a)=>s+(a.balance||0),0);

  let netWorth =
    accountValue +
    state.assets.cash +
    state.assets.invest -
    state.assets.debt;

  let savingsRate = income > 0 ? ((income - expenses) / income) * 100 : 0;

  return {
    income,
    expenses,
    tax,
    net,
    netWorth,
    savingsRate
  };
}

// =========================
// UPDATE UI
// =========================
function updateAll(){

  let d = calculate();

  // DASHBOARD (FIXED IDS)
  document.getElementById("income").innerText = "$"+Math.round(d.income);
  document.getElementById("expensesOut").innerText = "$"+Math.round(d.expenses);
  document.getElementById("netWorth").innerText = "$"+Math.round(d.netWorth);
  document.getElementById("savingsRate").innerText = d.savingsRate.toFixed(1)+"%";

  // SIDE PANEL (FIXED IDS)
  document.getElementById("status").innerText =
    d.net > 0 ? "Positive cash flow" : "Negative cash flow";

  document.getElementById("failure").innerText =
    d.net < 0 ? "Failure: losing money" : "Stable";

  document.getElementById("action").innerText =
    d.savingsRate < 10 ? "Increase savings" : "Maintain";

  runAI(d);
}

// =========================
// RENDER INCOME
// =========================
function renderIncome(){

  let el = document.getElementById("incomeList");

  el.innerHTML = state.incomes.map((i,idx)=>`
    <input value="${i.amount}" 
      onblur="state.incomes[${idx}].amount=+this.value||0;updateAll()">
  `).join("");
}

function addIncome(){
  state.incomes.push({amount:0,freq:"yearly"});
  renderIncome();
}

// =========================
// RENDER EXPENSES
// =========================
function renderExpenses(){

  let el = document.getElementById("expenseList");

  el.innerHTML = state.expenses.map((e,idx)=>`
    <input value="${e.amount}" 
      onblur="state.expenses[${idx}].amount=+this.value||0;updateAll()">
  `).join("");
}

function addExpense(){
  state.expenses.push({amount:0,freq:"yearly"});
  renderExpenses();
}

// =========================
// DEPENDENTS
// =========================
document.getElementById("dependents").addEventListener("input", function(){
  state.dependents = +this.value || 0;
  updateAll();
});

// =========================
// ACCOUNTS (FIXED SIMPLE)
// =========================
document.getElementById("accBalance").addEventListener("input", function(){

  state.accounts = [{
    type:"generic",
    balance:+this.value||0
  }];

  updateAll();
});

// =========================
// ASSETS
// =========================
function updateAssets(){

  state.assets.cash = +document.getElementById("cash").value || 0;
  state.assets.invest = +document.getElementById("invest").value || 0;
  state.assets.debt = +document.getElementById("debt").value || 0;

  updateAll();
}

// hook asset inputs
["cash","invest","debt"].forEach(id=>{
  document.getElementById(id).addEventListener("input",updateAssets);
});

// =========================
// AI
// =========================
function runAI(d){

  let msg = "";

  if(d.net < 0){
    msg = "You are spending more than you earn.";
  }
  else if(d.savingsRate < 10){
    msg = "Increase savings rate.";
  }
  else{
    msg = "Financial position stable.";
  }

  document.getElementById("aiOutput").innerText = msg;
}

// =========================
// NAV
// =========================
function showView(view, el){

  document.getElementById("dashboard").style.display="none";
  document.getElementById("financials").style.display="none";

  document.getElementById(view).style.display="block";

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  el.classList.add("active");
}

// =========================
// INIT
// =========================
window.onload = () => {

  renderIncome();
  renderExpenses();
  updateAll();

};

  // =========================
// ADVANCED ACCOUNTS (SAFE EXTENSION)
// =========================
if(!state.accounts || typeof state.accounts !== "object"){
  state.accounts = [];
}

function addAdvancedAccount(){

  state.accounts.push({
    type:"401k",
    balance:0,
    contrib:0,
    match:0
  });

  updateAll();
}

// =========================
// SCENARIO ENGINE
// =========================
function applyScenarios(base){

  let adjusted = {...base};

  if(document.getElementById("jobLoss")?.checked){
    adjusted.income *= 0.5;
  }

  if(document.getElementById("expenseSpike")?.checked){
    adjusted.expenses *= 1.25;
  }

  if(document.getElementById("marketCrash")?.checked){
    adjusted.netWorth *= 0.75;
  }

  return adjusted;
}

// =========================
// MONTE CARLO
// =========================
function runMonteCarlo(data){

  let simulations = 200;
  let success = 0;

  for(let i=0;i<simulations;i++){

    let nw = data.netWorth;
    let yearly = data.income - data.expenses;

    for(let y=0;y<30;y++){

      let returnRate = (Math.random()*0.12) - 0.02; // -2% to +10%
      nw = nw * (1 + returnRate) + yearly;

      if(nw <= 0) break;
    }

    if(nw > 0) success++;
  }

  return (success / simulations) * 100;
}

// =========================
// RETIREMENT PROJECTION
// =========================
function calcRetirement(data){

  let target = data.expenses * 25;
  let nw = data.netWorth;
  let yearly = data.income - data.expenses;

  let years = 0;

  while(nw < target && years < 50){
    nw = nw * 1.06 + yearly;
    years++;
  }

  return years;
}

// =========================
// OVERRIDE UPDATE (EXTEND ONLY)
// =========================
const originalUpdate = updateAll;

updateAll = function(){

  originalUpdate();

  let base = calculate();
  let data = applyScenarios(base);

  // MONTE CARLO
  let mc = runMonteCarlo(data);
  document.getElementById("monteCarloOutput").innerText =
    mc.toFixed(1) + "% success rate";

  // PROJECTION
  let years = calcRetirement(data);

  document.getElementById("projectionOutput").innerText =
    years < 50
    ? "Retirement in ~" + years + " yrs"
    : "Not on track";

  // AI UPGRADE
  let msg = "";

  if(mc < 50){
    msg = "High risk: plan likely to fail. Reduce expenses or increase savings.";
  }
  else if(mc < 75){
    msg = "Moderate risk: tighten plan or boost contributions.";
  }
  else{
    msg = "Strong plan: high probability of success.";
  }

  document.getElementById("aiOutput").innerText = msg;
};

// =========================
// SCENARIO HOOKS
// =========================
["jobLoss","marketCrash","expenseSpike"].forEach(id=>{
  let el = document.getElementById(id);
  if(el){
    el.addEventListener("change", updateAll);
  }
});

</script>

</script>
</body>
</html>
