<!DOCTYPE html>
<html>
<head>
  <title>Retirement Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
      margin:0;
    }
    .container {
      padding:20px;
      max-width:800px;
      margin:auto;
    }
    h2 {
      margin-bottom:15px;
    }
    .tabs {
      display:flex;
      gap:10px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }
    .tab {
      padding:10px 15px;
      background:#1e293b;
      cursor:pointer;
      border-radius:8px;
    }
    .tab.active {
      background:#3b82f6;
    }
    .panel {
      display:none;
    }
    .panel.active {
      display:block;
    }
    .card {
      background:#1e293b;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }
    input, textarea {
      width:100%;
      padding:8px;
      margin-top:5px;
      border-radius:6px;
      border:none;
    }
    button {
      padding:10px;
      margin-top:10px;
      background:#3b82f6;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
    .result {
      margin-top:10px;
      font-size:16px;
    }
  </style>
</head>

<body>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
  authDomain: "retirement-dashboard-4c0d3.firebaseapp.com",
  projectId: "retirement-dashboard-4c0d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* SAVE */
function saveData(){
  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let surplus = i - e;
  let years = s / (e * 12);
  let score = Math.min(100, Math.max(0, (s / (e * 12 * 25)) * 100));

  document.getElementById("netWorth").innerText = `$${s.toLocaleString()}`;
  document.getElementById("surplus").innerText = `$${surplus}`;
  document.getElementById("years").innerText = `${Math.round(years)} yrs`;
  document.getElementById("score").innerText = `${Math.round(score)}/100`;

  db.collection("profiles").doc("main").set({
    savings: s,
    income: i,
    expenses: e
  });
}

/* LOAD */
window.onload = async () => {
  let doc = await db.collection("profiles").doc("main").get();

  if(doc.exists){
    let d = doc.data();

    savings.value = d.savings || "";
    income.value = d.income || "";
    expenses.value = d.expenses || "";

    saveData(); // auto update UI
  }
};

/* SCENARIO */
function runScenario(){
  let savings = +document.getElementById("scSavings").value;
  let spend = +document.getElementById("scSpend").value * 12;

  let years = savings / spend;

  let status = years > 25 ? "🟢 Strong" :
               years > 15 ? "🟡 Moderate" : "🔴 Risk";

  document.getElementById("scenarioResult").innerText =
    `Lasts ~ ${Math.round(years)} years (${status})`;
}
</script>

</body>
</html>
