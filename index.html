<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',system-ui;
  background:#0B1220;
  color:#E5E7EB;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  text-align:center;
  max-width:520px;
  padding:20px;
}

.logo{
  font-size:34px;
  font-weight:600;
  letter-spacing:.5px;
  margin-bottom:10px;
}

.logo span{
  color:#3B82F6;
}

.tagline{
  font-size:16px;
  opacity:.75;
  margin-bottom:30px;
}

h1{
  font-size:42px;
  margin-bottom:10px;
}

p{
  opacity:.7;
  margin-bottom:25px;
}

.input-group{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

input{
  padding:12px;
  border-radius:8px;
  border:none;
  width:260px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:8px;
  background:#3B82F6;
  color:white;
  font-weight:500;
  cursor:pointer;
}

button:hover{
  background:#2563EB;
}

.footer{
  margin-top:25px;
  font-size:12px;
  opacity:.4;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
    <img src="./logo.png" alt="Bastion Insights Logo" style="width:120px; margin-bottom:10px;" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
    <div id="logo-fallback" style="display:none; font-size:28px; font-weight:600;">
      <span style="color:#3B82F6;">B</span>astion Insights
    </div>
  </div>

  <h1>Coming Soon</h1>

  <div class="tagline">
    Financial clarity. Advisor-level insight. Without the noise.
  </div>

  <p>
    Build, test, and understand your financial future with confidence.
  </p>

    <div style="margin-top:20px; opacity:.6;">
    Early access opening soon
  </div>

  <div class="footer">
    Launching soon • Bastion Insights
  </div>

</div>

</body>
</html>
