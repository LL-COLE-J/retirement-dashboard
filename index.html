<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================
   BASE
========================= */
body{
body{
margin:0;
background:#F6F8FB;
color:#111827;
font-family:Inter,system-ui;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#FFFFFF;
border-right:1px solid #E6EAF0;
padding:20px;
}

.logo{
font-size:18px;
font-weight:600;
margin-bottom:24px;
}

.nav-item{
padding:10px 12px;
border-radius:8px;
cursor:pointer;
color:#6B7280;
}

.nav-item:hover{
background:#F3F4F6;
color:#111827;
}

/* MAIN */
.main{
flex:1;
padding:28px;
max-width:1300px;
margin:auto;
}

/* KPIs */
.metrics{
display:flex;
gap:12px;
margin-bottom:20px;
}

.metric{
flex:1;
background:#fff;
padding:14px;
border-radius:14px;
border:1px solid #E6EAF0;
box-shadow:0 6px 20px rgba(0,0,0,0.04);
}

.metric-label{
font-size:12px;
color:#6B7280;
}

.metric-value{
font-size:20px;
font-weight:600;
margin-top:6px;
}

/* MAIN GRID */
.main-grid{
display:grid;
grid-template-columns: 2fr 1fr;
gap:20px;
margin-bottom:20px;
}

/* CHART */
.chart-card{
background:#fff;
padding:20px;
border-radius:18px;
border:1px solid #E6EAF0;
box-shadow:0 8px 24px rgba(0,0,0,0.05);
}

/* RIGHT PANEL */
.side-panel{
display:flex;
flex-direction:column;
gap:14px;
}

.panel-card{
background:#fff;
padding:16px;
border-radius:14px;
border:1px solid #E6EAF0;
}

/* MODULES */
.modules{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.module{
background:#fff;
padding:16px;
border-radius:14px;
border:1px solid #E6EAF0;
cursor:pointer;
transition:all .15s ease;
}

.module:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* FORM */
.card{
background:#fff;
padding:18px;
border-radius:14px;
border:1px solid #E6EAF0;
margin-bottom:16px;
}

.row{
display:grid;
grid-template-columns:1fr 140px 160px;
gap:10px;
margin-bottom:10px;
}

input,select{
padding:10px;
border:1px solid #E6EAF0;
border-radius:8px;
background:white;
}

button{
margin-top:10px;
padding:10px 14px;
background:#5B8DEF;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="metrics">
<div class="metric"><div class="metric-label">Net Worth</div><div id="nw" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Income</div><div id="inc" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Expenses</div><div id="expOut" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Savings Rate</div><div id="saveRate" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Success</div><div id="succ" class="metric-value"></div></div>
</div>

<div class="chart-card">
<canvas id="chart"></canvas>
</div>

<div class="modules">
<div class="module" onclick="openModule('Chance of Success')">Chance of Success</div>
<div class="module" onclick="openModule('Cash Flow')">Cash Flow</div>
<div class="module" onclick="openModule('Spending Breakdown')">Spending Breakdown</div>
<div class="module" onclick="openModule('Milestones')">Milestones</div>
<div class="module" onclick="openModule('Tax Analytics')">Tax Analytics</div>
<div class="module">Scenario Compare</div>
</div>

<div class="card">
<h3>AI Insights</h3>
<div id="milestonesOut"></div>
</div>

<div class="card">
<h3>Top Spending</h3>
<div id="categoryOut"></div>
</div>

<div class="card">
<h3>Tax</h3>
<div id="taxExplain"></div>
</div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h3>Income</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Add Income</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Add Expense</button>
</div>

<div class="card">
<h3>Events</h3>
<div id="eventList"></div>
<button onclick="addEvent()">+ Add Event</button>
</div>

<div class="card">
<h3>Assets & Debt</h3>
<div class="row">
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>
</div>

<div class="card">
<h3>Tax Profile</h3>
<select id="filing">
<option value="single">Single</option>
<option value="married_joint">Married Filing Jointly</option>
<option value="head">Head of Household</option>
</select>
</div>

</div>

</div>

<script src="modules.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>

</body>
</html>
