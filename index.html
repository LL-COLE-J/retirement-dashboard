<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{
--bg:#0B0F1A;--sidebar:#0F172A;--card:#111827;
--card-light:#1F2937;--text:#E5E7EB;
--sub:#9CA3AF;--border:rgba(255,255,255,0.05);
--grad:linear-gradient(135deg,#3B82F6,#6366F1);
}
body{background:var(--bg);color:var(--text);display:flex;height:100vh;}
.sidebar{width:220px;background:var(--sidebar);padding:20px;}
.logo{margin-bottom:20px;font-weight:600;}
.nav-item{margin:8px 0;cursor:pointer;color:var(--sub);}
.main{flex:1;display:flex;flex-direction:column;}
.topbar{padding:20px;border-bottom:1px solid var(--border);}
.content{padding:20px;overflow:auto;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}
.card{background:var(--card);padding:15px;border-radius:12px;}
input{width:100%;padding:8px;margin-top:6px;background:var(--card-light);border:none;color:white;}
button{margin-top:10px;padding:8px;border:none;background:var(--grad);color:white;border-radius:8px;cursor:pointer;}
.section{margin-top:20px;}
.kpi{font-size:22px;margin-top:5px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item">Dashboard</div>
<div class="nav-item">Scenarios</div>
<div class="nav-item">Advisor</div>
</div>

<div class="main">
<div class="topbar">Retirement Overview</div>

<div class="content">

<div class="grid">
<div class="card">Net Worth<div id="netWorth" class="kpi">$0</div></div>
<div class="card">Surplus<div id="surplus" class="kpi">$0</div></div>
<div class="card">Years<div id="years" class="kpi">--</div></div>
<div class="card">Score<div id="score" class="kpi">--</div><div id="scoreHint"></div></div>
</div>

<div class="section card">
<h3>Projection</h3>
<canvas id="projectionChart"></canvas>
</div>

<div class="section card">
<h3>Cashflow</h3>
<canvas id="cashflowChart"></canvas>
</div>

<div class="section card">
<h3>Financial Snapshot</h3>

<input id="cash" placeholder="Cash">
<input id="investments" placeholder="Investments">
<input id="retirement" placeholder="401k">

<input id="income" placeholder="Income">
<input id="ssEstimate" placeholder="SSI">
<input id="expenses" placeholder="Expenses">

<select id="maritalStatus">
<option value="single">Single</option>
<option value="married">Married</option>
</select>

<input id="income2" placeholder="Spouse Income">
<input id="insurancePayout" placeholder="Insurance Payout">
<input id="insuranceIncome" placeholder="Insurance Income">

<button onclick="saveData()">Update</button>
</div>

<div class="section card">
<h3>AI Insights</h3>
<button onclick="runAI()">Analyze Plan</button>
<div id="aiOutput"></div>
</div>

</div>
</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
authDomain:"retirement-dashboard-4c0d3.firebaseapp.com",
projectId:"retirement-dashboard-4c0d3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let projectionChart,cashflowChart;

/* ENGINE */
function buildModel(inputs){

let{liquidAssets,income,income2=0,expenses,maritalStatus,insurancePayout,insuranceIncome,assumptions}=inputs;

let balance=liquidAssets;
let timeline=[];
let combined=income+(maritalStatus==="married"?income2:0);

for(let y=0;y<assumptions.years;y++){

let yearly=combined*12;

if(maritalStatus==="married"&&y>20){
yearly=Math.max(income,income2)*12;
if(y===21) balance+=insurancePayout;
yearly+=insuranceIncome*12;
}

let exp=expenses*12*Math.pow(1+assumptions.inflation,y);
let growth=balance*assumptions.returnRate;

balance+=growth+yearly-exp;

timeline.push({y,balance,income:yearly,expenses:exp});
if(balance<=0) break;
}

return{success:balance>0,years:timeline.length,ending:balance,timeline};
}

/* SAVE */
function saveData(){

let cash=+cashEl.value||0;
let inv=+investments.value||0;
let ret=+retirement.value||0;
let total=cash+inv+ret;

let inc=+income.value||0;
let ss=+ssEstimate.value||inc*0.4;
let exp=+expenses.value||0;

let model=buildModel({
liquidAssets:total,
income:ss,
income2:+income2.value||0,
expenses:exp,
maritalStatus:maritalStatus.value,
insurancePayout:+insurancePayout.value||0,
insuranceIncome:+insuranceIncome.value||0,
assumptions:{years:40,returnRate:0.05,inflation:0.025}
});

netWorth.innerText="$"+total.toLocaleString();
surplus.innerText="$"+(inc-exp);
years.innerText=model.years;
score.innerText=model.success?"80":"40";
scoreHint.innerText=model.success?"Stable":"Risk";

renderCharts(model);

db.collection("profiles").doc("main").set({cash,inv,ret,inc,ss,exp});
}

/* CHARTS */
function renderCharts(m){

let yrs=m.timeline.map(t=>t.y);
let bal=m.timeline.map(t=>t.balance);
let inc=m.timeline.map(t=>t.income);
let exp=m.timeline.map(t=>t.expenses);

if(projectionChart)projectionChart.destroy();
projectionChart=new Chart(projectionChartCanvas,{
type:"line",
data:{labels:yrs,datasets:[{data:bal,borderColor:"#3B82F6"}]}
});

if(cashflowChart)cashflowChart.destroy();
cashflowChart=new Chart(cashflowChartCanvas,{
type:"line",
data:{labels:yrs,datasets:[
{data:inc,borderColor:"#22C55E"},
{data:exp,borderColor:"#EF4444"}
]}
});
}

/* AI (LOCAL V1) */
function runAI(){

let yrs=years.innerText;
let sc=score.innerText;

let insights=[];

if(sc<50) insights.push("Plan likely fails. Spending too high.");
else insights.push("Plan currently sustainable.");

insights.push("Covers "+yrs+" years.");

if(+surplus.innerText.replace("$","")<0)
insights.push("Negative cashflow risk.");

aiOutput.innerHTML=insights.join("<br><br>");
}

</script>

</body>
</html>
