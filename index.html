<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastion Insights | Pro Planning Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a; --sidebar: #1e293b; --card: #1e293b;
            --text: #f8fafc; --accent: #38bdf8; --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--sidebar); padding: 32px 24px; border-right: 1px solid var(--border); }
        .logo { font-weight: 800; font-size: 22px; color: var(--accent); margin-bottom: 40px; border-bottom: 2px solid var(--accent); display: inline-block; }
        .nav-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
        .nav-item.active { background: var(--accent); color: var(--bg); }

        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: 1fr 320px; gap: 32px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: white; margin-top: 8px; }
        label { font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
        
        .big-price { font-size: 36px; font-weight: 800; color: var(--accent); margin: 16px 0; }
        button { width: 100%; padding: 14px; background: var(--accent); color: var(--bg); border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .insight-box { background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--accent); padding: 16px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">BASTION</div>
    <div class="nav-item active" onclick="tab('dashboard')">Dashboard</div>
    <div class="nav-item" onclick="tab('financials')">Financials</div>
    <div class="nav-item" onclick="tab('markets')">Markets</div>
</div>

<div class="main">
    <div class="grid">
        <div class="content">
            <div id="dashboard-page">
                <div class="card">
                    <h3>20-Year Wealth Projection</h3>
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
            <div id="financials-page" style="display:none">
                <div class="card">
                    <h3>Income & Tax Profile</h3>
                    <label>Gross Annual Income</label>
                    <input type="number" id="income-in" value="120000" oninput="update()">
                    <label style="margin-top:20px; display:block">Filing Status</label>
                    <select id="filing-in" onchange="update()">
                        <option value="single">Single</option>
                        <option value="married">Married Filing Jointly</option>
                    </select>
                </div>
            </div>
            <div id="markets-page" style="display:none">
                <div class="card">
                    <h3>Live Pulse</h3>
                    <input type="text" id="ticker-in" value="bitcoin" placeholder="e.g. bitcoin">
                    <button onclick="refresh()">Update Price</button>
                    <div id="price-out" class="big-price">--</div>
                </div>
            </div>
        </div>

        <div class="advisor">
            <h3>Advisor Lab</h3>
            <div class="card">
                <label>Tax Estimate (2026)</label>
                <div id="tax-out" class="big-price">$0</div>
                <div class="insight-box" id="insight-out">
                    Ready to analyze...
                </div>
            </div>
        </div>
    </div>
</div>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
