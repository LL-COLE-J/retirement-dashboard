<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================
   BASE
========================= */
body{
margin:0;
background:#F8FAFC;
color:#111827;
font-family:Inter,system-ui;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#FFFFFF;
border-right:1px solid #E5E7EB;
padding:20px;
}

.logo{
font-size:18px;
font-weight:600;
margin-bottom:24px;
}

.nav-item{
padding:10px 12px;
border-radius:8px;
cursor:pointer;
color:#6B7280;
}

.nav-item:hover{
background:#F3F4F6;
color:#111827;
}

/* MAIN */
.main{
flex:1;
padding:28px;
max-width:1200px;
margin:auto;
}

/* METRICS */
.metrics{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-bottom:20px;
}

.metric{
background:#FFFFFF;
padding:16px;
border-radius:12px;
border:1px solid #E5E7EB;
}

.metric-label{
font-size:12px;
color:#6B7280;
}

.metric-value{
font-size:20px;
margin-top:6px;
font-weight:600;
}

/* CARDS */
.card{
background:#FFFFFF;
padding:18px;
border-radius:12px;
border:1px solid #E5E7EB;
margin-bottom:16px;
}

/* CHART */
.chart-card{
background:#FFFFFF;
padding:18px;
border-radius:12px;
border:1px solid #E5E7EB;
margin-bottom:20px;
}

/* MODULES */
.modules{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.module{
background:#FFFFFF;
padding:14px;
border-radius:12px;
border:1px solid #E5E7EB;
cursor:pointer;
}

.module:hover{
background:#F9FAFB;
}

/* INPUT ROW */
.row{
display:grid;
grid-template-columns:1fr 140px 160px;
gap:10px;
margin-bottom:10px;
}

input,select{
padding:10px;
border:1px solid #E5E7EB;
border-radius:8px;
background:white;
}

input:focus,select:focus{
outline:none;
border-color:#2563EB;
}

/* BUTTON */
button{
margin-top:10px;
padding:10px 14px;
background:#2563EB;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1D4ED8;
}

</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="metrics">
<div class="metric"><div class="metric-label">Net Worth</div><div id="nw" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Income</div><div id="inc" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Expenses</div><div id="expOut" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Savings Rate</div><div id="saveRate" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Success</div><div id="succ" class="metric-value"></div></div>
</div>

<div class="chart-card">
<canvas id="chart"></canvas>
</div>

<div class="modules">
<div class="module" onclick="openModule('Chance of Success')">Chance of Success</div>
<div class="module" onclick="openModule('Cash Flow')">Cash Flow</div>
<div class="module" onclick="openModule('Spending Breakdown')">Spending Breakdown</div>
<div class="module" onclick="openModule('Milestones')">Milestones</div>
<div class="module" onclick="openModule('Tax Analytics')">Tax Analytics</div>
<div class="module">Scenario Compare</div>
</div>

<div class="card">
<h3>AI Insights</h3>
<div id="milestonesOut"></div>
</div>

<div class="card">
<h3>Top Spending</h3>
<div id="categoryOut"></div>
</div>

<div class="card">
<h3>Tax</h3>
<div id="taxExplain"></div>
</div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h3>Income</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Add Income</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Add Expense</button>
</div>

<div class="card">
<h3>Events</h3>
<div id="eventList"></div>
<button onclick="addEvent()">+ Add Event</button>
</div>

<div class="card">
<h3>Assets & Debt</h3>
<div class="row">
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>
</div>

<div class="card">
<h3>Tax Profile</h3>
<select id="filing">
<option value="single">Single</option>
<option value="married_joint">Married Filing Jointly</option>
<option value="head">Head of Household</option>
</select>
</div>

</div>

</div>

<script src="modules.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>

</body>
</html>
