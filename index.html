<!DOCTYPE html>
<html>
<head>
  <title>Avora - Retirement Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial;
      background:#0f172a;
      color:#e5e7eb;
      display:flex;
    }

    /* SIDEBAR */
    .sidebar {
      width:220px;
      background:#020617;
      height:100vh;
      padding:20px;
    }

    .sidebar h2 {
      color:#60a5fa;
    }

    .nav-item {
      margin:12px 0;
      cursor:pointer;
      opacity:.8;
    }

    .nav-item:hover {
      opacity:1;
      color:#60a5fa;
    }

    /* MAIN */
    .main {
      flex:1;
      padding:20px;
    }

    .header {
      font-size:20px;
      margin-bottom:20px;
    }

    .row {
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .card {
      background:#1e293b;
      padding:16px;
      border-radius:12px;
      flex:1;
      min-width:200px;
    }

    .stat {
      font-size:22px;
      margin-top:5px;
    }

    input, textarea {
      width:100%;
      padding:8px;
      margin-top:5px;
      border-radius:6px;
      border:none;
      background:#0f172a;
      color:white;
    }

    button {
      padding:10px;
      margin-top:10px;
      background:#3b82f6;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .success { color:#22c55e; }
    .danger { color:#ef4444; }
    .warn { color:#eab308; }

  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>AVORA</h2>

  <div class="nav-item">Dashboard</div>
  <div class="nav-item">Scenarios</div>
  <div class="nav-item">Advisor</div>
  <div class="nav-item">AI Insights</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">Retirement Control Panel</div>

  <!-- KPI -->
  <div class="row">

    <div class="card">
      Net Worth
      <div id="netWorth" class="stat">$0</div>
    </div>

    <div class="card">
      Monthly Surplus
      <div id="surplus" class="stat">$0</div>
    </div>

    <div class="card">
      Years Covered
      <div id="years" class="stat">--</div>
    </div>

    <div class="card">
      Retirement Score
      <div id="score" class="stat">--</div>
      <div id="scoreHint"></div>

      <div style="margin-top:10px; height:6px; background:#111;">
        <div id="scoreBar" style="height:6px; width:0%;"></div>
      </div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="card">
    <h3>Financial Snapshot</h3>

    <input id="savings" placeholder="Total Savings">
    <input id="income" placeholder="Monthly Income">
    <input id="expenses" placeholder="Monthly Expenses">

    <button onclick="saveData()">Save</button>
  </div>

  <!-- SCENARIO -->
  <div class="card">
    <h3>Scenario</h3>

    <input id="scSavings" placeholder="Savings">
    <input id="scSpend" placeholder="Monthly Spend">

    <button onclick="runScenario()">Run</button>

    <div id="scenarioResult"></div>
  </div>

  <!-- ADVISOR -->
  <div class="card">
    <h3>Advisor Review</h3>

    <textarea id="advisorInput"></textarea>

    <button onclick="analyzeAdvisor()">Analyze</button>

    <div id="advisorOutput"></div>
  </div>

  <!-- AI INSIGHTS -->
  <div class="card">
    <h3>AI Insights</h3>

    <button onclick="generateInsights()">Analyze My Plan</button>

    <div id="aiOutput"></div>
  </div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
  authDomain: "retirement-dashboard-4c0d3.firebaseapp.com",
  projectId: "retirement-dashboard-4c0d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ENGINE */

function buildFinancialModelV2(inputs) {

  const { liquidAssets, expenses, income, assumptions } = inputs;

  let balance = liquidAssets;

  for (let year = 0; year < assumptions.years; year++) {

    const yearlyIncome = income * 12;
    const yearlyExpenses = expenses * 12 * Math.pow(1 + assumptions.inflation, year);
    const growth = balance * assumptions.returnRate;

    balance = balance + growth + yearlyIncome - yearlyExpenses;

    if (balance <= 0) {
      return {
        success: false,
        yearsCovered: year,
        endingBalance: balance
      };
    }
  }

  return {
    success: true,
    yearsCovered: assumptions.years,
    endingBalance: balance
  };
}

/* SAVE */

function saveData(){

  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let model = buildFinancialModelV2({
    liquidAssets: s,
    income: i,
    expenses: e,
    assumptions: {
      years: 40,
      returnRate: 0.05,
      inflation: 0.025
    }
  });

  let surplus = i - e;

  let score = model.success ? 80 : 40;
  let hint = model.success ? "Sustainable" : "Risk";

  document.getElementById("netWorth").innerText = `$${s.toLocaleString()}`;
  document.getElementById("surplus").innerText = `$${surplus}`;
  document.getElementById("years").innerText = `${model.yearsCovered} yrs`;
  document.getElementById("score").innerText = `${score}/100`;
  document.getElementById("scoreHint").innerText = hint;

  let bar = document.getElementById("scoreBar");
  bar.style.width = `${score}%`;
  bar.style.background = model.success ? "#22c55e" : "#ef4444";

  db.collection("profiles").doc("main").set({
    savings: s,
    income: i,
    expenses: e
  });
}

/* LOAD */

window.onload = async () => {

  let doc = await db.collection("profiles").doc("main").get();

  if(doc.exists){
    let d = doc.data();

    document.getElementById("savings").value = d.savings || "";
    document.getElementById("income").value = d.income || "";
    document.getElementById("expenses").value = d.expenses || "";

    saveData();
  }
};

/* SCENARIO */

function runScenario(){

  let savings = +document.getElementById("scSavings").value;
  let spend = +document.getElementById("scSpend").value;

  let model = buildFinancialModelV2({
    liquidAssets: savings,
    income: 0,
    expenses: spend,
    assumptions: {
      years: 40,
      returnRate: 0.05,
      inflation: 0.025
    }
  });

  document.getElementById("scenarioResult").innerHTML =
    `Lasts ${model.yearsCovered} years<br>
     Ending Balance: $${Math.round(model.endingBalance).toLocaleString()}`;
}

/* ADVISOR */

function analyzeAdvisor(){

  let text = document.getElementById("advisorInput").value.toLowerCase();

  let flags = [];

  if (text.includes("annuity")) flags.push("⚠️ Annuity detected");
  if (text.includes("guaranteed")) flags.push("⚠️ Verify guarantees");
  if (text.includes("fee")) flags.push("⚠️ Check fees");

  document.getElementById("advisorOutput").innerHTML =
    flags.length ? flags.join("<br>") : "No major flags";
}

/* AI INSIGHT (LOGIC-BASED V1) */

function generateInsights(){

  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let model = buildFinancialModelV2({
    liquidAssets: s,
    income: i,
    expenses: e,
    assumptions: {
      years: 40,
      returnRate: 0.05,
      inflation: 0.025
    }
  });

  let insights = [];

  if (!model.success) insights.push("❌ You will run out of money.");
  else insights.push("✅ Plan looks sustainable.");

  insights.push(`📊 Covers ${model.yearsCovered} years.`);

  if (i < e) insights.push("⚠️ Spending exceeds income.");

  document.getElementById("aiOutput").innerHTML =
    insights.join("<br><br>");
}

</script>

</body>
</html>
