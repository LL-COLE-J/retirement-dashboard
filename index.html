<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0B0F1A;color:white;font-family:Arial;display:flex}
.sidebar{width:200px;background:#111;padding:20px}
.nav-item{padding:10px;cursor:pointer}
.main{flex:1;padding:20px}
.card{background:#1a1a1a;padding:15px;margin-bottom:10px;border-radius:10px}
input,select{width:100%;margin-top:5px;padding:6px;background:#222;color:white;border:none}
button{margin-top:10px;padding:6px;background:#3B82F6;color:white;border:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.row{display:flex;gap:5px;margin-top:5px}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
<div class="nav-item" onclick="show('compare')">Compare</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="grid">
<div class="card">Net Worth<div id="nw"></div></div>
<div class="card">Income (After Tax)<div id="inc"></div></div>
<div class="card">Expenses<div id="expOut"></div></div>
<div class="card">Success %<div id="succ"></div></div>
</div>

<canvas id="chart"></canvas>
<div id="taxExplain"></div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h3>Income Streams</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Add Income</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Add Expense</button>
</div>

<div class="card">
<h3>Goals (One-Time)</h3>
<div id="goalList"></div>
<button onclick="addGoal()">+ Add Goal</button>
</div>

<div class="card">
<h3>Household</h3>
<input id="age" placeholder="Age">
<input id="retAge" placeholder="Retirement Age">
</div>

<div class="card">
<h3>Assets (Legacy Support)</h3>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

<div class="card">
<h3>Accounts (New)</h3>
<div id="accountsList"></div>
<button onclick="addAccount()">+ Add Account</button>
</div>

<div class="card">
<h3>Tax</h3>
<select id="filing">
<option value="single">Single</option>
<option value="married">Married</option>
</select>
</div>

</div>

<!-- COMPARE -->
<div id="compare" style="display:none">

<div class="card">
<button onclick="saveScenario()">Save Scenario</button>
<div id="scenarios"></div>
<div id="delta"></div>
</div>

</div>

</div>

<script>

/* ===== STATE ===== */
let incomes=[],expenses=[],goals=[],scenarios=[],accounts=[],chart;

/* ===== NAV ===== */
function show(v){
["dashboard","financials","compare"].forEach(x=>document.getElementById(x).style.display="none");
document.getElementById(v).style.display="block";
}

/* ===== NORMALIZE ===== */
function norm(a,f){
return a*(f==="monthly"?12:f==="biweekly"?26:1);
}

/* ===== STAGE ===== */
function stage(age){
if(age<30) return 0.1;
if(age<50) return 0.2;
if(age<65) return 0.25;
return 0;
}

/* ===== TAX ENGINE ===== */
function calcTax(income, filing){

let brackets = filing==="single"
? [[10000,0.1],[40000,0.12],[85000,0.22],[160000,0.24]]
: [[20000,0.1],[80000,0.12],[170000,0.22],[320000,0.24]];

let tax=0,prev=0;

for(let [limit,rate] of brackets){
if(income > limit){
tax += (limit-prev)*rate;
prev = limit;
}else{
tax += (income-prev)*rate;
break;
}
}
return tax;
}

/* ===== ACCOUNT SYSTEM ===== */
function addAccount(){
let id = Date.now();
accounts.push({id,type:"CHK",balance:0});
renderAccounts();
}

function renderAccounts(){
accountsList.innerHTML = accounts.map(a=>`
<div class="row">
<select onchange="updateAccountType(${a.id},this.value)">
<option>CHK</option>
<option>SAV</option>
<option>CD</option>
<option>BROKER</option>
<option>401K</option>
<option>ROTH</option>
</select>
<input placeholder="Balance" oninput="updateAccountBalance(${a.id},this.value)">
</div>
`).join("");
}

function updateAccountType(id,val){
accounts.find(x=>x.id===id).type = val;
}

function updateAccountBalance(id,val){
accounts.find(x=>x.id===id).balance = +val;
update();
}

/* ===== INCOME ===== */
function addIncome(){
let id=Date.now();
incomes.push({id,amount:0,freq:"yearly",cat:"salary"});
renderIncome();
}

function renderIncome(){
incomeList.innerHTML=incomes.map(i=>`
<div class="row">
<input placeholder="Amount" oninput="updateIncome(${i.id},this.value)">
<select onchange="updateIncomeFreq(${i.id},this.value)">
<option>yearly</option><option>monthly</option><option>biweekly</option>
</select>
<select onchange="updateIncomeCat(${i.id},this.value)">
<option>salary</option><option>bonus</option><option>side</option>
</select>
</div>`).join("");
}

/* ===== EXPENSE ===== */
function addExpense(){
let id=Date.now();
expenses.push({id,amount:0,freq:"yearly",cat:"general"});
renderExpense();
}

function renderExpense(){
expenseList.innerHTML=expenses.map(e=>`
<div class="row">
<input placeholder="Amount" oninput="updateExpense(${e.id},this.value)">
<select onchange="updateExpenseFreq(${e.id},this.value)">
<option>yearly</option><option>monthly</option><option>biweekly</option>
</select>
<select onchange="updateExpenseCat(${e.id},this.value)">
<option>housing</option><option>food</option><option>lifestyle</option>
</select>
</div>`).join("");
}

/* ===== GOALS ===== */
function addGoal(){
let id=Date.now();
goals.push({id,amount:0,year:5});
renderGoals();
}

function renderGoals(){
goalList.innerHTML=goals.map(g=>`
<div class="row">
<input placeholder="Amount" oninput="updateGoal(${g.id},this.value)">
<input placeholder="Year" oninput="updateGoalYear(${g.id},this.value)">
</div>`).join("");
}

/* ===== UPDATERS ===== */
function updateIncome(id,val){incomes.find(x=>x.id===id).amount=+val;update();}
function updateIncomeFreq(id,val){incomes.find(x=>x.id===id).freq=val;update();}
function updateIncomeCat(id,val){incomes.find(x=>x.id===id).cat=val;}

function updateExpense(id,val){expenses.find(x=>x.id===id).amount=+val;update();}
function updateExpenseFreq(id,val){expenses.find(x=>x.id===id).freq=val;update();}
function updateExpenseCat(id,val){expenses.find(x=>x.id===id).cat=val;}

function updateGoal(id,val){goals.find(x=>x.id===id).amount=+val;}
function updateGoalYear(id,val){goals.find(x=>x.id===id).year=+val;}

/* ===== SIMULATION (UNCHANGED CORE + EXTENDED SAFELY) ===== */
function simulate(){

let runs=100,results=[],path=[];

for(let r=0;r<runs;r++){

let baseBal=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);
let bal = accounts.length ? accounts.reduce((t,a)=>t+a.balance,0) : baseBal;

let incRaw=incomes.reduce((t,i)=>t+norm(i.amount,i.freq),0);
let tax=calcTax(incRaw, filing.value);
let inc=incRaw - tax;

let exp=expenses.reduce((t,e)=>t+norm(e.amount,e.freq),0);

let arr=[];

for(let y=0;y<50;y++){

let ageNow=(+age.value||40)+y;
let saveRate=stage(ageNow);

let ret=0.06 + (Math.random()-0.5)*0.2;
let contrib = inc * saveRate;

bal+=bal*ret + inc - exp + contrib;

goals.forEach(g=>{
if(g.year===y) bal-=g.amount;
});

arr.push(bal);
if(bal<=0) break;
}

results.push(arr.length);
if(r===0) path=arr;
}

let success=results.filter(x=>x>=30).length/runs;
return {success,path};
}

/* ===== UPDATE ===== */
function update(){

let sim=simulate();

let incRaw=incomes.reduce((t,i)=>t+norm(i.amount,i.freq),0);
let tax=calcTax(incRaw, filing.value);
let inc=incRaw-tax;

let exp=expenses.reduce((t,e)=>t+norm(e.amount,e.freq),0);

let nwVal = accounts.length
? accounts.reduce((t,a)=>t+a.balance,0)
: ((+cash.value||0)+(+invest.value||0)-(+debt.value||0));

nw.innerText="$"+nwVal.toLocaleString();
inc.innerText="$"+inc.toLocaleString();
expOut.innerText="$"+exp.toLocaleString();
succ.innerText=(sim.success*100).toFixed(0)+"%";

taxExplain.innerHTML=`Estimated Tax: $${tax.toLocaleString()}`;

if(chart) chart.destroy();
chart=new Chart(chart,{
type:'line',
data:{labels:sim.path.map((_,i)=>i),datasets:[{data:sim.path}]}
});
}

/* ===== SCENARIO ===== */
function saveScenario(){
let sim=simulate();
scenarios.push({success:sim.success});
renderScenarios();
}

function renderScenarios(){

scenarios.innerHTML=scenarios.map((s,i)=>`
<div>Scenario ${i+1}: ${(s.success*100).toFixed(1)}%</div>
`).join("");

if(scenarios.length>=2){
let base=scenarios[0].success;
let last=scenarios[scenarios.length-1].success;
let diff=((last-base)*100).toFixed(1);
delta.innerHTML=`Δ Change vs Base: ${diff}%`;
}
}

/* ===== INIT ===== */
addIncome();
addExpense();
addGoal();
addAccount();

document.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",update));

</script>

</body>
</html>
