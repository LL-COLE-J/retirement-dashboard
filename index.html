<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{
--bg:#0B0F1A;--sidebar:#0F172A;--card:#111827;
--card-light:#1F2937;--text:#E5E7EB;--sub:#9CA3AF;
--grad:linear-gradient(135deg,#3B82F6,#6366F1);
}
body{background:var(--bg);color:var(--text);display:flex;height:100vh;}
.sidebar{width:220px;background:var(--sidebar);padding:20px;}
.logo{margin-bottom:20px;font-weight:600;}
.nav-item{margin:8px 0;cursor:pointer;color:var(--sub);}
.nav-item.active{color:white;}
.main{flex:1;display:flex;flex-direction:column;}
.topbar{padding:20px;border-bottom:1px solid #111;}
.content{padding:20px;overflow:auto;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px;}

.card{background:var(--card);padding:15px;border-radius:12px;}
.kpi{font-size:18px;margin-top:5px;}
.section{margin-top:15px;}

.field{position:relative;margin-top:10px;}
.field input{
width:100%;padding:14px 10px 6px;
background:var(--card-light);border:none;border-radius:8px;color:white;
}
.field label{
position:absolute;top:50%;left:10px;
transform:translateY(-50%);
color:var(--sub);font-size:12px;transition:.2s;
}
.field input:focus+label,
.field input:not(:placeholder-shown)+label{
top:5px;font-size:10px;color:#3B82F6;
}

button{
margin-top:15px;padding:10px;border:none;
background:var(--grad);color:white;border-radius:8px;cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item active" onclick="showView('dashboard',event)">Dashboard</div>
<div class="nav-item" onclick="showView('inputs',event)">Financials</div>
</div>

<div class="main">
<div class="topbar">Retirement Dashboard</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboardView">

<div class="grid">
<div class="card">Net Worth<div id="netWorth" class="kpi">$0</div></div>
<div class="card">Monthly Surplus<div id="surplus" class="kpi">$0</div></div>
<div class="card">Years Covered<div id="years" class="kpi">--</div></div>
<div class="card">Score<div id="score" class="kpi">--</div></div>
</div>

<div class="chartGrid">
<div class="card">
<h4>Net Worth Over Time</h4>
<canvas id="projectionChart"></canvas>
</div>

<div class="card">
<h4>Income vs Expenses</h4>
<canvas id="cashflowChart"></canvas>
</div>

<div class="card">
<h4>Net Cashflow</h4>
<canvas id="netFlowChart"></canvas>
</div>

<div class="card">
<h4>Longevity (Years Covered)</h4>
<canvas id="riskChart"></canvas>
</div>
</div>

</div>

<!-- FINANCIALS -->
<div id="inputView" style="display:none">

<div class="card">

<h3>Person A</h3>
<div class="field"><input id="incomeA" placeholder=" "><label>Monthly Income</label></div>

<h3 class="section">Person B</h3>
<div class="field"><input id="incomeB" placeholder=" "><label>Monthly Income</label></div>

<h3 class="section">Household</h3>
<div class="field"><input id="cash" placeholder=" "><label>Cash</label></div>
<div class="field"><input id="investments" placeholder=" "><label>Investments</label></div>
<div class="field"><input id="expenses" placeholder=" "><label>Monthly Expenses</label></div>

<div class="section card" style="background:#1F2937;">
<h4>Live Summary</h4>
<div id="liveSummary"></div>
</div>

<button onclick="saveData()">Save & Update Dashboard</button>

</div>

</div>

</div>
</div>

<script>

let projectionChart,cashflowChart,netFlowChart,riskChart;

function showView(v,e){
document.getElementById("dashboardView").style.display="none";
document.getElementById("inputView").style.display="none";
document.getElementById(v+"View").style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
e.target.classList.add("active");
}

/* MODEL */
function buildModel(total,income,expenses){
let balance=total;
let t=[];
for(let y=0;y<40;y++){
let inc=income*12;
let exp=expenses*12*Math.pow(1.025,y);
balance+=balance*0.05+inc-exp;
t.push({y,balance,inc,exp});
if(balance<=0) break;
}
return t;
}

/* LIVE SUMMARY */
function updateLive(){
let incomeA=parseFloat(incomeA.value)||0;
let incomeB=parseFloat(incomeB.value)||0;
let cashVal=parseFloat(cash.value)||0;
let inv=parseFloat(investments.value)||0;
let exp=parseFloat(expenses.value)||0;

let totalIncome=incomeA+incomeB;
let totalAssets=cashVal+inv;

liveSummary.innerHTML=
"Income: $"+totalIncome.toLocaleString()+"<br>"+
"Expenses: $"+exp.toLocaleString()+"<br>"+
"Assets: $"+totalAssets.toLocaleString();
}

/* SAVE */
function saveData(){

let incomeAVal=parseFloat(document.getElementById("incomeA").value)||0;
let incomeBVal=parseFloat(document.getElementById("incomeB").value)||0;
let income=incomeAVal+incomeBVal;

let cashVal=parseFloat(document.getElementById("cash").value)||0;
let inv=parseFloat(document.getElementById("investments").value)||0;
let exp=parseFloat(document.getElementById("expenses").value)||0;

let total=cashVal+inv;

localStorage.setItem("profile",JSON.stringify({incomeAVal,incomeBVal,cashVal,inv,exp}));

let m=buildModel(total,income,exp);

/* KPI */
netWorth.innerText="$"+total.toLocaleString();
surplus.innerText="$"+(income-exp);
years.innerText=m.length;
score.innerText=m.length>30?"85":"45";

renderCharts(m);
}

/* LOAD */
(function(){
let p=JSON.parse(localStorage.getItem("profile")||"{}");
if(p){
incomeA.value=p.incomeAVal||"";
incomeB.value=p.incomeBVal||"";
cash.value=p.cashVal||"";
investments.value=p.inv||"";
expenses.value=p.exp||"";
saveData();
}
})();

/* CHARTS */
function renderCharts(m){

let yrs=m.map(x=>x.y);
let bal=m.map(x=>x.balance);
let inc=m.map(x=>x.inc);
let exp=m.map(x=>x.exp);
let net=m.map(x=>x.inc-x.exp);

if(projectionChart)projectionChart.destroy();
projectionChart=new Chart(document.getElementById("projectionChart"),{
type:"line",
data:{labels:yrs,datasets:[{label:"Net Worth",data:bal}]}
});

if(cashflowChart)cashflowChart.destroy();
cashflowChart=new Chart(document.getElementById("cashflowChart"),{
type:"line",
data:{labels:yrs,datasets:[
{label:"Income",data:inc},
{label:"Expenses",data:exp}
]}
});

if(netFlowChart)netFlowChart.destroy();
netFlowChart=new Chart(document.getElementById("netFlowChart"),{
type:"line",
data:{labels:yrs,datasets:[{label:"Net Cashflow",data:net}]}
});

if(riskChart)riskChart.destroy();
riskChart=new Chart(document.getElementById("riskChart"),{
type:"bar",
data:{labels:["Years Covered"],datasets:[{data:[m.length]}]}
});
}

/* LIVE UPDATE */
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",updateLive));

</script>

</body>
</html>
