<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bastion | Command Center v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f172a; --sidebar: #1e293b; --card: #1e293b; --text: #f8fafc; --sub: #94a3b8; --accent: #38bdf8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 280px; background: var(--sidebar); padding: 32px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo { font-weight: 800; font-size: 18px; color: var(--accent); margin-bottom: 40px; letter-spacing: 2px; }
        .nav-label { font-size: 10px; color: var(--sub); text-transform: uppercase; font-weight: 800; margin-bottom: 12px; display: block; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--sub); margin-bottom: 8px; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--accent); color: var(--bg); }

        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--sub); margin-bottom: 16px; }
        
        .grid-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--sub); text-transform: uppercase; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #0f172a; color: white; outline: none; }
        
        .stat-value { font-size: 24px; font-weight: 800; color: white; }
        .chart-box { height: 300px; }
        .compare-toggle { background: #334155; padding: 4px; border-radius: 8px; display: flex; margin-bottom: 20px; }
        .toggle-btn { flex: 1; text-align: center; padding: 8px; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 6px; }
        .toggle-btn.active { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="logo">BASTION</div>
    
    <span class="nav-label">Mode Selection</span>
    <div class="compare-toggle">
        <div class="toggle-btn active" id="btn-solo" onclick="setMode('solo')">Single Plan</div>
        <div class="toggle-btn" id="btn-compare" onclick="setMode('compare')">Comparison</div>
    </div>

    <div class="nav-item active" onclick="switchTab('lab')">Planning Lab</div>
    <div class="nav-item" onclick="switchTab('analytics')">Visual Dashboard</div>
    
    <div style="margin-top: auto;">
        <span class="nav-label">Stress Tests</span>
        <label>Market Volatility</label>
        <input type="range" id="volatility" min="0" max="25" value="0" oninput="recalc()">
    </div>
</nav>

<main class="main">
    <div id="lab-tab">
        <div class="grid-compare">
            <div class="card">
                <h3>Scenario A (Primary)</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
                    <div><label>Current Age</label><input type="number" id="age-now-a" value="35" oninput="recalc()"></div>
                    <div><label>Filing Status</label>
                        <select id="status-a" onchange="recalc()">
                            <option value="single">Single</option>
                            <option value="married">Married</option>
                        </select>
                    </div>
                </div>
                <label>Base Monthly Expense</label>
                <input type="number" id="exp-a" value="3000" oninput="recalc()">
            </div>

            <div class="card" id="card-b" style="opacity: 0.5; pointer-events: none;">
                <h3>Scenario B (Comparison)</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
                    <div><label>Current Age</label><input type="number" id="age-now-b" value="35" oninput="recalc()"></div>
                    <div><label>Filing Status</label>
                        <select id="status-b" onchange="recalc()">
                            <option value="single">Single</option>
                            <option value="married">Married</option>
                        </select>
                    </div>
                </div>
                <label>Base Monthly Expense</label>
                <input type="number" id="exp-b" value="4500" oninput="recalc()">
            </div>
        </div>

        <div class="card">
            <h3>Terminal Wealth Comparison</h3>
            <div class="grid-compare">
                <div><label>Scenario A Result</label><div class="stat-value" id="res-a">$0</div></div>
                <div><label>Scenario B Result</label><div class="stat-value" id="res-b">$0</div></div>
            </div>
        </div>
    </div>

    <div id="analytics-tab" style="display:none">
        <div class="card">
            <h3>Net Worth Comparison Trajectory</h3>
            <div class="chart-box"><canvas id="mainChart"></canvas></div>
        </div>
    </div>
</main>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
