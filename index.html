<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<div id="financials" style="display:none">
<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Dependents</h4>
<input id="dependents" type="number">
</div>

<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance">
</div>

<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

</div>
</div>

</div>

<div class="side">

<div class="card"><h4>Status</h4><div id="status"></div></div>
<div class="card"><h4>Failure</h4><div id="failure"></div></div>
<div class="card"><h4>Action</h4><div id="action"></div></div>
<div class="card"><h4>AI</h4><div id="aiOutput"></div></div>

<div class="card"><h4>Projection</h4><div id="projectionOutput"></div></div>
<div class="card"><h4>Monte Carlo</h4><div id="monteCarloOutput"></div></div>

<div class="card">
<h4>Scenarios</h4>
<label><input type="checkbox" id="jobLoss"> Job Loss</label><br>
<label><input type="checkbox" id="marketCrash"> Market Crash</label><br>
<label><input type="checkbox" id="expenseSpike"> Expense Spike</label>
</div>

</div>

</div>
</div>

<script>

// STATE
let state = {
  incomes: [],
  expenses: [],
  accounts: [],
  dependents: 0,
  assets: { cash:0, invest:0, debt:0 },
  filing: "single"
};

function norm(a,f){return a*(f==="monthly"?12:f==="biweekly"?26:1);}

// TAX
function calcTax(income, filing, dependents){
  let brackets = {
    single:[[11000,0.1],[44725,0.12],[95375,0.22]],
    married_joint:[[22000,0.1],[89450,0.12],[190750,0.22]],
    head:[[15700,0.1],[59850,0.12],[95350,0.22]]
  };
  let tax=0,prev=0;
  for(let [limit,rate] of brackets[filing]){
    if(income>limit){tax+=(limit-prev)*rate;prev=limit;}
    else{tax+=(income-prev)*rate;break;}
  }
  tax -= dependents*2000;
  return Math.max(tax,0);
}

// CORE
function calculate(){
  let income = state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
  let expenses = state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);
  let tax = calcTax(income,state.filing,state.dependents);
  let net = income-expenses-tax;
  let accountValue = state.accounts.reduce((s,a)=>s+(a.balance||0),0);

  let netWorth = accountValue + state.assets.cash + state.assets.invest - state.assets.debt;

  let savingsRate = income>0?((income-expenses)/income)*100:0;

  return {income,expenses,net,netWorth,savingsRate};
}

// SCENARIOS
function applyScenarios(d){
  let x={...d};
  if(jobLoss.checked)x.income*=0.5;
  if(expenseSpike.checked)x.expenses*=1.25;
  if(marketCrash.checked)x.netWorth*=0.75;
  return x;
}

// MONTE CARLO
function monte(d){
  let s=100,ok=0;
  for(let i=0;i<s;i++){
    let nw=d.netWorth;
    let flow=d.income-d.expenses;
    for(let y=0;y<30;y++){
      let r=(Math.random()*0.12)-0.02;
      nw=nw*(1+r)+flow;
      if(nw<=0)break;
    }
    if(nw>0)ok++;
  }
  return (ok/s)*100;
}

// PROJECTION
function proj(d){
  let target=d.expenses*25;
  let nw=d.netWorth;
  let flow=d.income-d.expenses;
  let y=0;
  while(nw<target && y<50){nw=nw*1.06+flow;y++;}
  return y;
}

// UPDATE
function updateAll(){
  let d=calculate();
  let adj=applyScenarios(d);

  netWorth.innerText="$"+Math.round(adj.netWorth);
  income.innerText="$"+Math.round(adj.income);
  expensesOut.innerText="$"+Math.round(adj.expenses);
  savingsRate.innerText=adj.savingsRate.toFixed(1)+"%";

  status.innerText=adj.net>0?"Positive":"Negative";
  failure.innerText="MC: "+monte(adj).toFixed(1)+"%";
  action.innerText=adj.savingsRate<10?"Increase savings":"Maintain";

  projectionOutput.innerText="Retire ~"+proj(adj)+" yrs";
  monteCarloOutput.innerText="Success: "+monte(adj).toFixed(1)+"%";

  aiOutput.innerText=adj.net<0?"Spending too high":
    adj.savingsRate<10?"Save more":"Solid position";
}

// RENDER
function renderIncome(){
  incomeList.innerHTML=state.incomes.map((i,idx)=>`
  <input value="${i.amount}" onblur="state.incomes[${idx}].amount=+this.value||0;updateAll()">`).join("");
}
function renderExpenses(){
  expenseList.innerHTML=state.expenses.map((e,idx)=>`
  <input value="${e.amount}" onblur="state.expenses[${idx}].amount=+this.value||0;updateAll()">`).join("");
}

function addIncome(){state.incomes.push({amount:0,freq:"yearly"});renderIncome();}
function addExpense(){state.expenses.push({amount:0,freq:"yearly"});renderExpenses();}

// INPUT HOOKS
dependents.oninput=()=>{state.dependents=+dependents.value||0;updateAll();}
accBalance.oninput=()=>{
  if(state.accounts.length===0)state.accounts.push({balance:0});
  state.accounts[0].balance=+accBalance.value||0;
  updateAll();
};
["cash","invest","debt"].forEach(id=>{
  document.getElementById(id).oninput=()=>{
    state.assets[id]=+document.getElementById(id).value||0;
    updateAll();
  };
});
["jobLoss","marketCrash","expenseSpike"].forEach(id=>{
  document.getElementById(id).onchange=updateAll;
});

// NAV
function showView(v,e){
  dashboard.style.display="none";
  financials.style.display="none";
  document.getElementById(v).style.display="block";
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  e.classList.add("active");
}

// INIT
window.onload=()=>{
  state.incomes.push({amount:80000,freq:"yearly"});
  state.expenses.push({amount:40000,freq:"yearly"});
  renderIncome();
  renderExpenses();
  updateAll();
};

</script>

</body>
</html>
