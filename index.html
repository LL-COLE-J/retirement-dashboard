<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#0B0F1A;color:#E5E7EB;display:flex;height:100vh;}
.sidebar{width:220px;background:#0F172A;padding:20px;}
.nav-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;}
.nav-item.active{background:linear-gradient(135deg,#3B82F6,#6366F1);}
.main{flex:1;display:flex;}
.content{flex:1;padding:20px;overflow:auto;}
.card{background:#111827;padding:15px;border-radius:12px;margin-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input{width:100%;padding:8px;margin-top:5px;background:#1F2937;border:none;color:white;border-radius:6px;}
button{margin-top:8px;padding:6px 10px;border:none;border-radius:6px;background:#3B82F6;color:white;cursor:pointer;}
.ai{width:260px;background:#0F172A;padding:15px;}
canvas{height:200px!important;}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card">Net Worth<div id="netWorth"></div></div>
<div class="card">Income<div id="income"></div></div>
<div class="card">Expenses<div id="expensesOut"></div></div>
<div class="card">Years Funded<div id="years"></div></div>
</div>

<div class="grid">
<div class="card">Savings Rate<div id="savingsRate"></div></div>
<div class="card">Monthly Burn<div id="burnRate"></div></div>
<div class="card">Years Safe (Static)<div id="yearsSafe"></div></div>
<div class="card">Decision<div id="decision"></div></div>
</div>

<div class="card">
<div id="retirementSummary"></div>
</div>

<div class="chartGrid">
<canvas id="c1"></canvas>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="card">

<h4>Person A</h4>
<input id="incomeA" placeholder="Income A">
<input id="ageA" placeholder="Age A">
<input id="retA" placeholder="Retirement Age A">

<h4>Person B</h4>
<input id="incomeB" placeholder="Income B">
<input id="ageB" placeholder="Age B">
<input id="retB" placeholder="Retirement Age B">

<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">

<h4>Liabilities</h4>
<input id="debt" placeholder="Total Debt">

<h4>Contributions</h4>
<input id="contribution" placeholder="Annual Investment Contribution">

<h4>Expenses</h4>
<input id="exp" placeholder="Annual Expenses">

<button onclick="saveProfile()">Save Profile</button>
<div id="profileList"></div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="card">
<h4>Quick Scenarios</h4>
<button onclick="applyScenario('crash')">Market Crash</button>
<button onclick="applyScenario('inflation')">High Inflation</button>
<button onclick="applyScenario('longevity')">Live Longer</button>

<h4>Assumptions</h4>
<input id="returnRate" placeholder="Return % (default 5)">
<input id="inflation" placeholder="Inflation % (default 2.5)">
</div>
</div>

</div>

<div class="ai">
<h4>Advisor Insight</h4>
<div id="aiOutput"></div>
</div>

</div>

<script>

let charts={};

/* NAV */
function showView(id,el){
["dashboard","financials","scenarios"].forEach(v=>document.getElementById(v).style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

/* MODEL */
function buildModel(){

let r=((+returnRate.value||5)/100)*0.8; // tax drag
let inf=((+inflation.value||2.5)/100);

let cashVal=(+cash.value||0);
let investVal=(+invest.value||0);
let debtVal=(+debt.value||0);
let contributionVal=(+contribution.value||0);

let bal = cashVal + investVal - debtVal;
let arr=[];

for(let i=0;i<50;i++){

let inc=(+incomeA.value||0)+(+incomeB.value||0);

// retirement cutoff
if(i>(+retA.value-(+ageA.value))) inc-= (+incomeA.value||0);
if(i>(+retB.value-(+ageB.value))) inc-= (+incomeB.value||0);

// contributions only before retirement
let contrib = inc > 0 ? contributionVal : 0;

// expense growth
let expenses=(+exp.value||0)*Math.pow(1+inf,i);

// simulation
bal += (bal * r) + inc - expenses + contrib;

arr.push({year:i,bal,inc,exp:expenses});

if(bal<=0) break;
}

return arr;
}

/* UPDATE */
function updateAll(){

let m=buildModel();

let incomeVal=(+incomeA.value||0)+(+incomeB.value||0);
let expVal=(+exp.value||0);
let total=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);

/* METRICS */
let savingsRate = incomeVal ? ((incomeVal-expVal)/incomeVal) : 0;
let burnRate = expVal/12;
let yearsSafe = total/(expVal||1);

/* DECISION */
let decision="SAFE";
if(m.length<30) decision="RISK";
if(m.length<20) decision="FAIL";

/* FAILURE AGE */
let failAge=(+ageA.value||65)+m.length;

/* OUTPUT */
netWorth.innerText="$"+total.toLocaleString();
income.innerText="$"+incomeVal.toLocaleString();
expensesOut.innerText="$"+expVal.toLocaleString();
years.innerText=m.length;

savingsRate.innerText=(savingsRate*100).toFixed(1)+"%";
burnRate.innerText="$"+burnRate.toFixed(0);
yearsSafe.innerText=yearsSafe.toFixed(1);
decision.innerText=decision;

/* SUMMARY */
retirementSummary.innerHTML=`
<b>Status:</b> ${decision}<br>
<b>Funds Last:</b> ${m.length} years<br>
<b>Failure Age:</b> ${failAge}
`;

/* AI INSIGHT (UPGRADED) */
let ai=[];

if(decision==="FAIL"){
ai.push("🚨 Plan fails early — assets depleted too soon.");
}else if(decision==="RISK"){
ai.push("⚠️ Plan is fragile — sensitive to assumptions.");
}else{
ai.push("✅ Plan is stable under current assumptions.");
}

if(savingsRate<0.1){
ai.push("Savings rate is below 10% — major constraint.");
}

if(m.length<25){
let needed = expVal * 25;
ai.push(`Target assets ≈ $${needed.toLocaleString()} for stability.`);
}

if(contribution.value){
let impact = (+contribution.value||0) * m.length;
ai.push(`Contributions add ~$${impact.toLocaleString()} over time.`);
}

ai.push("Action: reduce expenses, increase contributions, or delay retirement.");

aiOutput.innerHTML=ai.join("<br><br>");

renderCharts(m);
}

/* SCENARIOS */
function applyScenario(type){
if(type==="crash") returnRate.value=2;
if(type==="inflation") inflation.value=5;
if(type==="longevity") ageA.value=(+ageA.value||65)-5;
updateAll();
}

/* SAVE */
function saveProfile(){
let name=prompt("Profile name?");
if(!name)return;

let p=JSON.parse(localStorage.getItem("profiles")||"{}");
p[name]={
incomeA:incomeA.value,incomeB:incomeB.value,
ageA:ageA.value,ageB:ageB.value,
retA:retA.value,retB:retB.value,
cash:cash.value,invest:invest.value,
debt:debt.value,contribution:contribution.value,
exp:exp.value
};
localStorage.setItem("profiles",JSON.stringify(p));
renderProfiles();
}

function renderProfiles(){
let p=JSON.parse(localStorage.getItem("profiles")||"{}");
profileList.innerHTML=Object.keys(p).map(n=>`<div onclick="loadProfile('${n}')">${n}</div>`).join("");
}

function loadProfile(n){
let d=JSON.parse(localStorage.getItem("profiles"))[n];
Object.keys(d).forEach(k=>document.getElementById(k).value=d[k]);
updateAll();
}

/* CHART */
function renderCharts(m){
let labels=m.map(x=>x.year);
let bal=m.map(x=>x.bal);

Object.values(charts).forEach(c=>c.destroy());

charts.c1=new Chart(c1,{
type:'line',
data:{
labels,
datasets:[{label:"Portfolio Value",data:bal}]
}
});
}

/* INIT */
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",updateAll));
window.onload=()=>{renderProfiles();updateAll();};

</script>

</body>
</html>
