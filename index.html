<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastion Insights | Executive Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f7fa; --sidebar: #ffffff; --navy: #0a1f44; --gold: #d4af37; --border: #e2e8f0; --text: #1e293b; --sub: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; flex-direction: row; }

        /* Mobile Responsive Sidebar */
        .sidebar { width: 280px; background: var(--sidebar); padding: 30px 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: 0.3s; }
        .logo-box { margin-bottom: 40px; }
        .logo-box img { width: 100%; mix-blend-mode: multiply; }
        .nav-item { padding: 12px 16px; border-radius: 10px; cursor: pointer; color: var(--sub); margin-bottom: 4px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .nav-item.active { background: var(--navy); color: white; }

        .main-stage { flex: 1; overflow-y: auto; padding: 40px; -webkit-overflow-scrolling: touch; }
        .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }

        /* KPI & Cards */
        .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .kpi-card { grid-column: span 4; }
        .chart-area { grid-column: span 8; min-height: 400px; }
        .engine-area { grid-column: span 4; background: var(--navy); color: white; }
        
        .audit-trail { font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; color: #94a3b8; margin-top: 15px; }
        .audit-trail b { color: #38bdf8; }

        /* Drawer */
        .drawer { position: fixed; right: -100%; top: 0; width: 100%; max-width: 500px; height: 100vh; background: white; padding: 40px; transition: 0.4s; z-index: 1000; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        .drawer.open { right: 0; }
        .section-header { font-size: 11px; font-weight: 800; color: #3b82f6; text-transform: uppercase; margin: 20px 0 10px; display: block; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; margin-bottom: 12px; font-size: 14px; }
        .btn-add { color: #3b82f6; background: none; border: none; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; display: block; }

        /* Mobile Breakpoints */
        @media (max-width: 1024px) {
            .kpi-card { grid-column: span 6; }
            .chart-area, .engine-area { grid-column: span 12; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 15px; border-right: none; border-bottom: 1px solid var(--border); }
            .logo-box { margin-bottom: 10px; width: 150px; }
            .sidebar nav { display: none; } /* Simplified for mobile example */
            .main-stage { padding: 20px; }
            .kpi-card { grid-column: span 12; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo-box"><img src="logo.png" alt="Bastion Insights"></div>
        <nav>
            <div class="nav-item active">Executive Overview</div>
            <div class="nav-item" onclick="toggleDrawer()">Planning Lab</div>
            <div class="nav-item">Tax Strategies</div>
        </nav>
    </nav>

    <main class="main-stage">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 30px;">
            <h1>Executive Overview</h1>
            <button onclick="toggleDrawer()" style="background:var(--navy); color:white; padding:10px 20px; border:none; border-radius:8px; font-weight:700;">Edit Scenario</button>
        </div>
        <div class="grid">
            <div class="card kpi-card"><div>Terminal Wealth</div><div class="kpi-val" id="res-wealth" style="font-size:28px; font-weight:800;">$0</div></div>
            <div class="card kpi-card"><div>Lifetime Tax</div><div class="kpi-val" id="res-tax" style="font-size:28px; font-weight:800; color:#ef4444;">$0</div></div>
            <div class="card kpi-card"><div>Success Rate</div><div style="font-size:28px; font-weight:800;">94%</div></div>
            <div class="card chart-area"><canvas id="mainChart"></canvas></div>
            <div class="card engine-area">
                <div style="color:var(--gold); font-weight:800; font-size:12px; text-transform:uppercase;">Compliance & Tax Engine</div>
                <div id="logic-content" class="audit-trail"></div>
            </div>
        </div>
    </main>

    <div id="drawer" class="drawer">
        <h2 style="color: #3b82f6; font-size: 14px; margin-bottom: 20px;">SCENARIO A: PRIMARY</h2>
        
        <span class="section-header">HOUSEHOLD & DEPENDENTS</span>
        <select id="status" onchange="recalc()"><option value="married">Married Filing Jointly</option><option value="single">Single</option></select>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="deps" value="0" oninput="recalc()">
            <input type="number" id="age-now" value="35" oninput="recalc()">
            <input type="number" id="age-ret" value="65" oninput="recalc()">
        </div>

        <span class="section-header">INCOME STREAMS</span>
        <div id="income-cont"></div>
        <button class="btn-add" onclick="addRow('income')">+ ADD INCOME</button>

        <span class="section-header">ASSET INVENTORY</span>
        <div id="asset-cont"></div>
        <button class="btn-add" onclick="addRow('asset')">+ ADD ASSET</button>
        
        <button onclick="toggleDrawer()" style="width:100%; background:var(--navy); color:white; padding:15px; border:none; border-radius:10px; font-weight:800; margin-top:20px;">UPDATE AUDIT</button>
    </div>

    <script src="engine.js"></script>
    <script src="ui.js"></script>
</body>
</html>
