<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{background:#0B0F1A;color:white;font-family:Arial;display:flex}
.sidebar{width:200px;background:#111;padding:20px}
.nav-item{padding:10px;cursor:pointer}
.main{flex:1;padding:20px}
.card{background:#1a1a1a;padding:15px;margin-bottom:10px;border-radius:10px}
input,select{width:100%;margin-top:5px;padding:6px;background:#222;color:white;border:none}
button{margin-top:10px;padding:6px;background:#3B82F6;color:white;border:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.row{display:flex;gap:5px;margin-top:5px}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
<div class="nav-item" onclick="show('compare')">Compare</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card">Net Worth<div id="nw"></div></div>
<div class="card">Income<div id="inc"></div></div>
<div class="card">Expenses<div id="expOut"></div></div>
<div class="card">Success %<div id="succ"></div></div>
</div>
<canvas id="chart"></canvas>
<div id="taxExplain"></div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h3>Profile</h3>
<input id="profileName" placeholder="Profile Name">
<button onclick="saveProfile()">Save</button>
<button onclick="loadProfile()">Load</button>
</div>

<div class="card">
<h3>Income Streams</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Add Income</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Add Expense</button>
</div>

<div class="card">
<h3>Household</h3>
<input id="age" placeholder="Age">
</div>

<div class="card">
<h3>Assets</h3>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

<div class="card">
<h3>Tax</h3>
<select id="filing">
<option value="single">Single</option>
<option value="married_joint">Married Filing Jointly</option>
<option value="married_separate">Married Filing Separately</option>
<option value="head">Head of Household</option>
</select>
</div>

</div>

<!-- COMPARE -->
<div id="compare" style="display:none">
<div class="card">
<button onclick="saveScenario()">Save Scenario</button>
<div id="scenarios"></div>
<div id="delta"></div>
</div>
</div>

</div>

<script>

/* ===== STATE ===== */
let incomes=[],expenses=[],scenarios=[],chart;

/* ===== NAV ===== */
function show(v){
["dashboard","financials","compare"].forEach(x=>document.getElementById(x).style.display="none");
document.getElementById(v).style.display="block";
}

/* ===== NORMALIZE ===== */
function norm(a,f){
return a*(f==="monthly"?12:f==="biweekly"?26:1);
}

/* ===== TAX ENGINE ===== */
function calcTax(income, filing){

let brackets={
single:[[10000,0.1],[40000,0.12],[85000,0.22],[160000,0.24]],
married_joint:[[20000,0.1],[80000,0.12],[170000,0.22],[320000,0.24]],
married_separate:[[10000,0.1],[40000,0.12],[85000,0.22],[160000,0.24]],
head:[[15000,0.1],[55000,0.12],[90000,0.22],[170000,0.24]]
};

let b=brackets[filing];
let tax=0,prev=0;

for(let [limit,rate] of b){
if(income>limit){
tax+=(limit-prev)*rate;
prev=limit;
}else{
tax+=(income-prev)*rate;
break;
}
}

return tax;
}

/* ===== ADD INCOME (NO RESET BUG FIXED) ===== */
function addIncome(){
incomes.push({id:Date.now(),amount:0,freq:"yearly",cat:"salary"});
renderIncome();
}

/* ===== RENDER INCOME (PRESERVES VALUES) ===== */
function renderIncome(){
incomeList.innerHTML=incomes.map(i=>`
<div class="row">
<input value="${i.amount}" placeholder="Amount" 
oninput="iUpdate(${i.id},this.value)">
<select onchange="iFreq(${i.id},this.value)">
<option ${i.freq==="yearly"?"selected":""}>yearly</option>
<option ${i.freq==="monthly"?"selected":""}>monthly</option>
<option ${i.freq==="biweekly"?"selected":""}>biweekly</option>
</select>
<select onchange="iCat(${i.id},this.value)">
<option ${i.cat==="salary"?"selected":""}>salary</option>
<option ${i.cat==="bonus"?"selected":""}>bonus</option>
<option ${i.cat==="side"?"selected":""}>side</option>
<option ${i.cat==="rental"?"selected":""}>rental</option>
<option ${i.cat==="dividends"?"selected":""}>dividends</option>
</select>
</div>`).join("");
}

/* ===== ADD EXPENSE ===== */
function addExpense(){
expenses.push({id:Date.now(),amount:0,freq:"yearly",cat:"housing"});
renderExpense();
}

/* ===== EXPANDED CATEGORIES ===== */
function renderExpense(){
expenseList.innerHTML=expenses.map(e=>`
<div class="row">
<input value="${e.amount}" placeholder="Amount" 
oninput="eUpdate(${e.id},this.value)">
<select onchange="eFreq(${e.id},this.value)">
<option ${e.freq==="yearly"?"selected":""}>yearly</option>
<option ${e.freq==="monthly"?"selected":""}>monthly</option>
<option ${e.freq==="biweekly"?"selected":""}>biweekly</option>
</select>
<select onchange="eCat(${e.id},this.value)">
<option>housing</option>
<option>utilities</option>
<option>food</option>
<option>transportation</option>
<option>insurance</option>
<option>healthcare</option>
<option>debt</option>
<option>entertainment</option>
<option>travel</option>
<option>shopping</option>
<option>kids</option>
<option>other</option>
</select>
</div>`).join("");
}

/* ===== UPDATERS ===== */
function iUpdate(id,val){incomes.find(x=>x.id===id).amount=+val;update();}
function iFreq(id,val){incomes.find(x=>x.id===id).freq=val;update();}
function iCat(id,val){incomes.find(x=>x.id===id).cat=val;}

function eUpdate(id,val){expenses.find(x=>x.id===id).amount=+val;update();}
function eFreq(id,val){expenses.find(x=>x.id===id).freq=val;update();}
function eCat(id,val){expenses.find(x=>x.id===id).cat=val;}

/* ===== SIM ===== */
function simulate(){

let runs=100,results=[],path=[];

for(let r=0;r<runs;r++){

let bal=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);

let incRaw=incomes.reduce((t,i)=>t+norm(i.amount,i.freq),0);
let tax=calcTax(incRaw,filing.value);
let inc=incRaw-tax;

let exp=expenses.reduce((t,e)=>t+norm(e.amount,e.freq),0);

let arr=[];

for(let y=0;y<50;y++){

let ret=0.06 + (Math.random()-0.5)*0.2;
bal+=bal*ret + inc - exp;

arr.push(bal);
if(bal<=0) break;
}

results.push(arr.length);
if(r===0) path=arr;
}

let success=results.filter(x=>x>=30).length/runs;
return {success,path};
}

/* ===== UPDATE ===== */
function update(){

let sim=simulate();

let incRaw=incomes.reduce((t,i)=>t+norm(i.amount,i.freq),0);
let tax=calcTax(incRaw,filing.value);
let inc=incRaw-tax;

let exp=expenses.reduce((t,e)=>t+norm(e.amount,e.freq),0);

let nwVal=(+cash.value||0)+(+invest.value||0)-(+debt.value||0);

nw.innerText="$"+nwVal.toLocaleString();
inc.innerText="$"+inc.toLocaleString();
expOut.innerText="$"+exp.toLocaleString();
succ.innerText=(sim.success*100).toFixed(0)+"%";

taxExplain.innerHTML=`Tax: $${tax.toLocaleString()}`;

if(chart) chart.destroy();
chart=new Chart(chart,{
type:'line',
data:{labels:sim.path.map((_,i)=>i),datasets:[{data:sim.path}]}
});
}

/* ===== PROFILE SAVE ===== */
function saveProfile(){
let data={
incomes,expenses,
cash:cash.value,
invest:invest.value,
debt:debt.value
};
localStorage.setItem(profileName.value,JSON.stringify(data));
}

/* ===== PROFILE LOAD ===== */
function loadProfile(){
let data=JSON.parse(localStorage.getItem(profileName.value)||"{}");
if(!data) return;

incomes=data.incomes||[];
expenses=data.expenses||[];
cash.value=data.cash||0;
invest.value=data.invest||0;
debt.value=data.debt||0;

renderIncome();
renderExpense();
update();
}

/* ===== SCENARIO ===== */
function saveScenario(){
let sim=simulate();
scenarios.push({success:sim.success});
renderScenarios();
}

function renderScenarios(){
scenarios.innerHTML=scenarios.map((s,i)=>`
<div>Scenario ${i+1}: ${(s.success*100).toFixed(1)}%</div>
`).join("");

if(scenarios.length>=2){
let base=scenarios[0].success;
let last=scenarios[scenarios.length-1].success;
delta.innerHTML=`Δ ${(last-base)*100}%`;
}
}

/* ===== INIT ===== */
addIncome();
addExpense();
document.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",update));

</script>

</body>
</html>
