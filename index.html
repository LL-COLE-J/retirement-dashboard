<!-- REPLACE SCENARIOS PANEL -->
<div id="scenariosView" style="display:none">
<div class="card">

<h4>Longevity Risk</h4>
<input id="lifeExpA" placeholder="Life Expectancy (A)">
<input id="lifeExpB" placeholder="Life Expectancy (B)">

<h4>Market Risk</h4>
<input id="returnRateInput" placeholder="Return % (default 5)">
<input id="marketDrop" placeholder="Market Drop % (year 1)">

<h4>Spending Risk</h4>
<input id="inflationRate" placeholder="Inflation % (default 2.5)">
<input id="expenseShock" placeholder="Extra Annual Expense">

</div>
</div>

<script>

/* UPDATED MODEL WITH DEATH LOGIC */
function buildModel(total, exp){

let bal = total;
let t = [];

let rRate = ((+returnRateInput.value || 5)/100);
let inflation = ((+inflationRate.value || 2.5)/100);
let shock = (+expenseShock.value || 0);
let drop = ((+marketDrop.value || 0)/100);

let startAgeA = (+ageA.value || 65);
let startAgeB = (+ageB.value || 65);

let lifeA = (+lifeExpA.value || 90);
let lifeB = (+lifeExpB.value || 90);

for(let y=0; y<60; y++){

let ageAcur = startAgeA + y;
let ageBcur = startAgeB + y;

let aliveA = ageAcur < lifeA;
let aliveB = ageBcur < lifeB;

let income = 0;

/* PERSON A */
if(aliveA){
  if(ageAcur < (+retAgeA.value || 65)) income += (+incomeA.value || 0);
  if(ageAcur >= (+ssiAgeA.value || 67)) income += ((+ssiA.value || 0)*12);
}

/* PERSON B */
if(aliveB){
  if(ageBcur < (+retAgeB.value || 65)) income += (+incomeB.value || 0);
  if(ageBcur >= (+ssiAgeB.value || 67)) income += ((+ssiB.value || 0)*12);
}

/* EXPENSE ADJUSTMENT AFTER DEATH */
let baseExp = exp;
if(!aliveA || !aliveB){
  baseExp *= 0.7; // reduce household cost
}

let expenses = (baseExp + shock) * Math.pow(1+inflation, y);

/* MARKET DROP */
if(y===0) bal *= (1-drop);

/* BALANCE */
bal += bal*rRate + income - expenses;

t.push({
age: Math.min(ageAcur,ageBcur),
bal,
inc: income,
ex: expenses,
aliveA,
aliveB
});

if(bal <= 0) break;
}

return t;
}

/* ENHANCED AI INSIGHT */
function updateAll(){

let income = (+incomeA.value||0)+(+incomeB.value||0);
let total = (+cash.value||0)+(+investments.value||0);
let exp = (+expenses.value||0);

let m = buildModel(total,exp);

netWorth.innerText="$"+total.toLocaleString();
incomeTotal.innerText="$"+income.toLocaleString();
expenseTotal.innerText="$"+exp.toLocaleString();
years.innerText=m.length;

renderCharts(m);

/* SCENARIO ANALYSIS */
let ai=[];

/* longevity */
if((+lifeExpA.value||90) !== (+lifeExpB.value||90)){
ai.push("⚠️ Longevity mismatch: one spouse outlives the other → income drops, expenses partially remain");
}

/* market */
if((+marketDrop.value||0) > 10){
ai.push("⚠️ Market shock scenario applied → early portfolio drawdown risk");
}

/* spending */
if((+expenseShock.value||0) > 0){
ai.push("⚠️ Expense stress added → higher burn rate");
}

/* core */
if(m.length < 25){
ai.push("🚨 Plan fails early under current assumptions");
}else{
ai.push("✅ Plan holds under current scenario");
}

aiOutput.innerHTML = ai.join("<br><br>");
}

</script>
