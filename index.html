<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

/* MAIN */
.main{
  flex:1;
  display:flex;
  justify-content:center;
}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

/* LEFT */
.content{flex:2;}

/* RIGHT */
.side{flex:1;}

/* CARDS */
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

/* INPUT */
input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="logo.png">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
</div>

<div class="main">
<div class="wrapper">

<!-- LEFT -->
<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="grid">

<!-- INCOME -->
<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<!-- EXPENSE -->
<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<!-- TAX -->
<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<!-- DEPENDENTS -->
<div class="card">
<h4>Dependents</h4>
<input id="dependents" placeholder="Monthly cost" onblur="state.depCost=+this.value||0;updateAll()">
</div>

<!-- ACCOUNTS -->
<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance" onblur="state.accounts=+this.value||0;updateAll()">
</div>

<!-- ASSETS -->
<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash" onblur="updateAll()">
<input id="invest" placeholder="Investments" onblur="updateAll()">
<input id="debt" placeholder="Debt" onblur="updateAll()">
</div>

</div>

</div>

</div>

<!-- RIGHT PANEL -->
<div class="side">

<div class="card">
<h4>Status</h4>
<div id="status"></div>
</div>

<div class="card">
<h4>Failure Point</h4>
<div id="failure"></div>
</div>

<div class="card">
<h4>Action</h4>
<div id="action"></div>
</div>

</div>

</div>
</div>

<script>

/* STATE */
let state={
  incomes:[],
  expenses:[],
  filing:"single",
  depCost:0,
  accounts:0
};

function norm(a,f){return a*(f==="monthly"?12:f==="biweekly"?26:1);}
function money(n){return "$"+Number(n||0).toLocaleString();}

/* TAX */
function calcTax(income, filing){
  let brackets={
    single:[[10000,0.1],[40000,0.12],[85000,0.22]],
    married_joint:[[20000,0.1],[80000,0.12],[170000,0.22]],
    head:[[15000,0.1],[55000,0.12],[90000,0.22]]
  };
  let tax=0,prev=0;
  for(let [limit,rate] of brackets[filing]){
    if(income>limit){tax+=(limit-prev)*rate;prev=limit;}
    else{tax+=(income-prev)*rate;break;}
  }
  return tax;
}

/* CALC */
function calculate(){

let income=state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
let expenses=state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);

expenses+=state.depCost||0;

let tax=calcTax(income,state.filing);
let net=income-expenses-tax;

let netWorth=
(+cash.value||0)+
(+invest.value||0)-
(+debt.value||0)+
(state.accounts||0);

let savingsRate=income>0?((income-expenses)/income)*100:0;

return{income,expenses,net,netWorth,savingsRate};
}

/* UPDATE */
function updateAll(){

let d=calculate();

netWorth.innerText=money(d.netWorth);
income.innerText=money(d.income);
expensesOut.innerText=money(d.expenses);
savingsRate.innerText=d.savingsRate.toFixed(1)+"%";

/* STATUS */
let yearsSafe=d.net>0?(d.netWorth/(d.expenses||1)):0;

status.innerText=
yearsSafe>25?"Stable":
yearsSafe>15?"Moderate":
"At Risk";

failure.innerText=yearsSafe>0?"Runs out in "+yearsSafe.toFixed(1)+" yrs":"Already negative";

action.innerText=
d.net<0?"Reduce expenses":
d.savingsRate<15?"Increase savings":
"Maintain course";

}

/* STREAMS */
function addIncome(){
state.incomes.push({amount:0,freq:"yearly"});
renderStreams();
}
function addExpense(){
state.expenses.push({amount:0,freq:"yearly"});
renderStreams();
}

function renderStreams(){

incomeList.innerHTML=state.incomes.map((i,idx)=>`
<input value="${i.amount||""}"
onblur="state.incomes[${idx}].amount=+this.value||0;updateAll()">
`).join("");

expenseList.innerHTML=state.expenses.map((e,idx)=>`
<input value="${e.amount||""}"
onblur="state.expenses[${idx}].amount=+this.value||0;updateAll()">
`).join("");

}

/* NAV */
function showView(id,el){
["dashboard","financials"].forEach(v=>document.getElementById(v).style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

/* INIT */
window.onload=()=>{
state.incomes.push({amount:80000,freq:"yearly"});
state.expenses.push({amount:40000,freq:"yearly"});
renderStreams();
updateAll();
};

</script>

</body>
</html>
