<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bastion Insight | Lifetime Financial Path Planning</title>
  <meta name="description" content="Bastion Insight offers lifetime financial path planning for retirement readiness, tax strategy, RMD compliance, and legacy planning. Coming soon in private beta." />
  <meta name="robots" content="index,follow" />
  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2f;
      --line: rgba(255, 255, 255, 0.1);
      --text: #e8eef8;
      --muted: #9cafc7;
      --accent: #5dd6a9;
      --accent-2: #78a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(93, 214, 169, 0.2), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(120, 166, 255, 0.18), transparent 34%),
        linear-gradient(180deg, #07111f 0%, #091426 100%);
    }
    .card {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 36px;
      background: linear-gradient(180deg, rgba(16, 31, 53, 0.96), rgba(13, 27, 47, 0.96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    .tagline {
      margin: 12px 0 0;
      color: var(--accent);
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 700;
    }
    .copy {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
      max-width: 62ch;
    }
    .status {
      margin-top: 20px;
      color: var(--text);
      font-weight: 700;
    }
    .cta {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), #c9ffe8);
      color: #07111f;
      font-weight: 800;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(93, 214, 169, 0.3);
    }
    .subtle {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    .subtle a { color: var(--accent-2); }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Bastion Insight</div>
    <h1>Bastion Insight</h1>
    <p class="tagline">Lifetime financial path planning</p>
    <p class="copy">Retirement readiness, tax strategy, RMD compliance, legacy planning.</p>
    <p class="status">Coming soon · Private beta</p>
    <a class="cta" href="mailto:beta@bastioninsight.com?subject=Request%20Beta%20Access">Request Beta Access</a>
    <p class="subtle">Bastion app access is currently limited to private test environments.</p>
  </main>
</body>
</html>
