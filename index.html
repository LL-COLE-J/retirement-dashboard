<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#1e293b;
}

body{
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo{
  font-weight:600;
  font-size:18px;
  margin-bottom:20px;
}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:6px;
  color:var(--sub);
}

.nav-item.active{
  background:#0f172a;
  color:#fff;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  justify-content:center;
}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

/* LEFT CONTENT */
.content{
  flex:2;
}

/* RIGHT PANEL */
.sidepanel{
  flex:1;
}

/* CARDS */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}

/* INPUTS */
input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#0f172a;
  color:white;
  cursor:pointer;
}

/* SMALL TEXT */
.label{
  font-size:12px;
  color:var(--sub);
}

.value{
  font-weight:600;
  margin-top:4px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
  <img src="logo.png" style="width:100%;margin-bottom:10px;">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>

</div>

<div class="main">
<div class="wrapper">

<!-- LEFT -->
<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Years Safe</div><div id="years" class="value"></div></div>
</div>

<div class="card" id="retirementSummary"></div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">

<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>

<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>

<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">

</div>

</div>

</div>

<!-- RIGHT PANEL -->
<div class="sidepanel">

<div class="card">
<h4>Plan Summary</h4>
<div class="label">Savings Rate</div>
<div id="savingsRate" class="value"></div>

<div class="label">Monthly Burn</div>
<div id="burnRate" class="value"></div>
</div>

<div class="card">
<h4>Risk Signals</h4>
<div id="riskSignals"></div>
</div>

<div class="card">
<h4>Next Action</h4>
<div id="aiOutput"></div>
</div>

</div>

</div>
</div>

<script>

/* STATE */
let state={
  incomes:[],
  expenses:[],
  assets:{cash:0,invest:0,debt:0}
};

function norm(a,f){return a*(f==="monthly"?12:f==="biweekly"?26:1);}
function money(n){return "$"+Number(n||0).toLocaleString();}

/* CALC */
function calculate(){

let income=state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0);
let expenses=state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0);

let net=income-expenses;

let netWorth=
(+cash.value||0)+
(+invest.value||0);

let savingsRate=income>0?((income-expenses)/income)*100:0;

return{income,expenses,net,netWorth,savingsRate};
}

/* UPDATE */
function updateAll(){

let d=calculate();

let yearsSafe=d.net>0?(d.netWorth/(d.expenses||1)):0;

netWorth.innerText=money(d.netWorth);
income.innerText=money(d.income);
expensesOut.innerText=money(d.expenses);
years.innerText=yearsSafe.toFixed(1);

savingsRate.innerText=d.savingsRate.toFixed(1)+"%";
burnRate.innerText=money(d.expenses/12);

/* RISK */
let risks=[];
if(d.net<0) risks.push("Spending exceeds income");
if(d.savingsRate<10) risks.push("Low savings rate");
if(yearsSafe<15) risks.push("Short runway");

riskSignals.innerHTML=risks.join("<br>")||"No major risks";

/* AI */
aiOutput.innerHTML="Adjust savings or reduce expenses to improve runway";

}

/* STREAM INPUTS */
function addIncome(){
state.incomes.push({amount:0,freq:"yearly"});
renderStreams();
}

function addExpense(){
state.expenses.push({amount:0,freq:"yearly"});
renderStreams();
}

function renderStreams(){

incomeList.innerHTML=state.incomes.map((i,idx)=>`
<input value="${i.amount||""}"
onblur="state.incomes[${idx}].amount=+this.value||0;updateAll()">
`).join("");

expenseList.innerHTML=state.expenses.map((e,idx)=>`
<input value="${e.amount||""}"
onblur="state.expenses[${idx}].amount=+this.value||0;updateAll()">
`).join("");

}

/* NAV */
function showView(id,el){
["dashboard","financials"].forEach(v=>document.getElementById(v).style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
el.classList.add("active");
}

/* INIT */
window.onload=()=>{
state.incomes.push({amount:80000,freq:"yearly"});
state.expenses.push({amount:40000,freq:"yearly"});
renderStreams();
updateAll();
};

</script>

</body>
</html>
