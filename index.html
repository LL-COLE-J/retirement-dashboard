<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#0B0F1A;color:#E5E7EB;display:flex;height:100vh;}
.sidebar{width:220px;background:#0F172A;padding:20px;}
.nav-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;}
.nav-item.active{background:linear-gradient(135deg,#3B82F6,#6366F1);}
.main{flex:1;display:flex;}
.content{flex:1;padding:20px;overflow:auto;}
.card{background:#111827;padding:15px;border-radius:12px;margin-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.chartGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input{width:100%;padding:8px;margin-top:5px;background:#1F2937;border:none;color:white;border-radius:6px;}
button{margin-top:8px;padding:6px 10px;border:none;border-radius:6px;background:#3B82F6;color:white;cursor:pointer;}
.ai{width:260px;background:#0F172A;padding:15px;}
canvas{height:200px!important;}
</style>
</head>

<body>

<div class="sidebar">
<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card">Net Worth<div id="netWorth"></div></div>
<div class="card">Income<div id="income"></div></div>
<div class="card">Expenses<div id="expensesOut"></div></div>
<div class="card">Years<div id="years"></div></div>
</div>

<div class="grid">
<div class="card">Savings Rate<div id="savingsRate"></div></div>
<div class="card">Burn Rate<div id="burnRate"></div></div>
<div class="card">Years Safe<div id="yearsSafe"></div></div>
<div class="card">Decision<div id="decision"></div></div>
</div>

<div class="card">
<div id="retirementSummary"></div>
</div>

<div class="chartGrid">
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<canvas id="c3"></canvas>
<canvas id="c4"></canvas>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="card">

<h4>Person A</h4>
<input id="incomeA" placeholder="Income A">
<input id="ageA" placeholder="Age A">
<input id="retA" placeholder="Retirement Age A">

<h4>Person B</h4>
<input id="incomeB" placeholder="Income B">
<input id="ageB" placeholder="Age B">
<input id="retB" placeholder="Retirement Age B">

<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">

<h4>Expenses</h4>
<input id="exp" placeholder="Annual Expenses">

<!-- SAFE ADDITION (NO UI CHANGE) -->
<div style="margin-top:10px;">
<h4>Income Streams</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>

<h4>Expense Streams</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<button onclick="saveProfile()">Save Profile</button>
<div id="profileList"></div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="card">
<h4>Quick Scenarios</h4>
<button onclick="applyScenario('crash')">Market Crash</button>
<button onclick="applyScenario('inflation')">High Inflation</button>
<button onclick="applyScenario('longevity')">Live Longer</button>

<h4>Assumptions</h4>
<input id="returnRate" placeholder="Return % (default 5)">
<input id="inflation" placeholder="Inflation % (default 2.5)">
</div>
</div>

</div>

<div class="ai">
<h4>Advisor Insight</h4>
<div id="aiOutput"></div>
</div>

</div>

<script>

/* =========================
   STATE
========================= */
let state = {
  incomes: [],
  expenses: [],
  assets: { cash:0, invest:0, debt:0 }
};

/* HELPERS */
function norm(a,f){ return a*(f==="monthly"?12:f==="biweekly"?26:1); }
function money(n){ return "$"+Number(n||0).toLocaleString(); }

/* CALC */
function calculate(){

  let income = state.incomes.reduce((s,i)=>s+norm(i.amount,i.freq),0)
    || (+incomeA.value||0) + (+incomeB.value||0);

  let expenses = state.expenses.reduce((s,e)=>s+norm(e.amount,e.freq),0)
    || (+exp.value||0);

  let net = income - expenses;

  let netWorth =
    (+cash.value||0) +
    (+invest.value||0) -
    (state.assets.debt||0);

  let savingsRate = income>0 ? ((income-expenses)/income)*100 : 0;

  return { income, expenses, net, netWorth, savingsRate };
}

/* UPDATE */
function updateAll(){

  let d = calculate();

  let yearsSafe = d.net > 0 ? (d.netWorth/(d.expenses||1)) : 0;

  let decision = yearsSafe < 10 ? "FAIL" :
                 yearsSafe < 25 ? "RISK" : "SAFE";

  netWorth.innerText = money(d.netWorth);
  income.innerText = money(d.income);
  expensesOut.innerText = money(d.expenses);
  years.innerText = yearsSafe.toFixed(1);

  savingsRate.innerText = d.savingsRate.toFixed(1)+"%";
  burnRate.innerText = money(d.expenses/12);
  yearsSafe.innerText = yearsSafe.toFixed(1);
  decision.innerText = decision;

  retirementSummary.innerHTML = `
    Status: ${decision}<br>
    Net: ${money(d.net)}<br>
    Years Safe: ${yearsSafe.toFixed(1)}
  `;

  let ai=[];
  if(decision==="FAIL") ai.push("🚨 Retirement not viable.");
  else if(decision==="RISK") ai.push("⚠️ Plan fragile.");
  else ai.push("✅ Plan solid.");

  if(d.net < 0) ai.push("Spending exceeds income.");

  aiOutput.innerHTML = ai.join("<br><br>");
}

/* STREAM INPUTS */
function addIncome(){
  state.incomes.push({amount:0,freq:"yearly"});
  renderStreams();
}

function addExpense(){
  state.expenses.push({amount:0,freq:"yearly"});
  renderStreams();
}

function renderStreams(){

  incomeList.innerHTML = state.incomes.map((i,idx)=>`
    <input value="${i.amount||""}"
    onblur="state.incomes[${idx}].amount=+this.value||0;updateAll()">
  `).join("");

  expenseList.innerHTML = state.expenses.map((e,idx)=>`
    <input value="${e.amount||""}"
    onblur="state.expenses[${idx}].amount=+this.value||0;updateAll()">
  `).join("");
}

/* NAV */
function showView(id,el){
  ["dashboard","financials","scenarios"].forEach(v=>{
    document.getElementById(v).style.display="none";
  });
  document.getElementById(id).style.display="block";
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  el.classList.add("active");
}

/* INIT */
window.onload=()=>{
  state.incomes.push({amount:80000,freq:"yearly"});
  state.expenses.push({amount:40000,freq:"yearly"});
  renderStreams();
  updateAll();
};

</script>

</body>
</html>
