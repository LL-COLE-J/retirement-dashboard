<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion Insights</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#0f172a;
}

body{background:var(--bg);display:flex;height:100vh;color:var(--text);}

.sidebar{
  width:240px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:20px;
}

.logo img{width:100%;margin-bottom:20px;}

.nav-item{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  color:var(--sub);
  margin-bottom:6px;
}
.nav-item.active{background:var(--accent);color:#fff;}

.main{flex:1;display:flex;justify-content:center;}

.wrapper{
  width:1200px;
  display:flex;
  gap:20px;
  padding:20px;
}

.content{flex:2;}
.side{flex:1;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

input, select{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

.label{font-size:12px;color:var(--sub);}
.value{font-weight:600;margin-top:4px;}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">
  <img src="./logo.png" onerror="this.style.display='none'">
</div>

<div class="nav-item active" onclick="showView('dashboard',this)">Dashboard</div>
<div class="nav-item" onclick="showView('financials',this)">Financials</div>
<div class="nav-item" onclick="showView('scenarios',this)">Scenarios</div>
</div>

<div class="main">
<div class="wrapper">

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="grid">
<div class="card"><div class="label">Net Worth</div><div id="netWorth" class="value"></div></div>
<div class="card"><div class="label">Income</div><div id="income" class="value"></div></div>
<div class="card"><div class="label">Expenses</div><div id="expensesOut" class="value"></div></div>
<div class="card"><div class="label">Savings Rate</div><div id="savingsRate" class="value"></div></div>
</div>
</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">
<div class="grid">

<div class="card">
<h4>Income</h4>
<div id="incomeList"></div>
<button onclick="addIncome()">Add Income</button>
</div>

<div class="card">
<h4>Expenses</h4>
<div id="expenseList"></div>
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h4>Tax</h4>
<select id="filing" onchange="state.filing=this.value;updateAll()">
<option value="single">Single</option>
<option value="married_joint">Married</option>
<option value="head">Head</option>
</select>
</div>

<div class="card">
<h4>Dependents</h4>
<input id="dependents" type="number">
</div>

<div class="card">
<h4>Accounts</h4>
<input id="accBalance" placeholder="Balance">
</div>

<div class="card">
<h4>Assets</h4>
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>

</div>
</div>

<!-- SCENARIOS -->
<div id="scenarios" style="display:none">
<div class="grid">

<div class="card">
<h4>Age & Retirement</h4>
<input id="currentAge" placeholder="Current Age" value="40">
<input id="retirementAge" placeholder="Retirement Age" value="65">
<input id="lifeExpectancy" placeholder="Life Expectancy" value="90">
</div>

<div class="card">
<h4>Adjustments</h4>
<input id="incomeAdjust" placeholder="Income Change (%)">
<input id="expenseAdjust" placeholder="Expense Change (%)">
<input id="returnAdjust" placeholder="Return Change (%)">
</div>

</div>
</div>

</div>

<div class="side">

<div class="card"><h4>Status</h4><div id="status"></div></div>
<div class="card"><h4>Failure</h4><div id="failure"></div></div>
<div class="card"><h4>Action</h4><div id="action"></div></div>
<div class="card"><h4>AI</h4><div id="aiOutput"></div></div>

</div>

</div>
</div>

<script>

// =========================
// GLOBAL STATE (ONE SOURCE)
// =========================
let state = {
  incomes: [],
  expenses: [],
  events: [],
  accounts: [],
  dependents: [],
  assets: { cash:0, invest:0, debt:0 },
  filing: "single",
  timeline:{ currentAge:40, retirementAge:65, lifeExpectancy:90 }
};

// =========================
// HELPERS
// =========================
function norm(a,f){
  a = +a || 0;
  return a*(f==="monthly"?12:f==="biweekly"?26:1);
}

// =========================
// CORE CALC
// =========================
function calculate(){

  let income = (state.incomes||[]).reduce((s,i)=>{
    return s + norm(i.amount,i.freq);
  },0);

  let expenses = (state.expenses||[]).reduce((s,e)=>{
    return s + norm(e.amount,e.freq);
  },0);

  // dependents
  expenses += (state.dependents||[]).reduce((s,d)=>{
    return s + (+d.cost||0);
  },0);

  // contributions
  let contrib = (state.accounts||[]).reduce((s,a)=>{
    return s + (+a.contrib||0);
  },0);

  let match = (state.accounts||[]).reduce((s,a)=>{
    return s + ((+a.contrib||0)*(+a.match||0)/100);
  },0);

  let totalSavings = contrib + match;

  let net = income - expenses - contrib;

  let accountValue = (state.accounts||[]).reduce((s,a)=>{
    return s + (+a.balance||0);
  },0);

  let netWorth =
    accountValue +
    (+state.assets.cash||0) +
    (+state.assets.invest||0) -
    (+state.assets.debt||0);

  let savingsRate = income>0 ? ((income-expenses)/income)*100 : 0;

  return { income, expenses, net, netWorth, savingsRate, totalSavings };
}

// =========================
// TIMELINE ENGINE
// =========================
function runTimeline(d){

  let age = state.timeline.currentAge;
  let retire = state.timeline.retirementAge;
  let end = state.timeline.lifeExpectancy;

  let nw = d.netWorth;
  let failAge = null;

  for(let a=age;a<=end;a++){

    let working = a < retire;

    let income = working ? d.income : 0;
    let expenses = d.expenses * Math.pow(1.03, a-age);

    (state.events||[]).forEach(ev=>{
      if(ev.year === (a-age)){
        if(ev.type==="expense") expenses += ev.value||0;
        if(ev.type==="income") income += ev.value||0;
      }
    });

    let flow = income - expenses;
    nw = nw*1.06 + flow;

    if(nw <= 0 && failAge===null) failAge = a;
  }

  return {
    success: failAge===null,
    failureAge: failAge
  };
}

// =========================
// MONTE CARLO
// =========================
function runMonteCarlo(d){

  let sims = 150;
  let success = 0;

  let age = state.timeline.currentAge;
  let retire = state.timeline.retirementAge;
  let end = state.timeline.lifeExpectancy;

  for(let i=0;i<sims;i++){

    let nw = d.netWorth;

    for(let a=age;a<=end;a++){

      let r = (Math.random()*0.12)-0.02;

      let income = a<retire ? d.income : 0;
      let expenses = d.expenses * Math.pow(1.03, a-age);

      nw = nw*(1+r) + (income-expenses);

      if(nw<=0) break;
    }

    if(nw>0) success++;
  }

  return (success/sims)*100;
}

// =========================
// ENGINE PIPELINE
// =========================
function runEngine(){

  const base = calculate();
  const timeline = runTimeline(base);
  const mc = runMonteCarlo(base);

  return {
    ...base,
    ...timeline,
    monteCarlo: mc
  };
}

// =========================
// UI UPDATE
// =========================
function updateAll(){

  let d = runEngine();

  netWorth.innerText = "$"+Math.round(d.netWorth);
  income.innerText = "$"+Math.round(d.income);
  expensesOut.innerText = "$"+Math.round(d.expenses);
  savingsRate.innerText = d.savingsRate.toFixed(1)+"%";

  status.innerText =
    d.success ? "On Track" : "Fails at age "+d.failureAge;

  failure.innerText =
    "Success Rate: "+d.monteCarlo.toFixed(1)+"%";

  action.innerText =
    d.monteCarlo>80 ? "Strong plan"
    : d.monteCarlo>60 ? "Moderate risk"
    : "High risk — adjust plan";

  aiOutput.innerText =
    d.success ? "Plan looks stable"
    : "You may outlive your money";
}

// =========================
// INPUT HOOKS
// =========================
dependents.oninput = ()=>{
  state.dependents = [{cost:+dependents.value||0}];
  updateAll();
};

accBalance.oninput = ()=>{
  if(state.accounts.length===0) state.accounts.push({});
  state.accounts[0].balance = +accBalance.value||0;
  updateAll();
};

["cash","invest","debt"].forEach(id=>{
  document.getElementById(id).oninput = ()=>{
    state.assets[id] = +document.getElementById(id).value||0;
    updateAll();
  };
});

["currentAge","retirementAge","lifeExpectancy"].forEach(id=>{
  document.getElementById(id).oninput = ()=>{
    state.timeline[id==="currentAge"?"currentAge":
                   id==="retirementAge"?"retirementAge":"lifeExpectancy"]
    = +document.getElementById(id).value||0;
    updateAll();
  };
});

// =========================
// NAV
// =========================
function showView(v,e){
  ["dashboard","financials","scenarios"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(v).style.display="block";

  document.querySelectorAll(".nav-item")
    .forEach(n=>n.classList.remove("active"));

  e.classList.add("active");
}

// =========================
// INIT
// =========================
window.onload = ()=>{
  updateAll();
};

</script>

</body>
</html>
