<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastion Insights | Planning Lab Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
            --text-main: #0f172a; --text-sub: #64748b;
            --accent: #1e293b; --success: #10b981; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--border); padding: 32px 24px; display: flex; flex-direction: column; }
        .logo { font-weight: 800; font-size: 22px; letter-spacing: -1px; margin-bottom: 48px; color: var(--accent); }
        .logo span { font-size: 10px; display: block; color: var(--text-sub); letter-spacing: 2px; margin-top: -4px; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--text-sub); margin-bottom: 8px; font-weight: 600; transition: 0.2s; }
        .nav-item:hover { background: #f1f5f9; color: var(--accent); }
        .nav-item.active { background: var(--accent); color: #fff; }

        /* Main Layout */
        .main { flex: 1; overflow-y: auto; padding: 40px; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 32px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h3 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sub); margin-bottom: 20px; }

        /* Form Elements */
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--accent); }

        /* Advisor Lab */
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; margin-bottom: 16px; }
        .status-pill.optimal { background: #dcfce7; color: var(--success); }
        .ai-box { background: #f1f5f9; padding: 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; border-left: 4px solid var(--accent); }
        
        .big-price { font-size: 32px; font-weight: 800; color: var(--accent); margin: 20px 0; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">BASTION <span>PLANNING LAB</span></div>
    <div class="nav-item active" onclick="switchTab('dashboard', this)">Dashboard</div>
    <div class="nav-item" onclick="switchTab('financials', this)">Financials</div>
    <div class="nav-item" onclick="switchTab('markets', this)">Markets</div>
</div>

<div class="main">
    <div class="container">
        <div class="content-area">
            
            <div id="dashboard-tab">
                <div class="card">
                    <h3>Wealth Projection</h3>
                    <canvas id="mainChart" height="150"></canvas>
                </div>
            </div>

            <div id="financials-tab" style="display:none;">
                <div class="card">
                    <h3>Income & Tax Profile</h3>
                    <div class="input-group">
                        <label>Annual Gross Income</label>
                        <input type="number" id="income-input" value="120000" oninput="updateAll()">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="input-group">
                            <label>Filing Status</label>
                            <select id="filing-status" onchange="updateAll()">
                                <option value="single">Single</option>
                                <option value="married">Married Filing Jointly</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>State</label>
                            <select id="state-res" onchange="updateAll()">
                                <option value="TN">Tennessee (0%)</option>
                                <option value="TX">Texas (0%)</option>
                                <option value="CA">California</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div id="markets-tab" style="display:none;">
                <div class="card">
                    <h3>Live Market Pulse</h3>
                    <div class="input-group">
                        <label>Asset Symbol (e.g., bitcoin, ethereum)</label>
                        <input type="text" id="ticker-input" value="bitcoin">
                    </div>
                    <button onclick="refreshTicker()">Get Live Price</button>
                    <div id="ticker-output" class="big-price">--</div>
                    <p style="font-size: 11px; color: var(--text-sub);">Real-time data provided via CoinGecko API</p>
                </div>
            </div>
        </div>

        <div class="advisor-area">
            <h3>Advisor Lab</h3>
            <div class="card">
                <div id="status-badge" class="status-pill optimal">SYSTEM OPTIMAL</div>
                <div class="input-group">
                    <label>Estimated Tax Liability</label>
                    <div id="tax-display" style="font-size: 18px; font-weight: 700;">$0</div>
                </div>
                <div class="input-group">
                    <label>Effective Rate</label>
                    <div id="rate-display" style="font-size: 14px; font-weight: 600; color: var(--text-sub);">0%</div>
                </div>
                <div class="ai-box" id="ai-insight">
                    Analyzing your 2026 tax strategy...
                </div>
            </div>
        </div>
    </div>
</div>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
