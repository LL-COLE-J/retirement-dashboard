<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avora</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

:root{
--bg:#0B0F1A;
--sidebar:#0F172A;
--card:#111827;
--card-light:#1F2937;
--text:#E5E7EB;
--sub:#9CA3AF;
--border:rgba(255,255,255,0.05);
--grad:linear-gradient(135deg,#3B82F6,#6366F1);
}

body{background:var(--bg);color:var(--text);display:flex;height:100vh;}

.sidebar{width:220px;background:var(--sidebar);padding:20px;}
.logo{margin-bottom:20px;font-weight:600;}
.nav-item{margin:8px 0;cursor:pointer;color:var(--sub);}
.nav-item.active{color:white;}

.main{flex:1;display:flex;flex-direction:column;}
.topbar{padding:20px;border-bottom:1px solid var(--border);}
.content{padding:20px;overflow:auto;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;}

.card{
background:var(--card);
padding:20px;
border-radius:12px;
}

.section{margin-top:20px;}
.kpi{font-size:22px;margin-top:5px;}

/* FLOATING INPUT */
.field{
position:relative;
margin-top:12px;
}

.field input{
width:100%;
padding:16px 10px 6px 10px;
background:var(--card-light);
border:none;
border-radius:8px;
color:white;
}

.field label{
position:absolute;
top:50%;
left:10px;
transform:translateY(-50%);
color:var(--sub);
font-size:13px;
transition:0.2s;
pointer-events:none;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label{
top:5px;
font-size:11px;
color:#3B82F6;
}

button{
margin-top:15px;
padding:10px;
border:none;
background:var(--grad);
color:white;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item active" onclick="showView('dashboard',event)">Dashboard</div>
<div class="nav-item" onclick="showView('inputs',event)">Financials</div>
</div>

<div class="main">
<div class="topbar">Retirement Overview</div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboardView">

<div class="grid">
<div class="card">Net Worth<div id="netWorth" class="kpi">$0</div></div>
<div class="card">Surplus<div id="surplus" class="kpi">$0</div></div>
<div class="card">Years<div id="years" class="kpi">--</div></div>
<div class="card">Score<div id="score" class="kpi">--</div><div id="scoreHint"></div></div>
</div>

<div class="section card">
<h3>Projection</h3>
<canvas id="projectionChart"></canvas>
</div>

<div class="section card">
<h3>Cashflow</h3>
<canvas id="cashflowChart"></canvas>
</div>

<div class="section card">
<h3>How This Is Calculated</h3>
<div id="calcDetails" style="font-size:13px;color:#9CA3AF;margin-top:10px;"></div>
</div>

</div>

<!-- INPUT VIEW -->
<div id="inputView" style="display:none">

<div class="card">
<h3>Financial Snapshot</h3>

<div class="field"><input id="cash" placeholder=" "><label>Cash</label></div>
<div class="field"><input id="investments" placeholder=" "><label>Investments</label></div>
<div class="field"><input id="retirement" placeholder=" "><label>401k / IRA</label></div>

<div class="field"><input id="income" placeholder=" "><label>Monthly Income</label></div>
<div class="field"><input id="ssEstimate" placeholder=" "><label>Social Security (optional)</label></div>
<div class="field"><input id="expenses" placeholder=" "><label>Monthly Expenses</label></div>

<select id="maritalStatus" style="margin-top:10px;width:100%;padding:10px;background:#1F2937;color:white;border:none;border-radius:8px;">
<option value="single">Single</option>
<option value="married">Married</option>
</select>

<div class="field"><input id="income2" placeholder=" "><label>Spouse Income</label></div>
<div class="field"><input id="insurancePayout" placeholder=" "><label>Insurance Payout</label></div>
<div class="field"><input id="insuranceIncome" placeholder=" "><label>Insurance Monthly</label></div>

<button onclick="saveData()">Update Dashboard</button>

</div>

</div>

</div>
</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
authDomain:"retirement-dashboard-4c0d3.firebaseapp.com",
projectId:"retirement-dashboard-4c0d3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let projectionChart,cashflowChart;

/* NAV */
function showView(v,e){
dashboardView.style.display="none";
inputView.style.display="none";

if(v==="dashboard") dashboardView.style.display="block";
if(v==="inputs") inputView.style.display="block";

document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
e.target.classList.add("active");
}

/* ENGINE */
function buildModel(inputs){

let{liquidAssets,income,income2=0,expenses,maritalStatus,insurancePayout,insuranceIncome,assumptions}=inputs;

let balance=liquidAssets;
let timeline=[];
let combined=income+(maritalStatus==="married"?income2:0);

for(let y=0;y<assumptions.years;y++){

let yearly=combined*12;

if(maritalStatus==="married"&&y>20){
yearly=Math.max(income,income2)*12;
if(y===21) balance+=insurancePayout;
yearly+=insuranceIncome*12;
}

let exp=expenses*12*Math.pow(1+assumptions.inflation,y);
let growth=balance*assumptions.returnRate;

balance+=growth+yearly-exp;

timeline.push({y,balance,income:yearly,expenses:exp});
if(balance<=0) break;
}

return{success:balance>0,years:timeline.length,ending:balance,timeline};
}

/* SAVE */
function saveData(){

let cash=+cash.value||0;
let inv=+investments.value||0;
let ret=+retirement.value||0;
let total=cash+inv+ret;

let inc=+income.value||0;
let ss=+ssEstimate.value||inc*0.4;
let exp=+expenses.value||0;

let model=buildModel({
liquidAssets:total,
income:ss,
income2:+income2.value||0,
expenses:exp,
maritalStatus:maritalStatus.value,
insurancePayout:+insurancePayout.value||0,
insuranceIncome:+insuranceIncome.value||0,
assumptions:{years:40,returnRate:0.05,inflation:0.025}
});

netWorth.innerText="$"+total.toLocaleString();
surplus.innerText="$"+(inc-exp).toLocaleString();
years.innerText=model.years;
score.innerText=model.success?"80":"40";
scoreHint.innerText=model.success?"Sustainable":"Risk";

renderCharts(model);

calcDetails.innerHTML=
"Assets grow at 5% annually. Expenses inflate at 2.5%.<br>" +
"Income transitions to Social Security if provided.<br>" +
"Survivor logic applies after year 20 if married.";

db.collection("profiles").doc("main").set({cash,inv,ret,inc,ss,exp});
}

/* CHARTS */
function renderCharts(m){

let yrs=m.timeline.map(t=>t.y);
let bal=m.timeline.map(t=>t.balance);
let inc=m.timeline.map(t=>t.income);
let exp=m.timeline.map(t=>t.expenses);

if(projectionChart)projectionChart.destroy();
projectionChart=new Chart(projectionChart,{
type:"line",
data:{labels:yrs,datasets:[{data:bal,borderColor:"#3B82F6"}]}
});

if(cashflowChart)cashflowChart.destroy();
cashflowChart=new Chart(cashflowChart,{
type:"line",
data:{labels:yrs,datasets:[
{data:inc,borderColor:"#22C55E"},
{data:exp,borderColor:"#EF4444"}
]}
});
}

</script>

</body>
</html>
