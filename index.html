<!DOCTYPE html>
<html>
<head>
  <title>Retirement Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      background:#0f172a;
      color:white;
      margin:0;
    }
    .container {
      padding:20px;
      max-width:800px;
      margin:auto;
    }
    .card {
      background:#1e293b;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }
    input {
      width:100%;
      padding:8px;
      margin-top:5px;
      border-radius:6px;
      border:none;
    }
    button {
      padding:10px;
      margin-top:10px;
      background:#3b82f6;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
    .stat {
      font-size:22px;
      margin-top:5px;
    }
    .row {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .col {
      flex:1;
      min-width:150px;
    }
    .row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:stretch;
}
  </style>
</head>

<body>

<div class="container">

  <h2>Retirement Dashboard</h2>

  <!-- KPI ROW -->
 <div class="row">
  <div class="card col">
    Net Worth
    <div id="netWorth" class="stat">$0</div>
  </div>

  <div class="card col">
    Monthly Surplus
    <div id="surplus" class="stat">$0</div>
  </div>

  <div class="card col">
    Years Covered
    <div id="years" class="stat">--</div>
  </div>

  <div class="card col">
  Retirement Score
  <div id="score" class="stat">--</div>
  <div id="scoreHint" style="font-size:12px; opacity:.7;"></div>

  <div style="margin-top:8px; height:6px; background:#111; border-radius:4px;">
    <div id="scoreBar" style="height:6px; width:0%; border-radius:4px;"></div>
  </div>
</div>

  <!-- INPUT -->
  <div class="card">
    <h3>Financial Snapshot</h3>

    <input id="savings" placeholder="Total Savings">
    <input id="income" placeholder="Monthly Income">
    <input id="expenses" placeholder="Monthly Expenses">

    <button onclick="saveData()">Save</button>
  </div>

  <!-- SCENARIO -->
  <div class="card">
    <h3>Scenario</h3>

    <input id="scSavings" placeholder="Savings">
    <input id="scSpend" placeholder="Monthly Spend">

    <button onclick="runScenario()">Run</button>

    <div id="scenarioResult" style="margin-top:10px;"></div>
  </div>
 <div class="card">
  <h3>Advisor Review</h3>

  <textarea id="advisorInput" placeholder="Paste what the advisor recommended..."></textarea>

  <button onclick="analyzeAdvisor()">Analyze</button>

  <div id="advisorOutput" style="margin-top:10px;"></div>
</div>
<div class="card">
  <h3>Advisor Summary</h3>

  <button onclick="generateSummary()">Generate Summary</button>

  <div id="summaryOutput" style="margin-top:10px;"></div>
</div>

  <div class="card">
  <h3>Export</h3>

  <button onclick="exportSummary()">Download Summary</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAyCyCesDBGytZw4pqItYqxjUJ_ENFC7mc",
  authDomain: "retirement-dashboard-4c0d3.firebaseapp.com",
  projectId: "retirement-dashboard-4c0d3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* SAVE */
function saveData(){
  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let surplus = i - e;
  let years = e > 0 ? s / (e * 12) : 0;
  let score = Math.min(100, Math.max(0, (s / (e * 12 * 25)) * 100));
let hint = "";

if (score >= 80) hint = "Strong position";
else if (score >= 60) hint = "On track, but watch spending";
else hint = "Needs adjustment";
document.getElementById("summaryOutput").innerHTML = "";
document.getElementById("scoreHint").innerText = hint;
  document.getElementById("netWorth").innerText = `$${s.toLocaleString()}`;
  document.getElementById("surplus").innerText = `$${surplus}`;
  document.getElementById("years").innerText = `${Math.round(years)} yrs`;
  document.getElementById("score").innerText = `${Math.round(score)}/100`;
let color = score >= 80 ? "#22c55e" : score >= 60 ? "#eab308" : "#ef4444";

let bar = document.getElementById("scoreBar");
bar.style.width = `${score}%`;
bar.style.background = color;
  db.collection("profiles").doc("main").set({
    savings: s,
    income: i,
    expenses: e
  });
}

/* LOAD */
window.onload = async () => {
  let doc = await db.collection("profiles").doc("main").get();

  if(doc.exists){
    let d = doc.data();

    document.getElementById("savings").value = d.savings || "";
    document.getElementById("income").value = d.income || "";
    document.getElementById("expenses").value = d.expenses || "";

    saveData();
  }
};

/* SCENARIO */
function runScenario(){
  let savings = +document.getElementById("scSavings").value;
  let spend = +document.getElementById("scSpend").value * 12;

  let years = spend > 0 ? savings / spend : 0;
  let endAge = 65 + years; // simple assumption

  let status = "";
  let message = "";

  if (years > 25) {
    status = "🟢 Strong";
    message = "You have flexibility and buffer.";
  } else if (years > 15) {
    status = "🟡 Moderate";
    message = "Plan works but not much margin.";
  } else {
    status = "🔴 Risk";
    message = "High risk of running out early.";
  }

  document.getElementById("scenarioResult").innerHTML =
    `Lasts ~ ${Math.round(years)} years<br>
     Approx age: ${Math.round(endAge)}<br>
     ${status}<br>
     <small>${message}</small>`;
}
 
  function analyzeAdvisor(){
  let text = document.getElementById("advisorInput").value;

  if (!text) {
    alert("Paste something first");
    return;
  }

  document.getElementById("advisorOutput").innerHTML = `
    <strong>What to look for:</strong><br>
    • What are the fees?<br>
    • Is there a lock-in period?<br>
    • What happens in a downturn?<br>
    • Is this necessary or just optional?<br><br>

    <em>Paste this into ChatGPT Advisor Agent for full breakdown</em>
  `;
}

  function exportSummary(){

  let s = +document.getElementById("savings").value;
  let i = +document.getElementById("income").value;
  let e = +document.getElementById("expenses").value;

  let surplus = i - e;
  let years = e > 0 ? s / (e * 12) : 0;
  let score = Math.round((s / (e * 12 * 25)) * 100);

  let status = score >= 80 ? "Strong" :
               score >= 60 ? "Moderate" : "At Risk";

  let content = `
RETIREMENT SUMMARY
---------------------------

Net Worth: $${s.toLocaleString()}
Monthly Surplus: $${surplus}
Years Covered: ${Math.round(years)}

Retirement Readiness: ${status} (${score}/100)

KEY QUESTIONS:
- What assumptions are used for returns?
- What are total fees?
- What happens in a downturn?
- How flexible is this plan?

Generated from Retirement Dashboard
`;

  let blob = new Blob([content], { type: "text/plain" });
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "retirement-summary.txt";
  a.click();

  URL.revokeObjectURL(url);
}
  
</script>

</body>
</html>
