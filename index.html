<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Avora</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#F6F8FB;color:#111827;font-family:Inter,system-ui;display:flex}
.sidebar{width:220px;background:#fff;border-right:1px solid #E6EAF0;padding:20px}
.logo{font-size:18px;font-weight:600;margin-bottom:24px}
.nav-item{padding:10px;border-radius:8px;cursor:pointer;color:#6B7280}
.nav-item:hover{background:#F3F4F6;color:#111827}
.main{flex:1;padding:28px;max-width:1300px;margin:auto}

.metrics{display:flex;gap:12px;margin-bottom:20px}
.metric{flex:1;background:#fff;padding:14px;border-radius:14px;border:1px solid #E6EAF0}
.metric-label{font-size:12px;color:#6B7280}
.metric-value{font-size:20px;font-weight:600;margin-top:6px}

.main-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#fff;padding:20px;border-radius:18px;border:1px solid #E6EAF0}
.side-panel{display:flex;flex-direction:column;gap:14px}
.panel-card{background:#fff;padding:16px;border-radius:14px;border:1px solid #E6EAF0}

.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.module{background:#fff;padding:16px;border-radius:14px;border:1px solid #E6EAF0;cursor:pointer}
.module:hover{background:#F3F4F6}

.card{background:#fff;padding:18px;border-radius:14px;border:1px solid #E6EAF0;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 140px 160px;gap:10px;margin-bottom:10px}

input,select{padding:10px;border:1px solid #E6EAF0;border-radius:8px}
button{margin-top:8px;padding:8px 12px;background:#5B8DEF;color:white;border:none;border-radius:6px;cursor:pointer}
</style>
</head>

<body>

<div class="sidebar">
<div class="logo">AVORA</div>
<div class="nav-item" onclick="show('dashboard')">Dashboard</div>
<div class="nav-item" onclick="show('financials')">Financials</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">

<div class="metrics">
<div class="metric"><div class="metric-label">Net Worth</div><div id="nw" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Income</div><div id="inc" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Expenses</div><div id="expOut" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Savings Rate</div><div id="saveRate" class="metric-value"></div></div>
<div class="metric"><div class="metric-label">Status</div><div id="succ" class="metric-value"></div></div>
</div>

<div class="main-grid">

<div class="chart-card">
<canvas id="chart"></canvas>
</div>

<div class="side-panel">
<div class="panel-card"><h4>Savings</h4><div id="savingsOut"></div></div>
<div class="panel-card"><h4>AI Insights</h4><div id="milestonesOut"></div></div>
<div class="panel-card"><h4>Top Spending</h4><div id="categoryOut"></div></div>
<div class="panel-card"><h4>Tax</h4><div id="taxExplain"></div></div>
</div>

</div>

<div class="modules">
<div class="module" onclick="openModule('Chance of Success')">Chance of Success</div>
<div class="module" onclick="openModule('Cash Flow')">Cash Flow</div>
<div class="module" onclick="openModule('Spending Breakdown')">Spending Breakdown</div>
<div class="module" onclick="openModule('Milestones')">Milestones</div>
<div class="module" onclick="openModule('Tax Analytics')">Tax Analytics</div>
<div class="module" onclick="openModule('Scenario Compare')">Scenario Compare</div>
</div>

</div>

<!-- FINANCIALS -->
<div id="financials" style="display:none">

<div class="card">
<h3>Income</h3>
<div id="incomeList"></div>
<button onclick="addIncome()">+ Add</button>
<button onclick="clearIncome()">Clear</button>
</div>

<div class="card">
<h3>Expenses</h3>
<div id="expenseList"></div>
<button onclick="addExpense()">+ Add</button>
<button onclick="clearExpenses()">Clear</button>
</div>

<div class="card">
<h3>Accounts</h3>
<div id="accountList"></div>
<button onclick="addAccount()">+ Add</button>
<button onclick="clearAccounts()">Clear</button>
</div>

<div class="card">
<h3>Dependents</h3>
<div id="dependentList"></div>
<button onclick="addDependent()">+ Add</button>
<button onclick="clearDependents()">Clear</button>
</div>

<div class="card">
<h3>Assets</h3>
<div class="row">
<input id="cash" placeholder="Cash">
<input id="invest" placeholder="Investments">
<input id="debt" placeholder="Debt">
</div>
</div>

<div class="card">
<h3>Profile</h3>
<button onclick="manualSave()">Save</button>
<button onclick="manualLoad()">Load</button>
</div>

</div>

</div>

<script src="modules.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>

</body>
</html>
